function addSalon() {
  const nombre   = (document.getElementById('ns-nombre')?.value||'').trim();
  const prefijo  = (document.getElementById('ns-prefijo')?.value||'').trim().toUpperCase();
  const cantidad = parseInt(document.getElementById('ns-cantidad')?.value) || 0;
  const precio   = parseFloat(document.getElementById('ns-precio')?.value) || 0;
  const color    = document.getElementById('ns-color')?.value || '#4a9eff';

  if (!nombre)                             { toast('Escribe un nombre para el salón',        'danger','fa-exclamation'); return; }
  if (!/^[A-Z]{1,3}$/.test(prefijo))      { toast('Prefijo inválido: 1-3 letras (ej: T, TN)','danger','fa-exclamation'); return; }
  if (cantidad < 1)                        { toast('La cantidad de mesas debe ser al menos 1','danger','fa-exclamation'); return; }

  if (!db.mesas)          db.mesas = { salones: [] };
  if (!db.mesas.salones)  db.mesas.salones = [];

  if (db.mesas.salones.some(s => s.prefijo === prefijo)) {
    toast(`El prefijo "${prefijo}" ya está en uso por otro salón`, 'danger', 'fa-triangle-exclamation'); return;
  }
  if (db.mesas.salones.some(s => s.nombre.toLowerCase() === nombre.toLowerCase())) {
    toast(`Ya existe un salón llamado "${nombre}"`, 'danger', 'fa-triangle-exclamation'); return;
  }

  db.mesas.salones.push({ id: 'salon_' + Date.now(), nombre, cantidad, prefijo, layout: 'grid', color, precio_extra: precio });
  sync();
  toast(`✓ Salón "${nombre}" creado · ${cantidad} mesas · Prefijo ${prefijo}`, 'success', 'fa-circle-check');
  tab('m');
}

function guardarSalonCompleto(salonId) {
  if (!db.mesas?.salones) return;
  const salon = db.mesas.salones.find(s => s.id === salonId);
  if (!salon) return;

  const nuevoNombre = (document.getElementById('ed-nombre-' + salonId)?.value||'').trim();
  const nuevaCant   = parseInt(document.getElementById('cant-'    + salonId)?.value) || 0;
  const nuevoPrecio = parseFloat(document.getElementById('precio-' + salonId)?.value) || 0;
  const nuevoColor  = document.getElementById('color-'   + salonId)?.value || salon.color || '#ff6b35';

  if (!nuevoNombre) { toast('El nombre no puede estar vacío', 'danger', 'fa-exclamation'); return; }
  if (nuevaCant < 1){ toast('La cantidad de mesas debe ser al menos 1', 'danger', 'fa-exclamation'); return; }

  if (db.mesas.salones.some(s => s.id !== salonId && s.nombre.toLowerCase() === nuevoNombre.toLowerCase())) {
    toast(`Ya existe otro salón con el nombre "${nuevoNombre}"`, 'danger', 'fa-triangle-exclamation'); return;
  }

  const cambios = [];
  if (salon.nombre       !== nuevoNombre) cambios.push('nombre actualizado');
  if (salon.cantidad     !== nuevaCant)   cambios.push(`${salon.cantidad}→${nuevaCant} mesas`);
  if ((salon.precio_extra||0) !== nuevoPrecio && nuevoPrecio > 0) cambios.push(`+€${nuevoPrecio.toFixed(2)} suplem.`);

  salon.nombre       = nuevoNombre;
  salon.cantidad     = nuevaCant;
  salon.precio_extra = nuevoPrecio;
  salon.color        = nuevoColor;

  sync();
  toast(`"${nuevoNombre}" guardado${cambios.length ? ' · ' + cambios.join(', ') : ''}`, 'success', 'fa-check');
  tab('m');
}

function deleteSalon(salonId) {
  if (!db.mesas?.salones) return;
  const salon = db.mesas.salones.find(s => s.id === salonId);
  if (!salon) return;

  const activas = (db.tickets||[]).filter(t =>
    t.mesa.startsWith(salon.prefijo) && (t.items||[]).some(i=>i.enviado)
  ).length;
  if (activas > 0) {
    toast(`No se puede eliminar: ${activas} mesa${activas>1?'s':''} con pedidos activos`, 'danger', 'fa-lock'); return;
  }

  if (!confirm(`¿Eliminar el salón "${salon.nombre}" (${salon.cantidad} mesas)?\n\nSe eliminarán los tickets vacíos de este salón.\nEsta acción no se puede deshacer.`)) return;

  db.tickets       = (db.tickets||[]).filter(t => !t.mesa.startsWith(salon.prefijo));
  db.mesas.salones = db.mesas.salones.filter(s => s.id !== salonId);

  sync();
  toast(`Salón "${salon.nombre}" eliminado`, 'danger', 'fa-trash-can');
  tab('m');
}

function addCat() {

  const label = document.getElementById('newCatLabel')?.value?.trim();
  const tipo  = document.getElementById('newCatTipo')?.value;

function deleteCat(catId) {
  const cat = (db.categorias||[]).find(c => c.id === catId);
  if (!cat) return;
  // Count products in this cat
  const count = (db.productos||[]).filter(p => p.catId === catId).length;
  const msg = count > 0
    ? `¿Eliminar la categoría "${cat.label}"?\n\n${count} producto(s) pasarán a "Otros".`
    : `¿Eliminar la categoría "${cat.label}"?`;
  if (!confirm(msg)) return;
  // Unassign products
  (db.productos||[]).forEach(p => { if (p.catId === catId) delete p.catId; });
  db.categorias = (db.categorias||[]).filter(c => c.id !== catId);
  sync();
  toast('Categoría eliminada', 'danger');
  tab('k');
}

  const span = document.getElementById('ce-' + catId);

/* ── Variantes edit state ─────────────────────────── */
const _variantesEdit = {};

function _renderVariantesList(prodId) {
  const container = document.getElementById('variantes-list-'+prodId);
  if (!container) return;
  const vars = _variantesEdit[prodId] || [];
  container.innerHTML = vars.map((v, vi) => `
    <div class="variante-row" id="vrow-${prodId}-${vi}">
      <input type="text" placeholder="Nombre opción" value="${(v.nombre||'').replace(/"/g,'&quot;')}"
        oninput="_variantesEdit[${prodId}][${vi}].nombre=this.value">
      <span class="variante-price-label">€ extra:</span>
      <input type="number" placeholder="0.00" step="0.10" min="0" value="${v.precioExtra||0}"
        oninput="_variantesEdit[${prodId}][${vi}].precioExtra=parseFloat(this.value)||0"
        style="width:72px">
      <button class="variante-del-btn" onclick="delVarianteEdit(${prodId},${vi})"><i class="fas fa-xmark"></i></button>
    </div>`).join('');
}

function addVarianteEdit(prodId) {
  if (!_variantesEdit[prodId]) _variantesEdit[prodId] = [];
  _variantesEdit[prodId].push({ nombre: '', precioExtra: 0 });
  _renderVariantesList(prodId);
  // Focus last input
  setTimeout(() => {
    const inputs = document.querySelectorAll(`#variantes-list-${prodId} .variante-row input[type="text"]`);
    inputs[inputs.length-1]?.focus();
  }, 50);
}

function delVarianteEdit(prodId, idx) {
  if (!_variantesEdit[prodId]) return;
  _variantesEdit[prodId].splice(idx, 1);
  _renderVariantesList(prodId);
}

function uploadFotoPersonal(id) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        // Recorte cuadrado centrado, reducido a 120×120 px
        const canvas = document.createElement('canvas');
        const SIZE = 120;
        canvas.width = SIZE; canvas.height = SIZE;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width  - min) / 2;
        const sy = (img.height - min) / 2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, SIZE, SIZE);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        const p = (db.personal||[]).find(x => x.id === id);
        if (p) {
          p.foto = dataUrl;
          sync();
          tab('s');
          toast('Foto actualizada ✓', 'success', 'fa-camera');
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function quitarFotoPersonal(id, e) {
  e.stopPropagation();
  const p = (db.personal||[]).find(x => x.id === id);
  if (p) {
    delete p.foto;
    sync();
    tab('s');
    toast('Foto eliminada', 'info', 'fa-camera');
  }
}

function testFirebaseUrl() {
  const url = (document.getElementById('fbUrlInput')?.value || '').trim();
  const result = document.getElementById('fb-test-result');
  if (!url) { toast('Introduce una URL primero', 'danger'); return; }
  if (!result) return;

  result.style.display = 'flex';
  result.style.background = 'rgba(74,158,255,0.07)';
  result.style.border = '1px solid rgba(74,158,255,0.2)';
  result.style.color = 'var(--info)';
  result.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Probando conexión…';

  const testName = 'fb-test-' + Date.now();
  let testApp;
  try {
    testApp = firebase.initializeApp({ databaseURL: url }, testName);
  } catch(e) {
    result.style.background = 'rgba(255,59,92,0.07)';
    result.style.border = '1px solid rgba(255,59,92,0.2)';
    result.style.color = 'var(--danger)';
    result.innerHTML = `<i class="fas fa-circle-xmark"></i> URL inválida: ${escHtml(e.message)}`;
    return;
  }

  firebase.database(testApp).ref('/').limitToFirst(1).once('value')
    .then(() => {
      result.style.background = 'rgba(0,229,160,0.07)';
      result.style.border = '1px solid rgba(0,229,160,0.2)';
      result.style.color = 'var(--success)';
      result.innerHTML = '<i class="fas fa-circle-check"></i> Conexión exitosa — URL válida';
    })
    .catch(err => {
      result.style.background = 'rgba(255,59,92,0.07)';
      result.style.border = '1px solid rgba(255,59,92,0.2)';
      result.style.color = 'var(--danger)';
      result.innerHTML = `<i class="fas fa-circle-xmark"></i> ${escHtml(err.message)}`;
    })
    .finally(() => { try { testApp.delete(); } catch(_){} });
}

  if (!logo) return;
  
  const bgColor = db.config?.logoBgColor || '#ff6b35';
  const fgColor = db.config?.logoFgColor || '#ffffff';
  
  if (logo.style.background !== bgColor) logo.style.background = bgColor;
  if (logo.style.color !== fgColor) logo.style.color = fgColor;
  
  // Solo reescribir el logo si cambió, para no recargar/parpadear
  // la imagen (a veces pesada en base64) en CADA sincronización.
  const newHTML = db.config?.logo
    ? `<img src="${db.config.logo}" style="width:100%;height:100%;object-fit:contain;padding:4px">`
    : '🔥';
  if (logo.innerHTML !== newHTML) logo.innerHTML = newHTML;
}

function applyBg() {
  // Solo tocar el fondo si realmente cambió, para no provocar
  // un repintado del fondo en CADA sincronización de Firebase.
  if (db.config?.fondo) {
    const url = `url('${db.config.fondo}')`;
    if (document.body.style.backgroundImage !== url) {
      document.body.style.backgroundImage = url;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundAttachment = 'fixed';
    }
  } else {
    if (document.body.style.backgroundImage !== '') {
      document.body.style.backgroundImage = '';
    }
  }
}

function _resetCajaValidarInput() {
  const val = (document.getElementById('reset-caja-confirm-input')?.value || '').trim().toUpperCase();
  const btn = document.getElementById('reset-caja-confirm-btn');
  if (!btn) return;
  const ok = val === 'CERRAR';
  btn.disabled = !ok;
  btn.style.opacity = ok ? '1' : '0.4';
  btn.style.cursor  = ok ? 'pointer' : 'not-allowed';
}

function _resetCajaExportarBackup() {
  try {
    const payload = {
      exportadoEn: new Date().toLocaleString('es-ES'),
      historicoVentas:      db.historicoVentas      || [],
      tickets:              db.tickets              || [],
      productosEliminados:  db.productosEliminados  || [],
      historicoEliminaciones: db.historicoEliminaciones || [],
      despachos:            db.despachos            || []
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `backup_caja_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('📦 Backup exportado correctamente', 'success', 'fa-file-arrow-down');
  } catch (e) {
    toast('❌ No se pudo exportar el backup', 'danger', 'fa-circle-exclamation');
  }
}

function _resetCajaEjecutar() {
  const val = (document.getElementById('reset-caja-confirm-input')?.value || '').trim().toUpperCase();
  if (val !== 'CERRAR') return;

  document.getElementById('reset-caja-modal')?.remove();
  db.historicoVentas        = [];
  db.tickets                = [];
  db.productosEliminados    = [];
  db.historicoEliminaciones = [];
  db.despachos              = [];
  sync()
    .then(() => toast('Jornada cerrada — registros limpiados', 'info', 'fa-power-off'))
    .catch(() => toast('⚠️ Jornada cerrada localmente pero falló la sincronización', 'danger', 'fa-cloud-slash'));
  tab('v');
}

        <span style="font-size:0.68rem;color:var(--muted)"><i class="fas fa-chair" style="font-size:0.6rem;color:var(--barra);margin-right:3px"></i>Mesa ${r.mesa}</span>
        <span style="font-size:0.68rem;color:var(--muted)"><i class="fas fa-users" style="font-size:0.6rem;margin-right:3px"></i>${r.personas} persona${r.personas>1?'s':''}</span>
        ${r.telefono ? `<span style="font-size:0.68rem;color:var(--muted)"><i class="fas fa-phone" style="font-size:0.6rem;margin-right:3px"></i>${escHtml(r.telefono)}</span>` : ''}
      </div>
      ${r.nota ? `<div style="font-size:0.68rem;color:var(--warning);margin-top:3px;font-weight:600"><i class="fas fa-thumbtack" style="font-size:0.6rem;margin-right:3px"></i>${escHtml(r.nota)}</div>` : ''}
    </div>
    <button class="btn btn-danger" style="padding:7px 11px;font-size:0.7rem;flex-shrink:0" onclick="deleteReserva(${r.id})">
      <i class="fas fa-trash-can"></i>
    </button>
  </div>`;
}

function cargarClienteHab(id) {
  if (!id) return;
  const cl = (db.clientesHabituales||[]).find(c => c.id == id);
  if (!cl) return;
  const n = document.getElementById('rNombre');
  const t = document.getElementById('rTelefono');
  if (n) n.value = cl.nombre;
  if (t) t.value = cl.telefono||'';
}

function addReserva() {
  const nombre   = document.getElementById('rNombre')?.value?.trim();
  const telefono = document.getElementById('rTelefono')?.value?.trim();
  const mesa     = document.getElementById('rMesa')?.value;
  const fecha    = document.getElementById('rFecha')?.value;
  const hora     = document.getElementById('rHora')?.value;
  const personas = parseInt(document.getElementById('rPersonas')?.value)||2;
  const nota     = document.getElementById('rNota')?.value?.trim();
  const guardarCli = document.getElementById('rGuardarCli')?.checked;
  const clienteHabId = document.getElementById('selClienteHab')?.value;

  if (!nombre || !mesa || !fecha || !hora) {
    toast('Rellena nombre, mesa, fecha y hora', 'danger'); return;
  }

  if (!db.reservas) db.reservas = [];

  // 🚫 Validación: Evitar duplicar reservas en la misma mesa
  const mesaYaTiene = (db.reservas||[]).find(r => r.mesa === mesa && r.fecha === fecha);
  if (mesaYaTiene) {
    toast(`❌ La mesa ${mesa} ya tiene una reserva para ${fecha}`, 'danger');
    return;
  }

  // Save as regular client if checked and not already a habitual
  let clienteId = clienteHabId ? parseInt(clienteHabId) : null;
  if (guardarCli && !clienteId) {
    if (!db.clientesHabituales) db.clientesHabituales = [];
    const existe = db.clientesHabituales.find(c =>
      c.nombre.toLowerCase() === nombre.toLowerCase()
    );
    if (!existe) {
      clienteId = Date.now();
      db.clientesHabituales.push({ id: clienteId, nombre, telefono: telefono||'', email:'', nota:nota||'' });
      toast(`${nombre} guardado como cliente habitual`, 'success', 'fa-star');
    } else {
      clienteId = existe.id;
    }
  }

  db.reservas.push({
    id: genUID(),
    nombre, telefono: telefono||'', mesa, fecha, hora,
    personas, nota: nota||'',
    clienteId,
    estado: 'pendiente' // ⏰ Estado inicial: pendiente de ser tomada
  });

  sync();
  toast(`Reserva creada · ${nombre} · Mesa ${mesa} · ${hora}`, 'success', 'fa-calendar-check');
  tab('r');
}

function deleteReserva(id) {
  if (!confirm('¿Eliminar esta reserva?')) return;
  db.reservas = (db.reservas||[]).filter(r => r.id !== id);
  sync();
  toast('Reserva eliminada', 'danger');
  tab('r');
}

function addClienteHabitual() {
  const nombre   = document.getElementById('chNombre')?.value?.trim();
  const telefono = document.getElementById('chTelefono')?.value?.trim();
  const email    = document.getElementById('chEmail')?.value?.trim();
  const nota     = document.getElementById('chNota')?.value?.trim();
  if (!nombre) { toast('Introduce el nombre del cliente', 'danger'); return; }
  if (!db.clientesHabituales) db.clientesHabituales = [];
  const existe = db.clientesHabituales.find(c => c.nombre.toLowerCase() === nombre.toLowerCase());
  if (existe) { toast('Este cliente ya existe', 'info'); return; }
  db.clientesHabituales.push({ id: Date.now(), nombre, telefono: telefono||'', email: email||'', nota: nota||'' });
  sync();
  toast(`${nombre} añadido como cliente habitual`, 'success', 'fa-star');
  tab('r');
}

function deleteClienteHabitual(id) {
  if (!confirm('¿Eliminar este cliente habitual?')) return;
  db.clientesHabituales = (db.clientesHabituales||[]).filter(c => c.id !== id);
  sync();
  toast('Cliente eliminado', 'danger');
  tab('r');
}

/* ════════════════════════════════════
   PDF REPORT — diseño robusto con paginación automática
   Nunca usa coordenadas fijas: todo pasa por autoTable
   para que el contenido fluya sin salirse del formato.
════════════════════════════════════ */
function pdfReport() {
  const {jsPDF} = window.jspdf;
  const PW = 210, ML = 14, MR = 196;

  // ── helpers ───────────────────────────────────────────────────
  function getY() { return doc.lastAutoTable ? doc.lastAutoTable.finalY : 0; }

  function sectionTitle(label, r, g, b) {
    const y = getY() + 7;
    doc.setDrawColor(r, g, b);
    doc.setLineWidth(0.35);
    doc.line(ML, y, MR, y);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8);
    doc.setTextColor(r, g, b);
    doc.text(label.toUpperCase(), ML, y + 4.5);
    doc.autoTable({
      body:[['']], startY: y + 6,
      styles:{ fontSize:0, cellPadding:0, minCellHeight:0 },
      tableLineWidth:0, showHead:'never',
      columnStyles:{ 0:{ textColor:[255,255,255], fillColor:[255,255,255] } }
    });
  }

  // Etiqueta de método por ticket (detalle)
  function labelMetodo(v) {
    if (!v.metodoPago) return '—';
    if (v.metodoPago2) {
      return `EF €${Number(v.montoPago1||0).toFixed(2)} / TJ €${Number(v.montoPago2||0).toFixed(2)}`;
    }
    return v.metodoPago === 'tarjeta' ? 'Tarjeta' : 'Efectivo';
  }

  // ── datos ─────────────────────────────────────────────────────
  const nombre  = db.config?.nombreRestaurante || 'Hotto Digital';
  const ventas  = db.historicoVentas || [];
  const ventasMesa = ventas.filter(v => !v.mesa || !v.mesa.startsWith('VD'));
  const ventasVD   = ventas.filter(v => v.mesa && v.mesa.startsWith('VD'));

  const totalGeneral = round2(ventas.reduce((s,v) => s + (v.totalFinal||0), 0));
  const totalMesa    = round2(ventasMesa.reduce((s,v) => s + (v.totalFinal||0), 0));
  const totalVD      = round2(ventasVD.reduce((s,v) => s + (v.totalFinal||0), 0));

  // ── Montos REALES por método ──────────────────────────────────
  // Los pagos mixtos se desglosan: montoPago1 → efectivo, montoPago2 → tarjeta
  // No existe un cubo "mixto": cada euro queda asignado al canal real de cobro.
  const realEfectivo = { total: 0, tickets: 0 };
  const realTarjeta  = { total: 0, tickets: 0 };
  const sinMetodo    = { total: 0, tickets: 0 };

  ventas.forEach(v => {
    const tot = v.totalFinal || 0;
    if (!v.metodoPago) {
      sinMetodo.total += tot; sinMetodo.tickets++;
    } else if (v.metodoPago2) {
      // Pago mixto: sumar cada parte a su canal real
      realEfectivo.total = round2(realEfectivo.total + round2(Number(v.montoPago1 || 0)));
      realTarjeta.total  = round2(realTarjeta.total  + round2(Number(v.montoPago2 || 0)));
      realEfectivo.tickets++;   // el ticket cuenta en ambos canales
      realTarjeta.tickets++;
    } else if (v.metodoPago === 'tarjeta') {
      realTarjeta.total  = round2(realTarjeta.total  + tot); realTarjeta.tickets++;
    } else {
      realEfectivo.total = round2(realEfectivo.total + tot); realEfectivo.tickets++;
    }
  });

  // ── documento ─────────────────────────────────────────────────
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const ahora = new Date();

  // Cabecera
  doc.setFillColor(15, 18, 32);
  doc.rect(0, 0, PW, 36, 'F');
  doc.setFillColor(255, 107, 53);
  doc.rect(0, 0, 4, 36, 'F');

  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.setTextColor(255, 255, 255);
  doc.text('REPORTE DE VENTAS', ML + 4, 12);

  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(168, 179, 204);
  doc.text(nombre.toUpperCase(), ML + 4, 18);
  doc.text(
    ahora.toLocaleString('es-ES', { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }),
    ML + 4, 24
  );
  doc.text(`${ventas.length} venta${ventas.length !== 1 ? 's' : ''} registradas`, ML + 4, 30);

  doc.setFont('helvetica','bold');
  doc.setFontSize(20);
  doc.setTextColor(255, 107, 53);
  doc.text(`€${totalGeneral.toFixed(2)}`, MR, 17, { align:'right' });
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.setTextColor(168, 179, 204);
  doc.text('TOTAL JORNADA', MR, 23, { align:'right' });

  // ── 4 cajas de resumen ────────────────────────────────────────
  doc.autoTable({
    body: [[
      `MESAS\n€${totalMesa.toFixed(2)}`,
      `BARRA DIRECTA\n€${totalVD.toFixed(2)}`,
      `EFECTIVO REAL\n€${realEfectivo.total.toFixed(2)}`,
      `TARJETA REAL\n€${realTarjeta.total.toFixed(2)}`
    ]],
    startY: 38,
    styles: { font:'helvetica', fontSize:7.5, cellPadding:4, halign:'center', valign:'middle', lineWidth:0 },
    columnStyles: {
      0: { fillColor:[20,30,55], textColor:[232,201,106], fontStyle:'bold' },
      1: { fillColor:[20,30,55], textColor:[74,158,255],  fontStyle:'bold' },
      2: { fillColor:[20,30,55], textColor:[0,185,120],   fontStyle:'bold' },
      3: { fillColor:[20,30,55], textColor:[0,185,120],   fontStyle:'bold' }
    },
    tableWidth: MR - ML,
    margin: { left: ML, right: PW - MR },
    didParseCell: d => {
      if (typeof d.cell.raw === 'string' && d.cell.raw.includes('\n'))
        d.cell.text = d.cell.raw.split('\n');
    }
  });

  // ── SECCIÓN 1: Ventas por mesa ────────────────────────────────
  if (ventasMesa.length > 0) {
    sectionTitle('Ventas por mesa', 255, 107, 53);

    const rowsMesa = ventasMesa.map(v => [
      v.mesa || '—',
      v.horaCobro || '—',
      v.usuarioCobro || v.usuarioEnvio || '—',
      labelMetodo(v),
      { content: fmtEur(v.totalFinal||0),
        styles: { fontStyle:'bold', halign:'right', textColor:[255,107,53] } }
    ]);
    rowsMesa.push([
      { content: 'SUBTOTAL MESAS', colSpan:4,
        styles: { fontStyle:'bold', fillColor:[30,40,70], textColor:[255,200,150], halign:'right' } },
      { content: '€' + totalMesa.toFixed(2),
        styles: { fontStyle:'bold', fillColor:[30,40,70], textColor:[255,107,53], halign:'right' } }
    ]);

    doc.autoTable({
      head: [['Mesa','Hora','Cobrado por','Método de pago','Total']],
      body: rowsMesa,
      startY: getY() + 2,
      styles:         { font:'helvetica', fontSize:7.5, cellPadding:2.4, overflow:'linebreak' },
      headStyles:     { fillColor:[255,107,53], textColor:[255,255,255], fontStyle:'bold', fontSize:7.5 },
      alternateRowStyles: { fillColor:[245,246,252] },
      columnStyles: {
        0: { halign:'center', cellWidth:16 },
        1: { halign:'center', cellWidth:18 },
        2: { halign:'left',   cellWidth:38 },
        3: { halign:'left',   cellWidth:58 },
        4: { halign:'right',  cellWidth:22 }
      },
      margin: { left: ML, right: PW - MR },
      tableWidth: MR - ML
    });
  }

  // ── SECCIÓN 2: Ventas barra directa ──────────────────────────
  if (ventasVD.length > 0) {
    sectionTitle('Ventas barra directa', 74, 158, 255);

    const rowsVD = ventasVD.map(v => [
      v.horaCobro || '—',
      v.usuarioCobro || v.usuarioEnvio || '—',
      labelMetodo(v),
      { content: fmtEur(v.totalFinal||0),
        styles: { fontStyle:'bold', halign:'right', textColor:[74,158,255] } }
    ]);
    rowsVD.push([
      { content: 'SUBTOTAL BARRA DIRECTA', colSpan:3,
        styles: { fontStyle:'bold', fillColor:[20,30,55], textColor:[168,200,255], halign:'right' } },
      { content: '€' + totalVD.toFixed(2),
        styles: { fontStyle:'bold', fillColor:[20,30,55], textColor:[74,158,255], halign:'right' } }
    ]);

    doc.autoTable({
      head: [['Hora','Camarero','Método de pago','Total']],
      body: rowsVD,
      startY: getY() + 2,
      styles:         { font:'helvetica', fontSize:7.5, cellPadding:2.4, overflow:'linebreak' },
      headStyles:     { fillColor:[74,158,255], textColor:[255,255,255], fontStyle:'bold', fontSize:7.5 },
      alternateRowStyles: { fillColor:[245,246,252] },
      columnStyles: {
        0: { halign:'center', cellWidth:18 },
        1: { halign:'left',   cellWidth:42 },
        2: { halign:'left',   cellWidth:58 },
        3: { halign:'right',  cellWidth:22 }
      },
      margin: { left: ML, right: PW - MR },
      tableWidth: MR - ML
    });
  }

  // ── SECCIÓN 3: Resumen por método de pago (montos reales) ─────
  sectionTitle('Resumen por método de pago', 0, 185, 120);

  // Nota: los pagos mixtos están DESGLOSADOS — cada euro aparece
  // en el canal real (efectivo o tarjeta) en que fue cobrado.
  const metodosRows = [
    [
      { content: 'Efectivo', styles:{ fontStyle:'bold' } },
      { content: String(realEfectivo.tickets) + ' cobro' + (realEfectivo.tickets !== 1 ? 's' : ''),
        styles:{ halign:'center', textColor:[120,130,160] } },
      { content: '€' + realEfectivo.total.toFixed(2),
        styles:{ fontStyle:'bold', halign:'right', textColor:[0,185,120] } }
    ],
    [
      { content: 'Tarjeta', styles:{ fontStyle:'bold' } },
      { content: String(realTarjeta.tickets) + ' cobro' + (realTarjeta.tickets !== 1 ? 's' : ''),
        styles:{ halign:'center', textColor:[120,130,160] } },
      { content: '€' + realTarjeta.total.toFixed(2),
        styles:{ fontStyle:'bold', halign:'right', textColor:[74,158,255] } }
    ]
  ];
  if (sinMetodo.total > 0) {
    metodosRows.push([
      { content: 'Sin método registrado', styles:{ textColor:[150,150,160] } },
      { content: String(sinMetodo.tickets), styles:{ halign:'center', textColor:[150,150,160] } },
      { content: '€' + sinMetodo.total.toFixed(2), styles:{ halign:'right', textColor:[150,150,160] } }
    ]);
  }
  metodosRows.push([
    { content: 'TOTAL', colSpan:2,
      styles:{ fontStyle:'bold', fillColor:[30,40,70], textColor:[255,200,150], halign:'right' } },
    { content: '€' + totalGeneral.toFixed(2),
      styles:{ fontStyle:'bold', fillColor:[30,40,70], textColor:[255,107,53], halign:'right' } }
  ]);

  doc.autoTable({
    head: [['Método','Operaciones','Importe real cobrado']],
    body: metodosRows,
    startY: getY() + 2,
    styles:         { font:'helvetica', fontSize:8.5, cellPadding:3.5 },
    headStyles:     { fillColor:[0,145,95], textColor:[255,255,255], fontStyle:'bold' },
    alternateRowStyles: { fillColor:[245,250,248] },
    columnStyles: {
      0: { cellWidth:55 },
      1: { cellWidth:35, halign:'center' },
      2: { cellWidth:52, halign:'right' }
    },
    tableWidth: 142,
    margin: { left: ML, right: PW - MR }
  });

  // ── Pie de página ─────────────────────────────────────────────
  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFillColor(15, 18, 32);
    doc.rect(0, 287, PW, 10, 'F');
    doc.setFont('helvetica','normal');
    doc.setFontSize(7);
    doc.setTextColor(100, 110, 140);
    doc.text(nombre + ' · Generado por HOTTO TPV', ML, 293);
    doc.text(`Página ${i} de ${totalPages}`, MR, 293, { align:'right' });
  }

  const fechaArchivo = ahora.toLocaleDateString('es-ES').replace(/\//g,'-');
  doc.save(`reporte_ventas_${fechaArchivo}.pdf`);
  toast('PDF descargado', 'success', 'fa-file-arrow-down');
}

/* ════════════════════════════════════
   PDF PRODUCTOS ELIMINADOS
════════════════════════════════════ */
function pdfEliminados() {
  const {jsPDF} = window.jspdf;
  const PW = 210, ML = 14, MR = 196;
  const nombre  = db.config?.nombreRestaurante || 'Hotto Digital';
  const ahora   = new Date();
  const eliminados = (db.productosEliminados || []).slice().reverse();

  if (eliminados.length === 0) { toast('Sin datos para exportar', 'info'); return; }

  // ── totales ───────────────────────────────────────────────────
  const totalMonto  = eliminados.reduce((s, e) => s + (e.totalProducto || 0), 0);
  const totalUds    = eliminados.reduce((s, e) => s + (e.cantidad || 1), 0);
  const porCocina   = eliminados.filter(e => e.zona === 'Cocina');
  const porBarra    = eliminados.filter(e => e.zona === 'Barra');
  const totalCocina = porCocina.reduce((s, e) => s + (e.totalProducto || 0), 0);
  const totalBarra  = porBarra.reduce ((s, e) => s + (e.totalProducto || 0), 0);

  // ── ranking de producto más eliminado ─────────────────────────
  const rankMap = {};
  eliminados.forEach(e => {
    if (!rankMap[e.producto]) rankMap[e.producto] = { nombre: e.producto, veces: 0, monto: 0 };
    rankMap[e.producto].veces += e.cantidad || 1;
    rankMap[e.producto].monto += e.totalProducto || 0;
  });
  const ranking = Object.values(rankMap).sort((a, b) => b.veces - a.veces).slice(0, 10);

  // ── helpers ───────────────────────────────────────────────────
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  function getY() { return doc.lastAutoTable ? doc.lastAutoTable.finalY : 0; }

  function sectionTitle(label, r, g, b) {
    const y = getY() + 7;

    doc.setLineWidth(0.35);
    doc.line(ML, y, MR, y);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8);
    doc.setTextColor(r, g, b);
    doc.text(label.toUpperCase(), ML, y + 4.5);
    doc.autoTable({
      body:[['']], startY: y + 6,
      styles:{ fontSize:0, cellPadding:0, minCellHeight:0 },
      tableLineWidth:0, showHead:'never',
      columnStyles:{ 0:{ textColor:[255,255,255], fillColor:[255,255,255] } }
    });
  }

  // ── cabecera ──────────────────────────────────────────────────
  doc.setFillColor(15, 18, 32);
  doc.rect(0, 0, PW, 36, 'F');
  doc.setFillColor(255, 59, 92);
  doc.rect(0, 0, 4, 36, 'F');

  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.setTextColor(255, 255, 255);
  doc.text('PRODUCTOS ELIMINADOS', ML + 4, 12);

  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(168, 179, 204);
  doc.text(nombre.toUpperCase(), ML + 4, 18);
  doc.text(
    ahora.toLocaleString('es-ES', { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }),
    ML + 4, 24
  );
  doc.text(`${eliminados.length} registro${eliminados.length !== 1 ? 's' : ''} · ${totalUds} unidad${totalUds !== 1 ? 'es' : ''}`, ML + 4, 30);

  doc.setFont('helvetica','bold');
  doc.setFontSize(20);
  doc.setTextColor(255, 59, 92);
  doc.text(`€${totalMonto.toFixed(2)}`, MR, 17, { align:'right' });
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.setTextColor(168, 179, 204);
  doc.text('PÉRDIDA REGISTRADA', MR, 23, { align:'right' });

  // ── 4 cajas resumen ───────────────────────────────────────────
  doc.autoTable({
    body: [[
      `TOTAL REGISTROS\n${eliminados.length}`,
      `UNIDADES\n${totalUds}`,
      `COCINA\n€${totalCocina.toFixed(2)}`,
      `BARRA\n€${totalBarra.toFixed(2)}`
    ]],
    startY: 38,
    styles: { font:'helvetica', fontSize:7.5, cellPadding:4, halign:'center', valign:'middle', lineWidth:0 },
    columnStyles: {
      0: { fillColor:[20,30,55], textColor:[255,200,150],  fontStyle:'bold' },
      1: { fillColor:[20,30,55], textColor:[168,179,204],  fontStyle:'bold' },
      2: { fillColor:[20,30,55], textColor:[255,107,53],   fontStyle:'bold' },
      3: { fillColor:[20,30,55], textColor:[74,158,255],   fontStyle:'bold' }
    },
    tableWidth: MR - ML,
    margin: { left: ML, right: PW - MR },
    didParseCell: d => {
      if (typeof d.cell.raw === 'string' && d.cell.raw.includes('\n'))
        d.cell.text = d.cell.raw.split('\n');
    }
  });

  // ── SECCIÓN 1: Ranking productos más eliminados ───────────────
  sectionTitle('Ranking — productos más eliminados', 255, 59, 92);
  doc.autoTable({
    head: [['#', 'Producto', 'Veces eliminado', 'Pérdida acum.']],
    body: ranking.map((r, i) => [
      { content: String(i + 1), styles: { halign:'center', fontStyle:'bold', textColor: i === 0 ? [232,201,106] : i === 1 ? [180,180,200] : i === 2 ? [205,127,50] : [120,130,160] } },
      r.nombre,
      { content: String(r.veces), styles: { halign:'center', fontStyle:'bold' } },
      { content: `€${r.monto.toFixed(2)}`, styles: { halign:'right', fontStyle:'bold', textColor:[255,59,92] } }
    ]),
    startY: getY() + 2,
    styles:         { font:'helvetica', fontSize:8, cellPadding:2.8, overflow:'linebreak' },

function pdfDespachos() {

  const dCocina    = despachos.filter(d => d.zona === 'cocina');
  const dBarra     = despachos.filter(d => d.zona === 'barra');
  const unidCocina = dCocina.reduce((s, d) => s + d.cantidad, 0);
  const unidBarra  = dBarra.reduce ((s, d) => s + d.cantidad, 0);

      map[d.nombre].unidades += d.cantidad;
      map[d.nombre].ingresos += d.precio * d.cantidad;

async function confirmarPedidoCliente(mesa, pedidoId, _unused) {
  // Leer el pedido desde Firebase (fuente de verdad)
  const snapPed = await rtdb.ref('/pedidosCliente/' + mesa).once('value').catch(() => null);
  const objPed  = snapPed?.val() || {};
  const firebaseKey = Object.keys(objPed).find(k => objPed[k].id === pedidoId);
  if (!firebaseKey) { toast('Pedido no encontrado', 'danger', 'fa-ban'); return; }

  const pedido = objPed[firebaseKey];
  const itemsAUsar = (pedido.items || []);
  if (!itemsAUsar.length) { toast('No hay productos que añadir', 'warning'); return; }

  // Transaction atómica sobre /tickets — igual que syncEnviarPedido
  rtdb.ref('/tickets').transaction(currentTickets => {
    if (currentTickets === null) currentTickets = [];

    // Buscar o crear ticket de la mesa
    let idx = currentTickets.findIndex(t => t && t.mesa === mesa);
    if (idx < 0) {
      currentTickets.push({
        mesa,
        user: session.user,
        items: [],
        abierto: new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'})
      });
      idx = currentTickets.length - 1;
    }
    const ticket = currentTickets[idx];
    if (!ticket.items) ticket.items = [];

    // Añadir cada item del pedido al ticket
    itemsAUsar.forEach(pi => {
      const _salon = (db.mesas?.salones || []).find(s => mesa.startsWith(s.prefijo));
      let precio = Number(pi.precio);
      if (_salon?.precio_extra > 0 && pi.tipo === 'barra') precio += _salon.precio_extra;

      const exist = ticket.items.find(x => x.id === pi.prodId && !x.enviado);
      if (exist) {
        exist.cantidad += Number(pi.cantidad);
      } else {
        ticket.items.push({
          id:        pi.prodId,
          icono:     pi.icono || '\u{1F37D}\uFE0F',
          nombre:    pi.nombre,
          precio:    precio,
          tipo:      pi.tipo || 'barra',
          catId:     pi.catId || '',
          cantidad:  Number(pi.cantidad),
          enviado:   false,
          entregado: false,
          uid:       genUID(),
          nota:      pedido.nota || ''
        });
      }
    });

    currentTickets[idx] = ticket;
    return currentTickets;

  }, async (error, committed, snapshot) => {
    if (error || !committed) {
      console.error('❌ confirmarPedidoCliente transaction error:', error);
      toast('Error al añadir al ticket', 'danger', 'fa-ban');
      return;
    }
    // Actualizar db local con el snapshot confirmado por Firebase
    db.tickets = snapshot.val() || [];

    // Marcar pedido como confirmado (fuera de la transaction, no afecta atomicidad del ticket)
    try {
      await rtdb.ref('/pedidosCliente/' + mesa + '/' + firebaseKey + '/estado').set('confirmado');
    } catch(e) { console.warn('No se pudo marcar confirmado:', e); }

    toast('\u2705 ' + itemsAUsar.length + ' producto' + (itemsAUsar.length > 1 ? 's' : '') + ' a\xF1adido' + (itemsAUsar.length > 1 ? 's' : '') + ' al ticket \xB7 Mesa ' + mesa, 'success', 'fa-circle-check');
    render();
  });
}

/* ════════════════════════════════════
   QR CAMARERO — Reutiliza el modal del admin
════════════════════════════════════ */
function mostrarQRCamarero(mesa) {
  const baseURL = localStorage.getItem('qrClienteURL') || '';
  if (!baseURL) {
    toast('URL del cliente no configurada. El administrador debe configurarla en QR Mesas.', 'warning', 'fa-triangle-exclamation');
    return;
  }

  // Si el modal del admin no está en el DOM (estamos en vista camarero), lo inyectamos
  if (!document.getElementById('qr-modal')) {
    const wrap = document.createElement('div');
    wrap.id = 'qr-modal-global-wrap';
    wrap.innerHTML = '<div id="qr-modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);align-items:center;justify-content:center">'
      + '<div style="background:var(--surface);border-radius:var(--r-xl);padding:28px;max-width:360px;width:90%;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.5)">'
      + '<div id="qr-modal-title" style="font-family:var(--fh);font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:4px"></div>'
      + '<div id="qr-modal-sub" style="font-size:0.72rem;color:var(--muted);margin-bottom:18px"></div>'
      + '<div id="qr-canvas-wrap" style="display:inline-flex;padding:14px;background:#fff;border-radius:var(--r-lg);margin-bottom:14px"></div>'
      + '<div id="qr-modal-url" style="font-family:monospace;font-size:0.6rem;color:var(--muted);word-break:break-all;margin-bottom:18px;padding:6px 10px;background:var(--surface2);border-radius:6px"></div>'
      + '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
      + '<button class="btn btn-primary" style="padding:10px 18px;font-size:0.82rem" onclick="descargarQR()"><i class="fas fa-download"></i> Descargar PNG</button>'
      + '<button class="btn btn-ghost" style="padding:10px 18px;font-size:0.82rem" onclick="imprimirQRSolo()"><i class="fas fa-print"></i> Imprimir</button>'
      + '<button class="btn btn-ghost" style="padding:10px 18px;font-size:0.82rem" onclick="cerrarQRModal()"><i class="fas fa-xmark"></i> Cerrar</button>'
      + '</div></div></div>';
    document.body.appendChild(wrap);
  }

  // Obtener salon nombre para el subtítulo
  const salones = db.mesas?.salones || [];
  let salonNombre = '';
  for (const s of salones) {
    const mesas = s.mesas || [];
    if (mesas.some(m => String(m.id||m) === String(mesa))) { salonNombre = s.nombre || ''; break; }
  }

  // Llamar a la misma función que usa el admin — ya gestiona token, QR y modal
  generarQRMesa(String(mesa), salonNombre);
}

function saveQRClienteURL() {
  const val = (document.getElementById('qrClienteURLInput')?.value || '').trim();
  if (!val) { toast('Introduce una URL válida', 'warning', 'fa-triangle-exclamation'); return; }
  localStorage.setItem('qrClienteURL', val);
  toast('URL guardada correctamente', 'success', 'fa-circle-check');
  tab('qr');
}

let _qrActualURL = '';
let _qrActualMesa = '';
let _qrActualSalon = '';

function generarQRMesa(mesaId, salonNombre) {
  const baseURL = localStorage.getItem('qrClienteURL') || '';
  if (!baseURL) {
    toast('Primero configura la URL de la página del cliente', 'warning', 'fa-triangle-exclamation');
    return;
  }
  const url = baseURL.replace(/\?.*$/, '') + '?mesa=' + encodeURIComponent(mesaId);
  _qrActualURL  = url;
  _qrActualMesa = mesaId;
  _qrActualSalon = salonNombre;

  // Abrir modal
  const modal = document.getElementById('qr-modal');
  if (!modal) return;
  modal.style.display = 'flex';

  document.getElementById('qr-modal-title').textContent = 'Mesa ' + mesaId;
  document.getElementById('qr-modal-sub').textContent   = salonNombre;
  document.getElementById('qr-modal-url').textContent   = url;

  const wrap = document.getElementById('qr-canvas-wrap');
  wrap.innerHTML = '';
  new QRCode(wrap, {
    text:          url,
    width:         200,
    height:        200,
    colorDark:     '#1a1714',
    colorLight:    '#ffffff',
    correctLevel:  QRCode.CorrectLevel.M
  });
}

function cerrarQRModal() {
  const m = document.getElementById('qr-modal');
  if (m) m.style.display = 'none';
}

function descargarQR() {
  const canvas = document.querySelector('#qr-canvas-wrap canvas');
  const img    = document.querySelector('#qr-canvas-wrap img');
  let src = null;
  if (canvas) {
    src = canvas.toDataURL('image/png');
  } else if (img) {
    // QRCode.js en algunos navegadores genera <img>, no <canvas>
    const c = document.createElement('canvas');
    c.width = 200; c.height = 200;
    const ctx = c.getContext('2d');
    const image = new Image();
    image.onload = () => {
      ctx.drawImage(image, 0, 0);
      const a = document.createElement('a');
      a.download = `QR_Mesa_${_qrActualMesa}.png`;
      a.href = c.toDataURL('image/png');
      a.click();
    };
    image.src = img.src;
    return;
  }
  if (!src) { toast('No se pudo generar la imagen', 'danger', 'fa-ban'); return; }
  const a = document.createElement('a');
  a.download = `QR_Mesa_${_qrActualMesa}.png`;
  a.href = src;
  a.click();
}

function imprimirQRSolo() {
  const canvas = document.querySelector('#qr-canvas-wrap canvas');
  const img    = document.querySelector('#qr-canvas-wrap img');
  const src = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
  if (!src) { toast('No se pudo generar la imagen', 'danger', 'fa-ban'); return; }

  // Nota: SC/SE partidos para que Blogger no cierre el bloque <script>
  const SC = '<scr' + 'ipt>';
  const SE = '</' + 'script>';
  const salon = (_qrActualSalon||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const html = '<!DOCTYPE html><html><head><title>QR Mesa ' + _qrActualMesa + '</title>'
    + '<style>'
    + 'body{display:flex;flex-direction:column;align-items:center;justify-content:center;'
    + 'min-height:100vh;margin:0;font-family:sans-serif;background:#fff;}'
    + '.box{text-align:center;padding:24px;border:2px dashed #ccc;border-radius:12px;}'
    + 'img{width:200px;height:200px;display:block;margin:0 auto 12px;}'
    + 'h2{font-size:1.4rem;margin:0 0 4px;color:#111;}'
    + 'p{font-size:0.78rem;color:#666;margin:0;}'
    + '.url{font-size:0.6rem;color:#aaa;word-break:break-all;margin-top:6px;}'
    + '@media print{body{-webkit-print-color-adjust:exact;}}'
    + '</style></head><body>'
    + '<div class="box">'
    + '<img src="' + src + '">'
    + '<h2>Mesa ' + _qrActualMesa + '</h2>'
    + '<p>' + salon + '</p>'
    + '<p class="url">' + _qrActualURL + '</p>'
    + '</div>'
    + SC + 'window.onload=function(){window.print();}' + SE
    + '</body></html>';

  const blob = new Blob([html], { type: 'text/html' });
  const burl = URL.createObjectURL(blob);
  window.open(burl, '_blank');
}

function generarQRSalon(salonNombre, mesaIds) {
  if (!mesaIds || !mesaIds.length) return;
  generarQRMesa(mesaIds[0], salonNombre);
}

function imprimirQRSalon(salonNombre, mesaIds) {
  const baseURL = localStorage.getItem('qrClienteURL') || '';
  if (!baseURL) {
    toast('Primero configura la URL de la página del cliente', 'warning', 'fa-triangle-exclamation');
    return;
  }
  const base = baseURL.replace(/\?.*$/, '');

  // Construimos las tarjetas sin template literals con HTML
  const cardsHTML = mesaIds.map(function(mesaId) {
    const url = base + '?mesa=' + encodeURIComponent(mesaId);
    return '<div class="qr-card">'
      + '<div id="qrc-' + mesaId + '"></div>'
      + '<h3>Mesa ' + mesaId + '</h3>'
      + '<p>' + (salonNombre||'').replace(/</g,'&lt;') + '</p>'
      + '<p class="url">' + url + '</p>'
      + '</div>';
  }).join('');

  // Código JS de inicialización de QRCodes (sin template literal)
  const initLines = mesaIds.map(function(id) {
    return 'new QRCode(document.getElementById("qrc-' + id + '"),{'
      + 'text:"' + base + '?mesa=' + encodeURIComponent(id) + '",'
      + 'width:130,height:130,'
      + 'colorDark:"#1a1714",colorLight:"#ffffff",'
      + 'correctLevel:QRCode.CorrectLevel.M});';
  }).join('');

  const SC  = '<scr' + 'ipt';
  const SE  = '</' + 'script>';
  const html = '<!DOCTYPE html><html><head><title>QRs ' + (salonNombre||'') + '</title>'
    + SC + ' src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">' + SE
    + '<style>'
    + 'body{font-family:sans-serif;background:#fff;padding:20px;}'
    + 'h1{font-size:1.1rem;text-align:center;margin-bottom:20px;color:#333;}'
    + '.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}'
    + '.qr-card{text-align:center;padding:16px 12px;border:1.5px dashed #ccc;border-radius:10px;}'
    + '.qr-card h3{margin:10px 0 2px;font-size:1rem;color:#111;}'
    + '.qr-card p{margin:0;font-size:0.7rem;color:#666;}'
    + '.qr-card .url{font-size:0.5rem;color:#aaa;word-break:break-all;margin-top:4px;}'
    + '.no-print button{padding:10px 24px;font-size:0.9rem;cursor:pointer;border-radius:8px;background:#1a1714;color:#fff;border:none;}'
    + '@media print{.no-print{display:none}body{padding:8px}@page{size:A4;margin:10mm}}'
    + '</style></head><body>'
    + '<h1>' + (salonNombre||'') + ' &middot; ' + mesaIds.length + ' C&oacute;digos QR</h1>'
    + '<div class="grid">' + cardsHTML + '</div>'
    + '<div class="no-print" style="text-align:center;margin-top:20px">'
    + '<button onclick="window.print()">Imprimir</button>'
    + '</div>'
    + SC + '>' + initLines + SE
    + '</body></html>';

  const blob = new Blob([html], { type: 'text/html' });
  const burl = URL.createObjectURL(blob);
  window.open(burl, '_blank');
}

async function rechazarPedidoCliente(mesa, pedidoId) {
  if (!confirm('¿Rechazar este pedido del cliente?')) return;
  try {
    const snap = await rtdb.ref('/pedidosCliente/' + mesa).once('value');
    const obj = snap.val() || {};
    const firebaseKey = Object.keys(obj).find(k => obj[k].id === pedidoId);
    if (firebaseKey) {
      await rtdb.ref('/pedidosCliente/' + mesa + '/' + firebaseKey + '/estado').set('rechazado');
    }
    toast(`Pedido rechazado · Mesa ${mesa}`, 'warning', 'fa-triangle-exclamation');
    render();
  } catch(err) {
    console.error(err);
    toast('Error al rechazar el pedido', 'danger', 'fa-ban');
  }
}

function solicitarTiketABarra() {
  const t = (db.tickets||[]).find(x => x.mesa === session.mesa);
  const tot = calcTotal(t?.items||[]);

  if (tot === 0 || !t || !(t.items||[]).length) {
    toast('❌ No se puede solicitar tiket de una mesa vacía.', 'danger', 'fa-ban');
    return;
  }

  // Marcar como tiket solicitado a barra en Firebase
  const idx = db.tickets.findIndex(x => x.mesa === session.mesa);
  db.tickets[idx].tiketSolicitadoABarra = true;
  db.tickets[idx].tiketSolicitadoHora = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  sync();
  toast(`📋 Tiket enviado a barra — Mesa ${session.mesa}`, 'info', 'fa-bell');
  render();
}

function abrirTiketParaCobrar(mesa) {
  const t = (db.tickets||[]).find(x => x.mesa === mesa);
  if (!t) return;
  // 🛡️ ANTI-DOBLE-COBRO: no permitir abrir el modal si ya fue cobrado
  if (t.cobrado === true) {
    toast('⚠️ Mesa ' + mesa + ' ya cobrada · Esperando entrega de platos pendientes', 'warning', 'fa-triangle-exclamation');
    return;
  }
  const tot = calcTotal(t.items||[]);
  showModalPago(mesa, tot);
}

function closeModalPago() {

}

function cobrarConMetodo(mesa, metodo, montoParcial, montoParcial2, metodo2) {
  closeModalPago();
  const t = (db.tickets||[]).find(x => x.mesa === mesa);
  if (!t) return;

  // 🛡️ ANTI-DOBLE-COBRO: guardia final — si ya tiene cobrado:true, abortar sin registrar venta
  if (t.cobrado === true) {
    toast('⛔ Cobro abortado — esta mesa ya fue cobrada anteriormente.', 'danger', 'fa-ban');
    return;
  }

  const tot = calcTotal(t.items||[]);
  const idx = db.tickets.findIndex(x => x.mesa === mesa);

  const ahora = new Date();
  const venta = {
    ...db.tickets[idx],
    fecha:      ahora.toLocaleString('es-ES'),
    totalFinal: tot,
    metodoPago: metodo,
    ...(metodo2 ? { metodoPago2: metodo2, montoPago1: montoParcial, montoPago2: montoParcial2 } : {}),
    usuarioCobro: session.user,
    horaCobro:  ahora.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
  };
  if (!db.historicoVentas) db.historicoVentas = [];
  db.historicoVentas.push(venta);

  // Si hay platos enviados a cocina/barra pendientes de entregar,
  // mantener el ticket vivo (igual que en VD) marcado como cobrado
  const pendientesEntrega = (t.items||[]).filter(i => i.enviado && !i.entregado);
  if (pendientesEntrega.length > 0) {
    db.tickets[idx].cobrado = true;
  } else {
    db.tickets.splice(idx, 1);
    // Eliminar reserva confirmada sólo si el ticket se cierra ahora
    const reservaHoy = getReservaHoy(mesa);
    if (reservaHoy && reservaHoy.estado === 'tomada') {
      db.reservas = (db.reservas||[]).filter(r => r.id !== reservaHoy.id);
    }
  }
  sync();

  const iconoPago = metodo === 'tarjeta' ? '💳' : metodo === 'efectivo' ? '💵' : '💰';
  const metodoLabel = metodo2
    ? `Mixto (€${Number(montoParcial).toFixed(2)} ${metodo} + €${Number(montoParcial2).toFixed(2)} ${metodo2})`
    : (metodo === 'tarjeta' ? 'Tarjeta' : 'Efectivo');
  if (pendientesEntrega.length > 0) {
    toast(`${iconoPago} Mesa ${mesa} cobrada · €${tot.toFixed(2)} · ${metodoLabel} · ${pendientesEntrega.length} plato${pendientesEntrega.length>1?'s':''} pendiente${pendientesEntrega.length>1?'s':''} de entrega`, 'success', 'fa-circle-check');
  } else {
    toast(`${iconoPago} Mesa ${mesa} cobrada · €${tot.toFixed(2)} · ${metodoLabel}`, 'success', 'fa-circle-check');
  }
  
  // Volver al monitor de barra si estamos en barra
  if (session.role === 'Barra') {
    renderMonitor('barra');
  } else {
    renderMesas();
  }
}

function closeModalPagoPartes() {
  document.getElementById('pago-partes-modal')?.remove();
}

function calcRestoPago(total) {
  const ef = parseFloat(document.getElementById('monto-efectivo')?.value || 0);
  const rest = Math.max(0, total - ef).toFixed(2);
  const ti = document.getElementById('monto-tarjeta');
  if (ti) ti.value = rest;
  actualizarAvisoMixto(total);
}

function calcRestoTarjeta(total) {
  const ti = parseFloat(document.getElementById('monto-tarjeta')?.value || 0);
  const rest = Math.max(0, total - ti).toFixed(2);
  const ef = document.getElementById('monto-efectivo');
  if (ef) ef.value = rest;
  actualizarAvisoMixto(total);
}

function actualizarAvisoMixto(total) {
  const ef = parseFloat(document.getElementById('monto-efectivo')?.value || 0);
  const ti = parseFloat(document.getElementById('monto-tarjeta')?.value || 0);
  const suma = ef + ti;
  const aviso = document.getElementById('aviso-mixto');
  if (!aviso) return;
  if (round2(Math.abs(round2(suma) - round2(total))) < 0.01) {
    aviso.innerHTML = `<span style="color:var(--success)"><i class="fas fa-check" style="margin-right:4px"></i>Total cubierto</span>`;
  } else if (suma > total) {
    aviso.innerHTML = `<span style="color:var(--danger)"><i class="fas fa-triangle-exclamation" style="margin-right:4px"></i>Suma superior al total (€${suma.toFixed(2)})</span>`;
  } else {
    aviso.innerHTML = `<span style="color:var(--warning)"><i class="fas fa-triangle-exclamation" style="margin-right:4px"></i>Faltan €${(total - suma).toFixed(2)} por asignar</span>`;
  }
}

function confirmarPagoMixto(mesa, total) {
  const ef = parseFloat(document.getElementById('monto-efectivo')?.value || 0);
  const ti = parseFloat(document.getElementById('monto-tarjeta')?.value || 0);
  if (round2(Math.abs(round2(ef + ti) - round2(total))) > 0.01) {

    return;
  }
  closeModalPagoPartes();
  cobrarConMetodo(mesa, 'efectivo', ef, ti, 'tarjeta');
}

  const ahora = new Date();
  if (!db.historicoEliminaciones) db.historicoEliminaciones = [];
  db.historicoEliminaciones.push({
    id: Date.now(),
    ticketOriginal: ticket,

/* ════════════════════════════════════
   PWA — manifiesto dinámico + instalación
   Funciona como archivo único: el manifiesto
   y el icono se generan en runtime como Blob.
════════════════════════════════════ */
function initPWA() {

  // ── Icono SVG inline (letra H con gradiente naranja) ──────────
  const iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0c1020"/>
        <stop offset="100%" stop-color="#05070d"/>
      </linearGradient>
      <linearGradient id="ac" x1="0" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#ff6b35"/>
        <stop offset="100%" stop-color="#c94d1f"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" rx="96" fill="url(#bg)"/>
    <rect x="120" y="130" width="76" height="252" rx="20" fill="url(#ac)"/>
    <rect x="316" y="130" width="76" height="252" rx="20" fill="url(#ac)"/>
    <rect x="120" y="218" width="272" height="76" rx="20" fill="url(#ac)"/>
    <rect x="120" y="130" width="272" height="76" rx="20" fill="url(#ac)" opacity="0.25"/>
  </svg>`;
  const iconDataURI = 'data:image/svg+xml,' + encodeURIComponent(iconSVG);

  // ── Apple touch icon ──────────────────────────────────────────
  const appleIcon = document.createElement('link');
  appleIcon.rel   = 'apple-touch-icon';
  appleIcon.href  = iconDataURI;
  document.head.appendChild(appleIcon);

  // ── Manifest como Blob URL ────────────────────────────────────
  // Usando Blob en vez de un .json externo para funcionar
  // desde un único archivo HTML sin servidor propio.
  const manifest = {
    name:             'TPV · HOTTO DIGITAL',
    short_name:       'TPV Hotto',
    description:      'Terminal Punto de Venta para hostelería',
    start_url:        window.location.href.split('?')[0],
    scope:            '/',
    display:          'standalone',
    orientation:      'portrait-primary',
    background_color: '#05070d',
    theme_color:      '#05070d',
    categories:       ['business', 'productivity'],
    icons: [
      { src: iconDataURI, sizes: 'any',     type: 'image/svg+xml', purpose: 'any'      },
      { src: iconDataURI, sizes: 'any',     type: 'image/svg+xml', purpose: 'maskable' },
      { src: iconDataURI, sizes: '512x512', type: 'image/svg+xml' }
    ]
  };
  try {
    const blob        = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const manifestURL = URL.createObjectURL(blob);
    const linkEl      = document.createElement('link');
    linkEl.rel        = 'manifest';
    linkEl.href       = manifestURL;
    document.head.appendChild(linkEl);
  } catch(e) { console.warn('PWA manifest blob failed:', e); }

  // ── Prompt nativo (Android / Chrome Desktop) ──────────────────
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    window._pwaPrompt = e;
    const btn = document.getElementById('btn-install-pwa');
    if (btn) btn.style.display = 'flex';
  });

  window.addEventListener('appinstalled', () => {
    window._pwaPrompt = null;
    const btn = document.getElementById('btn-install-pwa');
    if (btn) btn.style.display = 'none';
    toast('✅ App instalada en la pantalla de inicio', 'success', 'fa-mobile-screen');
  });

  // ── iOS Safari: mostrar botón si no está ya instalada ─────────
  const isIOS        = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = ('standalone' in navigator) && navigator.standalone;
  if (isIOS && !isStandalone) {
    const btn = document.getElementById('btn-install-pwa');
    if (btn) {
      btn.style.display = 'flex';
      // En iOS no hay prompt nativo; el click muestra instrucciones
      btn.setAttribute('onclick', 'showIOSInstallGuide()');
    }
  }
}

function installPWA() {
  if (!window._pwaPrompt) return;
  window._pwaPrompt.prompt();
  window._pwaPrompt.userChoice.then(result => {
    if (result.outcome === 'accepted') window._pwaPrompt = null;
  });
}

            <i class="fas fa-fire"></i>
          </div>
          <div>
            <p style="font-size:0.82rem;font-weight:700;color:#fff;margin-bottom:3px">
              3 · Abre desde la pantalla de inicio
            </p>
            <p style="font-size:0.72rem;color:var(--muted)">
              El icono de TPV Hotto aparecerá en tu inicio. Ábrelo para la experiencia a pantalla completa.
            </p>
          </div>
        </div>
      </div>
      <button onclick="document.getElementById('ios-install-modal').remove()"
              class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:4px">
        Entendido
      </button>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

window.onload = () => { startClock(); init(); initPWA(); };

/* ════════════════════════════════════
   MOVER MESA
════════════════════════════════════ */
let _moverState = { mesaOrigen: null, modoTodo: true, uidsSeleccionados: [] };

function showMoverMesaModal() {
  const mesaOrigen = session.mesa;
  const tOrigen = (db.tickets||[]).find(t => t.mesa === mesaOrigen);
  if (!tOrigen || !(tOrigen.items||[]).length) {
    toast('No hay artículos que mover', 'info', 'fa-info-circle');
    return;
  }
  _moverState = { mesaOrigen, modoTodo: true, uidsSeleccionados: [] };
  _renderMoverStep1();
}

function _renderMoverStep1() {
  document.getElementById('mover-modal')?.remove();
  const tOrigen = (db.tickets||[]).find(t => t.mesa === _moverState.mesaOrigen);
  const items = tOrigen?.items || [];

  const itemsRowsHTML = items.map(i => {
    const sel = _moverState.uidsSeleccionados.includes(i.uid);
    return `<div class="mover-item-row${sel?' selected':''}" id="mrow-${i.uid}" onclick="toggleMoverItem('${i.uid}')">
      <div class="mover-chk${sel?' checked':''}" id="mchk-${i.uid}">
        ${sel ? '<i class="fas fa-check"></i>' : ''}
      </div>
      <span style="font-size:1.15rem;flex-shrink:0">${i.icono||'🍽️'}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:0.8rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(i.nombre)}</div>
        <div style="font-size:0.62rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px">
          <span>${i.cantidad}× · ${fmtLine(i)}</span>
          ${i.enviado ? '<span style="color:var(--success);font-weight:700">✓ Enviado</span>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'mover-modal';
  modal.innerHTML = `
    <div class="modal-box" style="max-width:480px">
      <div class="modal-title">
        <div class="modal-icon" style="background:rgba(167,139,250,0.12);color:var(--purple)">
          <i class="fas fa-right-left"></i>
        </div>
        Mover Mesa · ${_moverState.mesaOrigen}
        <button onclick="closeMoverModal()" style="margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px;line-height:1"><i class="fas fa-xmark"></i></button>
      </div>

      <!-- Modo -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        <button class="mover-mode-btn${_moverState.modoTodo?' active':''}" id="mbtn-todo" onclick="setMoverModo(true)">
          <i class="fas fa-layer-group"></i>
          <span>Todo el ticket</span>
        </button>
        <button class="mover-mode-btn${!_moverState.modoTodo?' active':''}" id="mbtn-sel" onclick="setMoverModo(false)">
          <i class="fas fa-list-check"></i>
          <span>Seleccionar productos</span>
        </button>
      </div>

      <!-- Lista items (modo selección) -->
      <div id="mover-items-wrap" style="display:${_moverState.modoTodo?'none':'block'};margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:0.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px">
            <span id="mover-sel-count">${_moverState.uidsSeleccionados.length}</span> / ${items.length} seleccionados
          </span>
          <button onclick="toggleTodosMover()" style="font-size:0.68rem;font-weight:700;color:var(--purple);background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.25);border-radius:100px;padding:4px 10px;cursor:pointer;font-family:var(--fh)">
            Seleccionar todo
          </button>
        </div>
        <div style="border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;max-height:240px;overflow-y:auto">
          ${itemsRowsHTML}
        </div>
      </div>

      <!-- Footer -->
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="flex:1" onclick="closeMoverModal()">
          <i class="fas fa-xmark"></i> Cancelar
        </button>
        <button class="btn btn-primary" style="flex:2;background:rgba(167,139,250,0.15);border-color:rgba(167,139,250,0.4);color:var(--purple)" onclick="moverSiguientePaso()">
          <i class="fas fa-arrow-right"></i> Elegir mesa destino
        </button>
      </div>
    </div>`;

  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) closeMoverModal(); });
}

function setMoverModo(todo) {
  _moverState.modoTodo = todo;
  document.getElementById('mbtn-todo')?.classList.toggle('active', todo);
  document.getElementById('mbtn-sel')?.classList.toggle('active', !todo);
  const wrap = document.getElementById('mover-items-wrap');
  if (wrap) wrap.style.display = todo ? 'none' : 'block';
}

function toggleMoverItem(uid) {
  const idx = _moverState.uidsSeleccionados.indexOf(uid);
  const ahora = idx === -1;
  if (ahora) _moverState.uidsSeleccionados.push(uid);
  else _moverState.uidsSeleccionados.splice(idx, 1);

  // Visual update
  const row = document.getElementById('mrow-' + uid);
  const chk = document.getElementById('mchk-' + uid);
  if (row) row.classList.toggle('selected', ahora);
  if (chk) {
    chk.classList.toggle('checked', ahora);
    chk.innerHTML = ahora ? '<i class="fas fa-check"></i>' : '';
  }
  const cEl = document.getElementById('mover-sel-count');
  if (cEl) cEl.textContent = _moverState.uidsSeleccionados.length;
}

function toggleTodosMover() {
  const tOrigen = (db.tickets||[]).find(t => t.mesa === _moverState.mesaOrigen);
  const items = tOrigen?.items || [];
  const allSel = items.every(i => _moverState.uidsSeleccionados.includes(i.uid));
  if (allSel) {
    // deselect all
    items.forEach(i => {
      if (_moverState.uidsSeleccionados.includes(i.uid)) {
        _moverState.uidsSeleccionados = _moverState.uidsSeleccionados.filter(u => u !== i.uid);
        document.getElementById('mrow-'+i.uid)?.classList.remove('selected');
        const chk = document.getElementById('mchk-'+i.uid);
        if (chk) { chk.classList.remove('checked'); chk.innerHTML = ''; }
      }
    });
  } else {
    items.forEach(i => {
      if (!_moverState.uidsSeleccionados.includes(i.uid)) toggleMoverItem(i.uid);
    });
  }
  const cEl = document.getElementById('mover-sel-count');
  if (cEl) cEl.textContent = _moverState.uidsSeleccionados.length;
}

function moverSiguientePaso() {
  if (!_moverState.modoTodo && _moverState.uidsSeleccionados.length === 0) {
    toast('Selecciona al menos un artículo', 'danger', 'fa-triangle-exclamation');
    return;
  }
  _renderMoverStep2();
}

function _renderMoverStep2() {
  document.getElementById('mover-modal')?.remove();
  const mesas = db.mesas?.salones || initialDB.mesas.salones;
  const tOrigen = (db.tickets||[]).find(t => t.mesa === _moverState.mesaOrigen);

  // Info tag de qué se mueve
  let moverInfo;
  if (_moverState.modoTodo) {
    const n = (tOrigen?.items||[]).length;
    moverInfo = `Todo el ticket · ${n} artículo${n!==1?'s':''}`;
  } else {
    const n = _moverState.uidsSeleccionados.length;
    moverInfo = `${n} artículo${n!==1?'s':''} seleccionado${n!==1?'s':''}`;
  }

  let mesasHTML = '';
  mesas.forEach(salon => {
    const sColor = salon.color || 'var(--accent)';
    let gridItems = '';
    for (let i = 1; i <= salon.cantidad; i++) {
      const mesaId = salon.prefijo + i;
      if (mesaId === _moverState.mesaOrigen) {
        gridItems += `<div style="padding:10px 4px;border-radius:var(--r);background:rgba(255,255,255,0.03);border:1px dashed var(--border);text-align:center;font-family:var(--fh);font-size:0.75rem;font-weight:700;color:var(--muted);min-height:52px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px">
          ${mesaId}<div style="font-size:0.5rem;color:var(--muted)">origen</div>
        </div>`;
        continue;
      }
      const tDest = (db.tickets||[]).find(t => t.mesa === mesaId);
      const ocupada = tDest && (tDest.items||[]).some(it => it.enviado);
      const tot = tDest ? calcTotal(tDest.items||[]) : 0;
      gridItems += `<button class="mesa-dest-btn${ocupada?' ocupada':''}" onclick="ejecutarMoverMesa('${mesaId}')">
        <span>${mesaId}</span>
        ${ocupada ? `<span style="font-size:0.5rem;font-weight:600">€${tot.toFixed(0)}</span>` : `<span style="font-size:0.5rem;color:var(--muted)">libre</span>`}
      </button>`;
    }
    mesasHTML += `<div style="margin-bottom:16px">
      <div style="font-size:0.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:${sColor};margin-bottom:8px;display:flex;align-items:center;gap:6px">
        <span style="width:7px;height:7px;border-radius:50%;background:${sColor};display:inline-block;flex-shrink:0"></span>
        ${escHtml(salon.nombre)}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px">
        ${gridItems}
      </div>
    </div>`;
  });

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'mover-modal';
  modal.innerHTML = `
    <div class="modal-box" style="max-width:520px">
      <div class="modal-title">
        <div class="modal-icon" style="background:rgba(167,139,250,0.12);color:var(--purple)">
          <i class="fas fa-arrow-right-to-bracket"></i>
        </div>
        Mesa destino
        <button onclick="closeMoverModal()" style="margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px;line-height:1"><i class="fas fa-xmark"></i></button>
      </div>

      <!-- Info strip -->
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(167,139,250,0.07);border:1px solid rgba(167,139,250,0.2);border-radius:var(--r);margin-bottom:16px">
        <div style="width:28px;height:28px;border-radius:7px;background:rgba(167,139,250,0.12);color:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.8rem">
          <i class="fas fa-right-left"></i>
        </div>
        <div style="font-size:0.72rem;color:var(--text2)">
          Moviendo <strong style="color:var(--purple)">${moverInfo}</strong>
          desde mesa <strong style="color:var(--accent)">${_moverState.mesaOrigen}</strong> → toca la mesa destino
        </div>
      </div>

      <!-- Grid de mesas -->
      <div style="max-height:340px;overflow-y:auto">${mesasHTML}</div>

      <!-- Footer -->
      <div style="margin-top:14px">
        <button class="btn btn-ghost" style="width:100%" onclick="_renderMoverStep1()">
          <i class="fas fa-arrow-left"></i> Volver
        </button>
      </div>
    </div>`;

  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) closeMoverModal(); });
}

function ejecutarMoverMesa(mesaDestino) {
  const mesaOrigen = _moverState.mesaOrigen;
  const tOrigen = (db.tickets||[]).find(t => t.mesa === mesaOrigen);
  if (!tOrigen) return;

  if (!db.tickets) db.tickets = [];
  let tDestino = db.tickets.find(t => t.mesa === mesaDestino);
  if (!tDestino) {
    tDestino = {
      mesa: mesaDestino,
      user: session.user,
      items: [],
      abierto: new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})
    };
    db.tickets.push(tDestino);
  }

  // Qué items mover
  let itemsAMover;
  if (_moverState.modoTodo) {
    itemsAMover = [...(tOrigen.items||[])];
  } else {
    itemsAMover = (tOrigen.items||[]).filter(i => _moverState.uidsSeleccionados.includes(i.uid));
  }

  if (itemsAMover.length === 0) {
    closeMoverModal();
    toast('No hay artículos para mover', 'info');
    return;
  }

  // Mover al destino
  itemsAMover.forEach(item => {
    tDestino.items.push({...item});
    tOrigen.items = (tOrigen.items||[]).filter(i => i.uid !== item.uid);
  });

  // Si el ticket origen queda vacío, eliminarlo
  const origenVacio = (tOrigen.items||[]).length === 0;
  if (origenVacio) {
    db.tickets = db.tickets.filter(t => t.mesa !== mesaOrigen);
  }

  closeMoverModal();
  sync();

  const n = itemsAMover.length;
  toast(`✓ ${n} artículo${n!==1?'s':''} movido${n!==1?'s':''} → mesa ${mesaDestino}`, 'success', 'fa-right-left');

  // Navegar al destino si el origen quedó vacío, o volver a mesas
  if (origenVacio) {
    session.mesa = null;
    renderMesas();
  } else {
    render();
  }
}

function closeMoverModal() {
  document.getElementById('mover-modal')?.remove();
}
</script>
