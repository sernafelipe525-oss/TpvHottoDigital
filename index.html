════════════════════════════════════ */
function toast(msg, type='info', icon='') {
  const container = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success:'fa-check-circle', danger:'fa-exclamation-circle', info:'fa-info-circle' };
  t.innerHTML = `<i class="fas ${icon||icons[type]||icons.info}"></i><span>${msg}</span>`;
  container.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, 2800);
}

/* ════════════════════════════════════
   FIREBASE SYNC
════════════════════════════════════ */
rtdb.ref('/').on('value', (snapshot) => {
  const data = snapshot.val();
  // ── Detectar qué ramas cambiaron, comparando el snapshot ANTERIOR
  //    de Firebase (no el "db" local, que puede tener cambios
  //    optimistas aún no confirmados) con el snapshot NUEVO. ──
  const _prevRaw = _lastFirebaseSnapshot;
  // IMPORTANTE: clonar profundamente el snapshot antes de guardarlo.
  // "data" se asigna directamente a "db" (db = data), y el código
  // de la app modifica "db" en el sitio (p.ej. marcarListo hace
  // it.entregado = true directamente sobre db.tickets). Si guardamos
  // la misma referencia, esas mutaciones locales también "ensucian"
  // _lastFirebaseSnapshot, haciendo que la próxima comparación piense
  // que no hubo cambios -> el monitor no se actualiza hasta recargar.
  _lastFirebaseSnapshot = data ? JSON.parse(JSON.stringify(data)) : data;
  const _changed = (key) => JSON.stringify(_prevRaw ? _prevRaw[key] : undefined) !== JSON.stringify(data ? data[key] : undefined);
  const _brancheschanged = {
    tickets:        !_prevRaw || _changed('tickets'),
    productos:      !_prevRaw || _changed('productos'),
    categorias:     !_prevRaw || _changed('categorias'),
    mesas:          !_prevRaw || _changed('mesas'),
    config:         !_prevRaw || _changed('config'),
    pedidosCliente: !_prevRaw || _changed('pedidosCliente'),
  };
  if (data) {
    db = data;

    // ── Merge built-in products (fixes stale Firebase data) ──
    if (!db.productos || db.productos.length === 0) {
      db.productos = PRODUCTOS_INTEGRADOS.map(p => ({...p}));
      rtdb.ref('/productos').set(db.productos);
    } else {
      const _ids = new Set(db.productos.map(p => p.id));
      let _added = false;
      PRODUCTOS_INTEGRADOS.forEach(p => {
        if (!_ids.has(p.id)) { db.productos.push({...p}); _added = true; }
      });
      if (_added) rtdb.ref('/productos').set(db.productos);
    }

    // ── Merge built-in categories ──
    if (!db.categorias || db.categorias.length === 0) {
      db.categorias = CATEGORIAS_INTEGRADAS.map(c => ({...c}));
      rtdb.ref('/categorias').set(db.categorias);
    } else {
      const _cids = new Set(db.categorias.map(c => c.id));
      let _cadded = false;
      CATEGORIAS_INTEGRADAS.forEach(c => {
        if (!_cids.has(c.id)) { db.categorias.push({...c}); _cadded = true; }
      });
      if (_cadded) rtdb.ref('/categorias').set(db.categorias);
    }

    if (!db.config)          db.config = { nombreRestaurante:"HOTTO DIGITAL" };
    if (!db.reservas)        db.reservas = [];
    if (!db.clientesHabituales) db.clientesHabituales = [];
    if (!db.personal)        db.personal = initialDB.personal;
    if (!db.tickets)         db.tickets = [];
    if (!db.historicoVentas) db.historicoVentas = [];
    if (!db.mesas)           db.mesas = initialDB.mesas;
    if (!db.productosEliminados) db.productosEliminados = [];
    if (!db.menus)               db.menus = [];
    if (!db.despachos)           db.despachos = [];
    if (!db.pedidosCliente)      db.pedidosCliente = {};
    if (!db.inventario)          db.inventario = {};
    if (!db.inventarioMovimientos) db.inventarioMovimientos = [];
  } else {
    rtdb.ref('/').set(initialDB);
  }

  /* Update header */
  updateBrandName();
  applyLogo();
  applyBg();
  applyTextColors();  // 🆕 Aplicar colores personalizados

  /* Monitor alert + TTS */
  if (session.role === "Cocina" || session.role === "Barra") {
    const zona = session.role.toLowerCase();
    let cur = 0;

    (db.tickets||[]).forEach(t => {
      const itemsPendientes = (t.items||[]).filter(i=>i.tipo===zona && i.enviado && !i.entregado);
      cur += itemsPendientes.length;

      // ── Detección de items NUEVOS para TTS ──────────────────────
      const mesa = t.mesa;
      const snapshotAnterior = _ttsSnapshotMesa[mesa] || new Set();
      const nuevos = itemsPendientes.filter(i => !snapshotAnterior.has(i.uid));

      if (nuevos.length > 0) {
        hablarPedido(mesa, nuevos);
      }

      // Actualizar snapshot con todos los items enviados pendientes
      _ttsSnapshotMesa[mesa] = new Set(itemsPendientes.map(i => i.uid));
    });

    // Limpiar snapshots de mesas que ya no tienen tickets
    const mesasActivas = new Set((db.tickets||[]).map(t => t.mesa));
    Object.keys(_ttsSnapshotMesa).forEach(m => {
      if (!mesasActivas.has(m)) delete _ttsSnapshotMesa[m];
    });

    // ── Detección de tickets solicitados a barra (solo rol Barra) ──
    if (session.role === "Barra") {
      (db.tickets||[]).forEach(t => {
        if (t.tiketSolicitadoABarra && t.mesa && !t.mesa.startsWith('VD')) {
          if (!_ttsAnunciadoTiket.has(t.mesa)) {
            hablarTiketSolicitado(t.mesa);
            _ttsAnunciadoTiket.add(t.mesa);
          }
        } else {
          // Ya no está solicitado: resetear para que un futuro tiket vuelva a anunciarse
          _ttsAnunciadoTiket.delete(t.mesa);
        }
      });
      // Limpiar mesas que ya no tienen ticket
      _ttsAnunciadoTiket.forEach(m => {
        if (!(db.tickets||[]).find(t => t.mesa === m && t.tiketSolicitadoABarra)) {
          _ttsAnunciadoTiket.delete(m);
        }
      });
    }

    if (cur > lastMonCount) chime.play().catch(()=>{});
    lastMonCount = cur;
  }

  // ── Detección de pedidos del cliente (solo rol Camarero) ──
  if (session.role === 'Camarero') {
    const pedidosObj = db.pedidosCliente || {};
    Object.entries(pedidosObj).forEach(([mesa, pedidosMesa]) => {
      const lista = Array.isArray(pedidosMesa) ? pedidosMesa : Object.values(pedidosMesa);
      const pendientes = lista.filter(p => p.estado === 'pendiente');
      if (pendientes.length > 0) {
        const key = 'pedicli_' + mesa;
        if (!_ttsAnunciadoTiket.has(key)) {
          _ttsAnunciadoTiket.add(key);
          chime.play().catch(()=>{});
          // TTS si está disponible
          if (window.speechSynthesis) {
            const utt = new SpeechSynthesisUtterance(`Pedido del cliente en mesa ${mesa}`);
            utt.lang = 'es-ES'; utt.rate = 0.95; utt.volume = 1;
            speechSynthesis.speak(utt);
          }
        }
      } else {
        _ttsAnunciadoTiket.delete('pedicli_' + mesa);
      }
    });
  }

  /* Sync badge — actualizar solo UNA VEZ (la primera conexión).
     Antes esto se ejecutaba en CADA snapshot de Firebase, lo que
     recreaba el <span class="sync-dot"> y reiniciaba su animación
     CSS (pulse-dot) constantemente -> parpadeo visible en TODAS
     las pantallas, incluso cuando tú mismo añadías un producto. */
  const badge = document.getElementById('sync-status');
  if (badge && !badge.classList.contains('online')) {
    badge.innerHTML = '<span class="sync-dot"></span>Sincronizado';
    badge.classList.add('online');
  }

  // ── Agrupar renders rápidos + evitar parpadeo innecesario ──
  // Si llegan varias actualizaciones de Firebase casi a la vez
  // (varios camareros tomando pedidos a la vez), evitamos
  // redibujar TODA la pantalla por cada una.
  //
  // Caso especial y MUY frecuente: un camarero tiene una mesa abierta
  // y SOLO cambiaron los tickets (otro camarero envió/añadió un
  // producto en cualquier mesa). En ese caso, en vez de reconstruir
  // toda la pantalla (lo que provoca el parpadeo del panel de
  // productos/categorías), solo refrescamos la lista de su propio
  // pedido — el panel de productos no se toca y no parpadea.
  const _soloTicketsCambiaron = _brancheschanged.tickets
    && !_brancheschanged.productos && !_brancheschanged.categorias
    && !_brancheschanged.mesas && !_brancheschanged.config
    && !_brancheschanged.pedidosCliente;

  const _soloPedidosClienteCambiaron = _brancheschanged.pedidosCliente
    && !_brancheschanged.tickets && !_brancheschanged.productos && !_brancheschanged.categorias
    && !_brancheschanged.mesas && !_brancheschanged.config;

  if (!session.role) {
    init();
  } else if (_soloPedidosClienteCambiaron) {
    // ── Un cliente envió un pedido desde su móvil (mesa_cliente.html). ──
    // Esto NO afecta a tickets/productos/etc., así que en la mayoría
    // de pantallas no hace falta redibujar nada (el aviso sonoro/TTS
    // ya se procesó arriba). Solo la LISTA DE MESAS del camarero
    // muestra un badge con pedidos pendientes del cliente, así que
    // solo ahí refrescamos (y de forma ligera).
    if (session.role === 'Camarero' && !session.mesa) {
      if (_renderDebounceTimer) clearTimeout(_renderDebounceTimer);
      _renderDebounceTimer = setTimeout(() => { _renderDebounceTimer = null; renderMesas(); }, 120);
    }
    // En cualquier otro caso (camarero con mesa abierta, cocina, barra,
    // administrador) -> no redibujar nada, evita el parpadeo en todo el TPV.
  } else if (_soloTicketsCambiaron && session.role === 'Camarero' && session.mesa) {
    const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
    if (t) {
      // Actualización ligera: sin parpadeo, sin tocar el panel de productos
      _refreshTicketInPlace(t);
      refreshCatBadges();
    } else {
      // La mesa ya no tiene ticket (p.ej. se cerró) -> sí hace falta refrescar vista
      if (_renderDebounceTimer) clearTimeout(_renderDebounceTimer);
      _renderDebounceTimer = setTimeout(() => { _renderDebounceTimer = null; render(); }, 120);
    }
  } else if (_soloTicketsCambiaron && session.role === 'Administrador') {
    // ── Administrador: evitar reconstruir TODA la pantalla (cabecera +
    //    pestañas + contenido) cada vez que cualquier camarero hace
    //    un pedido. La mayoría de pestañas (Carta, Categorías, Personal,
    //    Config, Menús, Agotando, QR...) no dependen de los tickets.
    const _tabsQueDependenDeTickets = ['v','m','rm','ds'];
    if (_tabsQueDependenDeTickets.includes(adminTab)) {
      // Solo refrescar el contenido de la pestaña activa (#adm-c),
      // sin tocar la cabecera ni las pestañas -> sin parpadeo de la UI general.
      if (_renderDebounceTimer) clearTimeout(_renderDebounceTimer);
      _renderDebounceTimer = setTimeout(() => {
        _renderDebounceTimer = null;
        const c = document.getElementById('adm-c');
        if (c) tab(adminTab); else render();
      }, 120);
    }
    // Si la pestaña activa no depende de tickets -> no hacer nada.
  } else if ((session.role === 'Cocina' || session.role === 'Barra')
             && (_brancheschanged.tickets || _brancheschanged.pedidosCliente)
             && !_brancheschanged.productos && !_brancheschanged.categorias
             && !_brancheschanged.mesas && !_brancheschanged.config) {
    // ── Cocina/Barra: solo redibujar el monitor si CAMBIÓ algo que esa
    //    pantalla realmente muestra (sus propios pedidos pendientes,
    //    tikets solicitados, alertas de stock, venta directa). Un pedido
    //    de cliente o un cambio de ticket que afecta a la OTRA zona no
    //    provoca ningún parpadeo aquí. ──
    const zona = session.role === 'Cocina' ? 'cocina' : 'barra';
    const _hash = _computeMonitorHash(zona);
    if (_hash !== _lastMonitorHash) {
      _lastMonitorHash = _hash;
      if (_monitorDebounceTimer) clearTimeout(_monitorDebounceTimer);
      _monitorDebounceTimer = setTimeout(() => { _monitorDebounceTimer = null; renderMonitor(zona); }, 120);
    }
    // Si el hash no cambió -> no redibujar nada, evita el parpadeo.
  } else if (!_brancheschanged.tickets && !_brancheschanged.productos && !_brancheschanged.categorias
             && !_brancheschanged.mesas && !_brancheschanged.config && !_brancheschanged.pedidosCliente) {
    // Nada relevante cambió (p.ej. solo se actualizó inventario/despachos
    // para otro rol) -> no redibujar nada.
  } else {
    if (_renderDebounceTimer) clearTimeout(_renderDebounceTimer);
    _renderDebounceTimer = setTimeout(() => { _renderDebounceTimer = null; render(); }, 120);
  }
});

/* ════════════════════════════════════
   GENERADOR DE UID A PRUEBA DE COLISIONES
   Formato: <timestamp_ms>_<usuario_hash>_<contador>
   Garantiza unicidad incluso si dos camareros
   pulsan exactamente en el mismo milisegundo.
════════════════════════════════════ */
let _uidCounter = 0;
function genUID() {
  _uidCounter++;
  const user = (session && session.user) ? session.user.replace(/[^a-zA-Z0-9]/g,'').slice(0,6) : 'xx';
  return `${Date.now()}_${user}_${_uidCounter}`;
}

/* ════════════════════════════════════
   HASH LIGERO DEL MONITOR (Cocina/Barra)
   Genera una "huella" del estado visual relevante para una zona,
   para evitar redibujar el monitor cuando algo cambia en Firebase
   pero no afecta a lo que esa pantalla muestra (p.ej. un pedido de
   cliente que va a la OTRA zona, un camarero editando otra mesa, etc).
════════════════════════════════════ */
function _computeMonitorHash(zona) {
  const partes = [];
  (db.tickets||[]).forEach(t => {
    const pen = (t.items||[]).filter(i=>i.tipo===zona && i.enviado && !i.entregado);
    if (!pen.length && !(t.tiketSolicitadoABarra && zona==='barra')) return;
    partes.push(
      t.mesa + ':' + (t.cobrado?1:0) + ':' + (t.tiketSolicitadoABarra?1:0) + ':' + (t.propina?.monto||0) + ':' +
      pen.map(i => i.uid + '/' + i.cantidad + '/' + (i.nota||'') + '/' + (i.variante||'') + '/' + (i.motivoEliminacion||'')).join(',')
    );
  });
  // Alertas de stock visibles en esta zona
  (db.stockAlertas||[]).forEach(a => { if (a.monitor === zona) partes.push('alert:'+a.id); });
  // Venta directa en barra (botón "Retomar venta")
  if (zona === 'barra') {
    const vd = (db.tickets||[]).find(t => t.mesa && t.mesa.startsWith('VD') && !t.cobrado);
    if (vd) partes.push('vd:' + (vd.items||[]).length);
  }
  return partes.join('|');
}

/* ════════════════════════════════════
   SYNC — escritura segura por nodo
   En lugar de sobreescribir TODO Firebase,
   actualiza sólo las ramas que cambian.
   Esto evita que dos camareros se pisen.
════════════════════════════════════ */
/* ── sync() con gestión de errores y reintento único ──────────────────────
   Antes: rtdb.ref('/').set(db)  →  fire-and-forget, errores silenciosos.
   Ahora: captura el error, avisa al usuario y reintenta una vez tras 3 s.
   Devuelve la Promise para que el llamador pueda encadenar .then()/.catch().
──────────────────────────────────────────────────────────────────────── */
function sync() {
  return rtdb.ref('/').set(db)
    .catch(err => {
      console.error('❌ sync() Firebase error:', err);
      toast('⚠️ Error al sincronizar. Reintentando en 3 s…', 'danger', 'fa-cloud-slash');
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          rtdb.ref('/').set(db)
            .then(resolve)
            .catch(err2 => {
              console.error('❌ sync() reintento fallido:', err2);
              toast('🔴 Fallo persistente de sincronización. Guarda los datos manualmente.', 'danger', 'fa-triangle-exclamation');
              reject(err2);
            });
        }, 3000);
      });
    });
}

/* Sync atómico de UN ticket concreto (por mesa).
   Usa transaction() para evitar race conditions
   cuando dos camareros envían pedidos a la vez. */
function syncTicketMesa(mesa, callback) {
  rtdb.ref('/tickets').transaction(currentTickets => {
    if (currentTickets === null) currentTickets = [];
    // Buscar la mesa en el estado actual de Firebase
    const remoteIdx = currentTickets.findIndex(t => t && t.mesa === mesa);
    // Buscar el ticket local
    const localTicket = (db.tickets||[]).find(t => t.mesa === mesa);
    if (!localTicket) {
      // Si no existe localmente, eliminar en remoto también
      if (remoteIdx >= 0) currentTickets.splice(remoteIdx, 1);
    } else {
      if (remoteIdx >= 0) {
        // Ticket existe en ambos: merge seguro
        // Los items enviados del remoto tienen prioridad (otro camarero los envió)
        const remoteEnviados = (currentTickets[remoteIdx].items||[]).filter(i => i.enviado);
        const localNoEnviados = localTicket.items.filter(i => !i.enviado);
        // Construir lista final: items enviados remotos + items nuevos locales
        // Evitar duplicar UIDs
        const remoteUIDs = new Set(remoteEnviados.map(i => i.uid));
        const localNuevos = localNoEnviados.filter(i => !remoteUIDs.has(i.uid));
        currentTickets[remoteIdx] = {
          ...currentTickets[remoteIdx],
          ...localTicket,
          items: [...remoteEnviados, ...localNuevos]
        };
      } else {
        // Nuevo ticket: añadir
        currentTickets.push(localTicket);
      }
    }
    return currentTickets;
  }, (error, committed, snapshot) => {
    if (error) {
      console.error('❌ syncTicketMesa transaction error:', error);
      // Fallback: sync global
      sync();
    } else if (committed && snapshot) {
      // Actualizar db local con el estado confirmado por Firebase
      db.tickets = snapshot.val() || [];
    }
    if (callback) callback(error, committed);
  });
}

/* Sync atómico para ENVIAR pedido — garantiza que los
   items de otros camareros no se pierdan en la operación. */
function syncEnviarPedido(mesa, itemsAEnviar, metadatos, callback) {
  rtdb.ref('/tickets').transaction(currentTickets => {
    if (currentTickets === null) currentTickets = [];
    const idx = currentTickets.findIndex(t => t && t.mesa === mesa);
    if (idx < 0) return; // Mesa ya no existe, abortar
    const ticket = currentTickets[idx];
    const uidSet = new Set(itemsAEnviar.map(i => i.uid));
    // Marcar como enviados sólo los items de ESTE camarero
    ticket.items = (ticket.items||[]).map(item => {
      if (uidSet.has(item.uid) && !item.enviado) {
        return {...item, enviado: true};
      }
      return item;
    });
    // Registrar metadatos del envío
    Object.assign(ticket, metadatos);
    currentTickets[idx] = ticket;
    return currentTickets;
  }, (error, committed, snapshot) => {
    if (error) {
      console.error('❌ syncEnviarPedido transaction error:', error);
      sync(); // Fallback
    } else if (committed && snapshot) {
      db.tickets = snapshot.val() || [];
    }
    if (callback) callback(error, committed);
  });
}

/* ════════════════════════════════════
   INVENTARIO — descuento automático de stock
════════════════════════════════════ */
/** Devuelve (creando si falta) la entrada de inventario de un producto */
function getInvEntry(prodId) {
  if (!db.inventario) db.inventario = {};
  if (!db.inventario[prodId]) {
    db.inventario[prodId] = { cantidad: 0, unidad: 'ud', stockMinimo: 5, factorConsumo: 1, actualizado: null };
  }
  const e = db.inventario[prodId];
  if (e.cantidad === undefined)      e.cantidad = 0;
  if (e.unidad === undefined)        e.unidad = 'ud';
  if (e.stockMinimo === undefined)   e.stockMinimo = 5;
  if (e.factorConsumo === undefined) e.factorConsumo = 1;
  return e;
}

function getInvEstado(entry) {
  if (entry.cantidad <= 0) return 'agotado';
  if (entry.cantidad <= entry.stockMinimo) return 'bajo';
  return 'ok';
}

/** Registra un movimiento en el historial de inventario */
function _registrarMovimientoInv(prodId, prodNombre, tipo, cantidad, motivo) {
  if (!db.inventarioMovimientos) db.inventarioMovimientos = [];
  db.inventarioMovimientos.push({
    id: 'mv_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    prodId, prodNombre, tipo, // tipo: 'venta' | 'entrada' | 'ajuste'
    cantidad,
    motivo: motivo || '',
    fecha: new Date().toISOString(),
    usuario: session?.user || 'Sistema'
  });
  // Mantener el log acotado (últimos 500 movimientos)
  if (db.inventarioMovimientos.length > 500) {
    db.inventarioMovimientos = db.inventarioMovimientos.slice(-500);
  }
}

/**
 * Descuenta stock de inventario para una lista de items recién enviados a cocina/barra.
 * Llama internamente a sync() — debe invocarse DESPUÉS de confirmar el envío.
 * Solo afecta a productos que ya tienen una entrada en /inventario (cantidad > 0 o registrados).
 */
function descontarStockItems(items) {
  if (!items || !items.length) return;
  if (!db.inventario) db.inventario = {};
  let changed = false;

  items.forEach(i => {
    // Si el producto nunca se ha registrado en inventario, no crear entradas fantasma
    if (!db.inventario[i.id]) return;
    const entry = getInvEntry(i.id);
    const consumo = round2((Number(i.cantidad)||0) * (entry.factorConsumo || 1));
    if (consumo <= 0) return;

    const estadoAntes = getInvEstado(entry);
    entry.cantidad = round2(Math.max(0, entry.cantidad - consumo));
    entry.actualizado = new Date().toISOString();
    changed = true;

    _registrarMovimientoInv(i.id, i.nombre, 'venta', -consumo, `Pedido${session?.mesa ? ' mesa ' + session.mesa : ''}`);

    // Auto-generar alerta de stock si cruza a "bajo" o "agotado"
    const estadoDespues = getInvEstado(entry);
    if (estadoDespues !== 'ok' && estadoAntes !== estadoDespues) {
      const zona = i.tipo === 'cocina' ? 'cocina' : 'barra';
      addStockAlerta(i.nombre, i.icono, estadoDespues === 'agotado' ? 'Sin stock' : 'Stock bajo', zona);
    }
  });

  if (changed) sync();
}

function updateBrandName() {
  const bn = document.getElementById('brand-name');
  if (!bn || !db.config) return;
  const parts = (db.config.nombreRestaurante||'HOTTO DIGITAL').split(' ');
  const mid = Math.ceil(parts.length/2);
  const first = parts.slice(0,mid).join(' ');
  const rest  = parts.slice(mid).join(' ');
  const html = rest ? `${first} <span>${rest}</span>` : first;
  // Solo tocar el DOM si realmente cambió, para no provocar
  // parpadeos en CADA sincronización de Firebase.
  if (bn.innerHTML !== html) bn.innerHTML = html;
}

      const itemsPendientes = (t.items||[]).filter(i=>i.tipo===zona && i.enviado && !i.entregado);
      _ttsSnapshotMesa[t.mesa] = new Set(itemsPendientes.map(i => i.uid));
      if (session.role === 'Barra' && t.tiketSolicitadoABarra && t.mesa && !t.mesa.startsWith('VD')) {
        _ttsAnunciadoTiket.add(t.mesa);
      }
    });
  }
  ud.style.display = 'flex';
  toast(`Bienvenido, ${session.user}`, 'success', 'fa-circle-user');
  render();
  if (session.role === 'Cocina' || session.role === 'Barra') {
    _lastMonitorHash = _computeMonitorHash(session.role === 'Cocina' ? 'cocina' : 'barra');
  }
}

/* ── Teclado PIN ──────────────────────────────────────────────────── */
function renderPinPad(nombre, pinCorrecto) {
  let input = '';
  const pData = (db.personal||[]).find(p => p.nombre === nombre);

  function getHTML() {
    const dots = [0,1,2].map(i =>
      `<div class="pin-dot ${i < input.length ? 'filled' : ''}"></div>`
    ).join('');
    return `
      <div class="pin-wrap" id="pin-wrap">
        <div style="text-align:center;margin-bottom:6px">
          <div style="font-size:0.62rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--purple);margin-bottom:8px">
            <i class="fas fa-lock" style="margin-right:5px"></i>Introduce tu PIN
          </div>
          ${pData?.foto
            ? `<img src="${pData.foto}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(167,139,250,0.4);margin-bottom:6px">`
            : `<div style="width:42px;height:42px;border-radius:50%;background:rgba(167,139,250,0.14);color:var(--purple);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:0.9rem;border:2px solid rgba(167,139,250,0.3);margin-bottom:6px">
                 ${nombre.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
               </div>`}
          <div style="font-weight:700;font-size:0.9rem;color:var(--text)">${escHtml(nombre)}</div>
        </div>
        <div class="pin-display">${dots}</div>
        <div class="pin-pad">
          ${[1,2,3,4,5,6,7,8,9].map(n =>
            `<button class="pin-btn" onclick="_pinPress('${n}')">${n}</button>`
          ).join('')}
          <button class="pin-btn empty"></button>
          <button class="pin-btn" onclick="_pinPress('0')">0</button>
          <button class="pin-btn del" onclick="_pinDel()"><i class="fas fa-delete-left"></i></button>
        </div>
        <button class="btn btn-ghost" style="width:100%;margin-top:14px" onclick="login('Camarero')">
          <i class="fas fa-arrow-left"></i> Cambiar usuario
        </button>
      </div>`;
  }

  document.getElementById('app-body').innerHTML = `
    <div style="max-width:280px;margin:40px auto 0;padding:0 16px;animation:fadeUp 0.3s ease both">
      <button class="btn-back" onclick="init()"><i class="fas fa-arrow-left"></i> Volver</button>
      <div class="card" style="border-color:rgba(167,139,250,0.28);margin-top:0" id="pin-card">
        ${getHTML()}
      </div>
    </div>`;

  // Exponer funciones al scope global para los onclick inline
  window._pinPress = function(digit) {
    if (input.length >= 3) return;
    input += digit;
    document.getElementById('pin-card').innerHTML = getHTML();
    if (input.length === 3) {
      setTimeout(() => {
        if (input === pinCorrecto) {
          _doEnter(nombre);
        } else {
          input = '';
          const wrap = document.getElementById('pin-wrap');
          if (wrap) {
            wrap.classList.add('pin-shake');
            wrap.addEventListener('animationend', () => wrap.classList.remove('pin-shake'), { once: true });
          }
          document.getElementById('pin-card').innerHTML = getHTML();
          toast('PIN incorrecto', 'danger', 'fa-lock');
        }
      }, 120);
    }
  };
  window._pinDel = function() {
    if (input.length === 0) return;
    input = input.slice(0, -1);
    document.getElementById('pin-card').innerHTML = getHTML();
  };
}

/* ════════════════════════════════════
   RENDER ROUTER
════════════════════════════════════ */
function render() {
  if (!session.role) return;
  // ── Preservar la posición de scroll ──
  // Como las pantallas se reconstruyen por completo (innerHTML),
  // el navegador resetea a 0 el scroll de #app-body Y de cualquier
  // panel interno con scroll propio (p.ej. #cat-panel-body, donde
  // el camarero busca productos). Guardamos el scroll de TODOS los
  // elementos con id que tengan scroll, y lo restauramos después.
  const _appBody = document.getElementById('app-body');
  const _scrollMap = {};
  if (_appBody) {
    _appBody.querySelectorAll('[id]').forEach(el => {
      if (el.scrollTop > 0 || el.scrollLeft > 0) {
        _scrollMap[el.id] = { top: el.scrollTop, left: el.scrollLeft };
      }
    });
    if (_appBody.scrollTop > 0 || _appBody.scrollLeft > 0) {
      _scrollMap['app-body'] = { top: _appBody.scrollTop, left: _appBody.scrollLeft };
    }
  }

  // ── Preservar el campo de texto que el usuario está escribiendo ──
  // Si hay un input/textarea con foco dentro de #app-body, el re-render
  // lo destruye y el usuario pierde el cursor/foco a media frase.
  // Guardamos su id, valor y posición del cursor para restaurarlos.
  let _focusInfo = null;
  const _active = document.activeElement;
  if (_appBody && _active && _appBody.contains(_active) &&
      (_active.tagName === 'INPUT' || _active.tagName === 'TEXTAREA')) {
    _focusInfo = {
      id: _active.id,
      value: _active.value,
      selStart: _active.selectionStart,
      selEnd: _active.selectionEnd
    };
  }

  if (session.role === 'Camarero') {
    if (session.mesa) {
      const t = (db.tickets||[]).find(t=>t.mesa===session.mesa);
      renderTicket(t||null);
    } else renderMesas();
  } else if (session.role === 'Cocina')       renderMonitor('cocina');
  else if (session.role === 'Barra')          renderMonitor('barra');
  else if (session.role === 'Administrador')  renderAdmin();

  // Restaurar scroll de #app-body y de cualquier panel interno (p.ej. lista de productos)
  const _restoreScroll = () => {
    Object.entries(_scrollMap).forEach(([id, pos]) => {
      const el = document.getElementById(id);
      if (el) { el.scrollTop = pos.top; el.scrollLeft = pos.left; }
    });
  };
  // Doble rAF: espera a que el navegador termine de pintar el nuevo
  // contenido (y por tanto conozca su altura real) antes de fijar el scroll.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      _restoreScroll();
      // Reintento de seguridad por si el contenido (imágenes, etc.)
      // todavía estaba calculando su altura.
      setTimeout(_restoreScroll, 50);
    });
    // Restaurar foco/valor/cursor del input que el usuario estaba editando
    if (_focusInfo && _focusInfo.id) {
      const el = document.getElementById(_focusInfo.id);
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
        if (el.value !== _focusInfo.value) el.value = _focusInfo.value;
        el.focus();
        try { el.setSelectionRange(_focusInfo.selStart, _focusInfo.selEnd); } catch(e) {}
      }
    }
  });
}

function mesaOcupada(id) {
  const t = (db.tickets||[]).find(t=>t.mesa===id);
  if (!t) return null;
  return (t.items||[]).some(i=>i.enviado) ? t : null;
}

function renderMesas() {
  session.mesa = null;
  const mesas = db.mesas?.salones || initialDB.mesas.salones;

  // Preservar salón activo si sigue existiendo; si no, usar el primero
  if (!session.activeSalon || !mesas.find(s => s.id === session.activeSalon)) {
    session.activeSalon = mesas[0]?.id || null;
  }
  if (session.mesaSearch === undefined) session.mesaSearch = '';

  document.getElementById('app-body').innerHTML = `
    <div class="mesas-header">
      <h2>Mesas</h2>
      <div class="mesas-legend">
        <div class="legend-item"><span class="legend-dot libre"></span>Libre</div>
        <div class="legend-item"><span class="legend-dot ocupada"></span>Ocupada</div>
        <div class="legend-item"><span class="legend-dot reservada"></span>Reservada</div>
        <div class="legend-item"><span class="legend-dot pendiente-entrega"></span>Por entregar</div>
      </div>
      <button class="btn btn-ghost" style="margin-left:auto" onclick="init()">
        <i class="fas fa-right-from-bracket"></i> Salir
      </button>
    </div>
    <nav class="salon-tabs" id="salon-tabs-nav">${_buildSalonTabs(mesas)}</nav>
    <div class="mesas-search-wrap">
      <i class="fas fa-magnifying-glass"></i>
      <input type="text" id="mesa-search-input"
             placeholder="Buscar mesa por número o prefijo…"
             value="${(session.mesaSearch||'').replace(/"/g,'&quot;')}"
             oninput="filtrarMesas(this.value)"
             autocomplete="off" autocorrect="off" autocapitalize="off">
      <button id="mesa-search-clear" class="mesas-search-clear${session.mesaSearch ? ' visible' : ''}"
              onclick="limpiarBusquedaMesas()">
        <i class="fas fa-xmark"></i>
      </button>
    </div>
    <div id="mesas-grid-panel">${_buildMesasPanel(mesas)}</div>`;
}

// Construye las tabs de salón con contadores
function _buildSalonTabs(mesas) {
  return mesas.map(salon => {
    const ocupadas = (db.tickets||[]).filter(t =>
      t.mesa.startsWith(salon.prefijo) && (t.items||[]).some(i=>i.enviado)
    ).length;
    const total   = salon.cantidad;
    const color   = salon.color || 'var(--accent)';
    const isActive = salon.id === session.activeSalon;
    const cColor  = ocupadas > 0 ? color : 'var(--success)';
    return `<button class="salon-tab${isActive ? ' active' : ''}"
                    style="--t-color:${color}"
                    onclick="switchSalonTab('${salon.id}')">
      <span class="tab-name">${salon.nombre}</span>
      <span class="tab-counter" style="color:${cColor}">${ocupadas}/${total}</span>
      ${salon.precio_extra > 0
        ? `<span class="tab-suplem" style="color:${color}">+€${Number(salon.precio_extra).toFixed(2)}</span>`
        : ''}
    </button>`;
  }).join('');
}

// Construye el panel de mesas (tab activa o resultados de búsqueda)
function _buildMesasPanel(mesas) {
  const q = (session.mesaSearch || '').trim().toLowerCase();

  if (q) {
    // Modo búsqueda: todas las mesas de todos los salones que coincidan
    let html = '';
    let total = 0;
    mesas.forEach(salon => {
      const coinciden = [];
      for (let i = 1; i <= salon.cantidad; i++) {
        const id = salon.prefijo + i;
        if (id.toLowerCase().includes(q)) coinciden.push(id);
      }
      if (!coinciden.length) return;
      total += coinciden.length;
      const sc = salon.color || 'var(--accent)';
      html += `<div class="zona-titulo" style="border-left:3px solid ${sc};padding-left:10px">
        <span style="color:${sc}">${salon.nombre}</span>
        <span class="zona-badge" style="background:${sc}20;color:${sc};border:1px solid ${sc}40">${coinciden.length}</span>
      </div>
      <div class="grid-mesas">${coinciden.map(buildMesaBtn).join('')}</div>`;
    });
    if (!total) {
      html = `<div class="mesas-empty">
        <i class="fas fa-magnifying-glass"></i>
        Sin resultados para "<strong style="color:var(--text)">${q}</strong>"
      </div>`;
    }
    return html;
  }

  // Modo normal: solo el salón activo
  const salon = mesas.find(s => s.id === session.activeSalon);
  if (!salon) return '';
  let html = `<div class="grid-mesas" id="grid-${salon.id}">`;
  for (let i = 1; i <= salon.cantidad; i++) html += buildMesaBtn(salon.prefijo + i);
  return html + `</div>`;
}

// Cambia la tab activa (sin reconstruir el modal entero)
function switchSalonTab(salonId) {
  session.activeSalon = salonId;
  session.mesaSearch  = '';
  const mesas = db.mesas?.salones || initialDB.mesas.salones;
  // Actualizar tabs
  const nav = document.getElementById('salon-tabs-nav');
  if (nav) nav.innerHTML = _buildSalonTabs(mesas);
  // Limpiar búsqueda
  const inp = document.getElementById('mesa-search-input');
  if (inp) inp.value = '';
  const clr = document.getElementById('mesa-search-clear');
  if (clr) clr.classList.remove('visible');
  // Actualizar grid
  const panel = document.getElementById('mesas-grid-panel');
  if (panel) panel.innerHTML = _buildMesasPanel(mesas);
}

// Filtra mesas en tiempo real mientras se escribe
function filtrarMesas(val) {
  session.mesaSearch = val;
  const mesas = db.mesas?.salones || initialDB.mesas.salones;
  const clr = document.getElementById('mesa-search-clear');
  if (clr) clr.classList.toggle('visible', !!val);
  const panel = document.getElementById('mesas-grid-panel');
  if (panel) panel.innerHTML = _buildMesasPanel(mesas);
  // Cuando se borra la búsqueda, resync tabs para reflejar estado real
  if (!val) {
    const nav = document.getElementById('salon-tabs-nav');
    if (nav) nav.innerHTML = _buildSalonTabs(mesas);
  }
}

// Limpia el buscador y vuelve al salón activo
function limpiarBusquedaMesas() {
  session.mesaSearch = '';
  const inp = document.getElementById('mesa-search-input');
  if (inp) { inp.value = ''; inp.focus(); }
  const clr = document.getElementById('mesa-search-clear');
  if (clr) clr.classList.remove('visible');
  const mesas = db.mesas?.salones || initialDB.mesas.salones;
  const panel = document.getElementById('mesas-grid-panel');
  if (panel) panel.innerHTML = _buildMesasPanel(mesas);
}

function getReservaHoy(mesaId) {
  const today = new Date().toISOString().split('T')[0];
  return (db.reservas||[]).find(r => r.mesa === mesaId && r.fecha === today);
}

// ⏰ Verificar si reserva debe estar ACTIVA VISUALMENTE (2 minutos antes)
function isReservaActivaVisualmente(r) {
  const hoy = new Date().toISOString().split('T')[0];
  if (r.fecha !== hoy) return false; // Solo hoy
  
  const ahora = new Date();
  const [horaR, minR] = r.hora.split(':').map(Number);
  const fechaReserva = new Date();
  fechaReserva.setHours(horaR, minR, 0, 0);
  
  // Activar 2 minutos ANTES de la hora programada
  const activacionTime = new Date(fechaReserva.getTime() - 2 * 60 * 1000);
  
  return ahora >= activacionTime;
}

function buildMesaBtn(id) {
  const t = mesaOcupada(id);
  const reserva = getReservaHoy(id);

  // ── Pedidos del cliente pendientes para esta mesa ──
  const pedidosMesaObj = db.pedidosCliente ? (db.pedidosCliente[id] || {}) : {};
  const pedidosMesaList = Array.isArray(pedidosMesaObj) ? pedidosMesaObj : Object.values(pedidosMesaObj);
  const pedidosClientePend = pedidosMesaList.filter(p => p.estado === 'pendiente').length;

  if (t) {
    const tot = calcTotal(t.items||[]);
    // Contar items listos para entregar (enviados pero no entregados)
    const pendientesEntrega = (t.items||[]).filter(i => i.enviado && !i.entregado).length;
    const estiloMesa = pendientesEntrega > 0
      ? 'background:rgba(247,201,72,0.1);border-color:rgba(247,201,72,0.45);animation:mesa-entrega-throb 1.8s ease-in-out infinite'
      : pedidosClientePend > 0
        ? 'background:rgba(74,158,255,0.08);border-color:rgba(74,158,255,0.45);animation:mesa-entrega-throb 1.8s ease-in-out infinite'
        : '';
    return `<button class="mesa ocupada" onclick="openMesa('${id}')" style="${estiloMesa}">
      ${pendientesEntrega > 0 ? `<span class="mesa-entrega-badge">${pendientesEntrega}</span>` : ''}
      ${pedidosClientePend > 0 ? `<span class="mesa-entrega-badge" style="right:4px;left:auto;top:4px;background:var(--info);box-shadow:0 2px 8px rgba(74,158,255,0.5)"><i class="fas fa-mobile-screen" style="font-size:0.55rem"></i> ${pedidosClientePend}</span>` : ''}
      <span class="mesa-num">${id}</span>
      <span class="mesa-total">€${tot.toFixed(2)}</span>
      <span class="mesa-label">${(t.items||[]).length} art.</span>
    </button>`;
  }
  // 🎯 Reservas NO bloquean mesas — permiten tomar pedidos
  if (reserva) {
    const primerNombre = reserva.nombre.split(' ')[0].slice(0, 8);
    const activa = isReservaActivaVisualmente(reserva);
    const confirmada = reserva.estado === 'tomada';
    const cerrada = reserva.estado === 'cerrada';
    
    let estadoIcon = '📋'; // Por defecto: pendiente
    let estadoColor = 'var(--muted)';
    
    if (cerrada) {
      estadoIcon = '✓';
      estadoColor = 'var(--success)';
    } else if (confirmada) {
      estadoIcon = '✓';
      estadoColor = 'var(--success)';
    } else if (activa) {
      estadoIcon = '🔔'; // Timbre para indicar que está activa
      estadoColor = 'var(--success)';
    }
    
    return `<button class="mesa reservada" 
              onclick="openMesa('${id}')" 
              title="Reserva: ${reserva.nombre} a ${reserva.hora}${activa ? ' [ACTIVA]' : ''}"
              style="${activa ? 'background:rgba(0,229,160,0.08);border-color:rgba(0,229,160,0.35)' : ''}">
      <span class="mesa-num">${id}</span>
      <span class="mesa-total" style="font-size:0.68rem;color:${estadoColor}">${reserva.hora}</span>
      <span class="mesa-label">${primerNombre}</span>
      ${activa 
        ? `<span style="position:absolute;top:4px;right:4px;width:12px;height:12px;background:var(--success);border-radius:50%;box-shadow:0 0 12px rgba(0,229,160,0.7);animation:pulse-dot 2s ease-in-out infinite"></span>` 
        : `<span style="position:absolute;top:4px;right:4px;font-size:0.75rem;opacity:0.6">${estadoIcon}</span>`}
    </button>`;
  }
  return `<button class="mesa libre" onclick="openMesa('${id}')">
    <span class="mesa-num">${id}</span>
    <span class="mesa-label">Libre</span>
  </button>`;
}

function openMesa(id) {
  session.mesa = id;
  if (!db.tickets) db.tickets = [];
  let t = db.tickets.find(t=>t.mesa===id);
  if (!t) { 
    t = {
      mesa: id, 
      user: session.user, 
      items: [], 
      abierto: new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})
    }; 
    db.tickets.push(t); 
    // 🎯 Cargar automáticamente info de reserva si existe
    const reserva = getReservaHoy(id);
    if (reserva) {
      t.reservaInfo = { 
        nombre: reserva.nombre, 
        personas: reserva.personas, 
        hora: reserva.hora, 
        nota: reserva.nota || '', 
        telefono: reserva.telefono || '', 
        id: reserva.id, 
        estado: reserva.estado || 'pendiente'
      };
    }
    sync(); 
  }
  render();
}

function backMesas() {
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  if (t) {
    const hasEnviados = (t.items||[]).some(i=>i.enviado);
    if (!hasEnviados) {
      // Nothing sent to kitchen/bar — free the table completely
      db.tickets = db.tickets.filter(x=>x.mesa!==session.mesa);
      sync();
    }
  }
  session.mesa = null;
  renderMesas();
}

              ${esHabitual ? `<span style="font-size:0.58rem;background:rgba(0,229,160,0.1);color:var(--success);padding:2px 6px;border-radius:100px;border:1px solid rgba(0,229,160,0.2);font-family:var(--fh);font-weight:700">HABITUAL</span>` : ''}
            </div>
            ${r.telefono ? `<div style="font-size:0.72rem;color:var(--muted);margin-top:3px"><i class="fas fa-phone" style="font-size:0.6rem;margin-right:4px;color:var(--barra)"></i>${escHtml(r.telefono)}</div>` : ''}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          <div style="background:var(--surface3);border-radius:8px;padding:10px;text-align:center">
            <div style="font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-bottom:3px">Hora</div>
            <div style="font-family:var(--fh);font-weight:700;font-size:0.95rem;color:var(--barra)">${r.hora}</div>
          </div>
          <div style="background:var(--surface3);border-radius:8px;padding:10px;text-align:center">
            <div style="font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-bottom:3px">Personas</div>
            <div style="font-family:var(--fh);font-weight:700;font-size:0.95rem;color:var(--text)">${r.personas}</div>
          </div>
          <div style="background:var(--surface3);border-radius:8px;padding:10px;text-align:center">
            <div style="font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-bottom:3px">Mesa</div>
            <div style="font-family:var(--fh);font-weight:700;font-size:0.95rem;color:var(--accent)">${id}</div>
          </div>
        </div>

        ${r.nota ? `<div style="margin-top:10px;padding:9px 12px;background:rgba(247,201,72,0.07);border:1px solid rgba(247,201,72,0.2);border-radius:8px;font-size:0.72rem;color:var(--warning);font-weight:600;display:flex;align-items:flex-start;gap:6px">
          <i class="fas fa-thumbtack" style="font-size:0.6rem;margin-top:2px;flex-shrink:0"></i>
          <span>${escHtml(r.nota)}</span>
        </div>` : ''}

        ${tomadaInfo}
      </div>

      <!-- Actions -->
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" style="flex:1;min-width:90px" onclick="closeReservaModal()">
          <i class="fas fa-xmark"></i> Cerrar
        </button>
        ${existingTicket
          ? `<button class="btn btn-info" style="flex:2" onclick="closeReservaModal();openMesa('${id}')">
               <i class="fas fa-eye"></i> Ver pedido activo
             </button>`
          : `<button class="btn btn-primary" style="flex:2" onclick="tomarReserva('${id}', ${r.id})">
               <i class="fas fa-utensils"></i> Tomar pedido
             </button>`}
      </div>
      ${r.tomadaPor && !existingTicket
        ? `<p style="text-align:center;font-size:0.68rem;color:var(--muted);margin-top:10px"><i class="fas fa-info-circle" style="margin-right:4px"></i>Otro camarero ya está atendiendo esta reserva</p>`
        : ''}
    </div>`;

  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) closeReservaModal(); });
}

function closeReservaModal() {
  document.getElementById('reserva-modal')?.remove();
}

function tomarReserva(mesaId, reservaId) {
  const r = (db.reservas||[]).find(x => x.id === reservaId);
  if (r) {
    r.tomadaPor  = session.user;
    r.tomadaHora = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
    r.estado = 'tomada'; // ⏰ Marcar como TOMADA
  }
  closeReservaModal();
  openMesa(mesaId);
  // Pass reservation info to ticket header
  const t = (db.tickets||[]).find(x => x.mesa === mesaId);
  if (t && r) {
    t.reservaInfo = { nombre: r.nombre, personas: r.personas, hora: r.hora, nota: r.nota || '', telefono: r.telefono || '', id: r.id, estado: r.estado };
    sync();
  }
  toast(`Reserva de ${r?.nombre||''} tomada`, 'success', 'fa-calendar-check');
  sync();
  sync();
}

// 🎯 Confirmar que se está atendiendo la reserva
function tomarReservaDesdeTicket(mesaId) {
  const r = getReservaHoy(mesaId);
  if (!r) return;
  if (r.estado === 'tomada') {
    toast('Esta reserva ya estaba confirmada', 'info');
    return;
  }
  r.tomadaPor = session.user;
  r.tomadaHora = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  r.estado = 'tomada';
  
  // Actualizar también el ticket
  const t = (db.tickets||[]).find(x => x.mesa === mesaId);
  if (t && t.reservaInfo) {
    t.reservaInfo.estado = 'tomada';
  }
  
  sync();
  render();
  toast(`✓ Reserva de ${r.nombre} confirmada · ${r.personas} personas`, 'success', 'fa-check-circle');
}

// 🏁 Cerrar la reserva (sin afectar el cierre de caja)
function cerrarReservaDesdeTicket(mesaId) {
  const r = getReservaHoy(mesaId);
  if (!r) return;
  if (r.estado === 'cerrada') {
    toast('Esta reserva ya fue cerrada', 'info');
    return;
  }
  r.estado = 'cerrada';
  r.cerradaPor = session.user;
  r.cerradaHora = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  
  // Actualizar también el ticket
  const t = (db.tickets||[]).find(x => x.mesa === mesaId);
  if (t && t.reservaInfo) {
    t.reservaInfo.estado = 'cerrada';
  }
  
  sync();
  render();
  toast(`✓ Reserva de ${r.nombre} finalizada · Mesa ${mesaId}`, 'success', 'fa-check-double');
}

/* ════════════════════════════════════
   TICKET
════════════════════════════════════ */
/* Marcar un item como entregado en mesa */
function marcarEntregado(uid) {
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  if (!t) return;
  const it = t.items.find(i=>i.uid==uid);
  if (!it || it.entregado) return;
  it.entregado = true;
  it.horaEntrega = new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  it.entregadoPor = session.user;
  sync();
  _refreshTicketInPlace(t);
  // Si no quedan pendientes de entrega, notificar
  const restantes = (t.items||[]).filter(i => i.enviado && !i.entregado).length;
  if (restantes === 0) {
    toast(`✓ Todo entregado en mesa ${session.mesa}`, 'success', 'fa-circle-check');
  } else {
    toast(`✓ Entregado · Faltan ${restantes}`, 'success', 'fa-check');
  }
}

/* Marcar TODOS los items listos (enviados) como entregados */
function marcarTodosEntregados() {
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  if (!t) return;
  const pendientes = (t.items||[]).filter(i => i.enviado && !i.entregado);
  if (pendientes.length === 0) return;
  const ahora = new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  pendientes.forEach(i => {
    i.entregado = true;
    i.horaEntrega = ahora;
    i.entregadoPor = session.user;
  });
  sync();
  _refreshTicketInPlace(t);
  toast(`✓ ${pendientes.length} artículo${pendientes.length>1?'s':''} entregados en mesa ${session.mesa}`, 'success', 'fa-circle-check');
}

function renderTicket(t) {
  if (!t) { renderMesas(); return; }
  const items = t.items || [];
  const tot = calcTotal(items);

  // Separar items en grupos
  const noEnviados   = items.filter(i => !i.enviado);
  const listos       = items.filter(i => i.enviado && !i.entregado);
  const entregados   = items.filter(i => i.enviado && i.entregado);

  function buildItemRow(i) {
    const estaListo    = i.enviado && !i.entregado;
    const estaEntregado = i.enviado && i.entregado;
    const rowClass = estaListo ? 'item-row listo-entregar' : estaEntregado ? 'item-row ya-entregado' : 'item-row';
    const menuTag = i.esMenuLinked
      ? `<span style="font-size:0.58rem;background:rgba(0,229,160,0.1);color:var(--success);padding:2px 6px;border-radius:100px;border:1px solid rgba(0,229,160,0.2);font-weight:700">${escHtml(i.pasoNombre||i.menuNombre||'Menú')}</span>`
      : '';
    const varianteTag = i.variante
      ? `<span class="variante-badge"><i class="fas fa-circle-dot" style="font-size:0.5rem"></i> ${escHtml(i.variante)}</span>`
      : '';
    return `
      <div class="${rowClass}">
        <div class="item-icon-wrap">${i.icono||'🍽️'}</div>
        <div class="item-info">
          <div class="item-name">${escHtml(i.nombre)}</div>
          <div class="item-meta">
            ${menuTag}
            ${varianteTag}
            ${!i.enviado ? '' :
              estaEntregado
                ? `<span class="item-entregado-badge"><i class="fas fa-circle-check"></i> Entregado ${i.horaEntrega||''}</span>`
                : `<span class="item-enviado">✓ Listo</span>`}
            ${!i.enviado ? `<button class="nota-tag" onclick="setNota('${i.uid}')">${escHtml(i.nota)||'+ Nota'}</button>` : ''}
            ${i.nota && i.enviado ? `<span style="font-size:0.6rem;color:var(--muted);font-style:italic">${escHtml(i.nota)}</span>` : ''}
          </div>
        </div>
        ${!i.enviado ? `
          <div class="qty-ctrl">
            <button class="qty-btn minus" onclick="qtyChange('${i.uid}',-1)">−</button>
            <span class="qty-num">${i.cantidad}</span>
            <button class="qty-btn plus" onclick="qtyChange('${i.uid}',1)">+</button>
          </div>` :
          `<span class="item-qty">${i.cantidad}×</span>`}
        <span class="item-price">${fmtLine(i)}</span>
        ${!i.enviado ? `<button class="item-del" onclick="delItem('${i.uid}')"><i class="fas fa-xmark"></i></button>` : ''}
        ${estaListo ? `<button class="btn-entregar" onclick="marcarEntregado('${i.uid}')"><i class="fas fa-hand-holding"></i> Entregar</button>` : ''}
      </div>`;
  }

  let itemsHTML = '';
  if (items.length === 0) {
    itemsHTML = `<div class="ticket-empty">
      <div class="ticket-empty-icon">🍽️</div>
      <p>Sin artículos</p>
      <small style="color:var(--muted);font-size:0.75rem">Añade productos desde la carta</small>
    </div>`;
  } else {
    // Pendientes de envío
    if (noEnviados.length > 0) {
      itemsHTML += noEnviados.map(buildItemRow).join('');
    }
    // Listos para entregar
    if (listos.length > 0) {
      itemsHTML += listos.map(buildItemRow).join('');
    }
    // Ya entregados (colapsados al final)
    if (entregados.length > 0) {
      itemsHTML += `<div class="entregados-separator"><i class="fas fa-circle-check" style="color:var(--success);font-size:0.65rem"></i> Ya entregados (${entregados.length})</div>`;
      itemsHTML += entregados.map(buildItemRow).join('');
    }
  }

  // Banner de "listos para llevar"
  const bannerEntrega = listos.length > 0 ? `
    <div class="entrega-banner">
      <i class="fas fa-bell"></i>
      <span class="entrega-banner-count">${listos.length}</span>
      <span>${listos.length === 1 ? 'artículo listo' : 'artículos listos'} para llevar a la mesa</span>
      <button class="btn-entregar-todos" onclick="marcarTodosEntregados()">
        <i class="fas fa-hand-holding-box"></i> Entregar todo
      </button>
    </div>` : '';

  document.getElementById('app-body').innerHTML = `
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      <button class="btn-back" onclick="backMesas()"><i class="fas fa-arrow-left"></i> Mesas</button>
      <button class="btn-back" style="margin-left:auto" onclick="init()"><i class="fas fa-right-from-bracket"></i> Salir</button>
    </div>
    <div class="ticket-layout">
      <div class="ticket-panel">
        <div class="ticket-panel-header">
          <span class="ticket-mesa-badge"><i class="fas fa-chair"></i> Mesa ${t.mesa}</span>
          ${t.user ? `<span style="display:inline-flex;align-items:center;gap:5px;font-size:0.7rem;font-weight:700;font-family:var(--fh);color:var(--purple);background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.25);padding:4px 11px;border-radius:100px;letter-spacing:0.2px;flex-shrink:0"><i class="fas fa-user" style="font-size:0.55rem"></i>${escHtml(t.user)}</span>` : ''}
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto">
            ${t.abierto ? `<span style="font-size:0.68rem;color:var(--muted)"><i class="fas fa-clock" style="font-size:0.6rem;margin-right:4px"></i>${t.abierto}</span>` : ''}
            ${t.usuarioEnvio ? `<span style="font-size:0.68rem;color:var(--accent);background:rgba(255,107,53,0.1);padding:3px 8px;border-radius:100px;border:1px solid rgba(255,107,53,0.2)"><i class="fas fa-paper-plane" style="font-size:0.55rem;margin-right:4px"></i>${t.usuarioEnvio} ${t.horaEnvio||''}</span>` : ''}
            <span style="font-size:0.72rem;color:var(--muted);font-family:var(--fh)">${items.length} art.</span>
          </div>
        </div>
        ${t.reservaInfo ? `
        <div style="padding:14px 16px;background:linear-gradient(to right,rgba(74,158,255,0.06),transparent);border-bottom:1px solid rgba(74,158,255,0.2);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start">
          <div style="width:44px;height:44px;border-radius:10px;background:rgba(74,158,255,0.12);border:1px solid rgba(74,158,255,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;font-size:1.3rem">
            ⏲️
            ${t.reservaInfo.estado === 'tomada' ? '<span style="position:absolute;top:-6px;right:-6px;width:12px;height:12px;border-radius:50%;background:var(--success);border:2px solid var(--surface);box-shadow:0 0 8px rgba(0,229,160,0.6)"></span>' : ''}
          </div>
          <div style="min-width:0">
            <div style="font-family:var(--fh);font-weight:700;font-size:0.9rem;color:#fff;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px">
              ${escHtml(t.reservaInfo.nombre)}
              <span style="font-size:0.6rem;background:rgba(74,158,255,0.15);color:var(--barra);padding:2px 7px;border-radius:100px;border:1px solid rgba(74,158,255,0.3);font-weight:600;font-family:var(--fh);letter-spacing:0.3px">RESERVA</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,auto);gap:10px;font-size:0.68rem;color:var(--muted)">
              <div><i class="fas fa-clock" style="color:var(--barra);margin-right:4px;font-size:0.6rem"></i>${t.reservaInfo.hora}</div>
              <div><i class="fas fa-users" style="margin-right:4px;font-size:0.6rem"></i>${t.reservaInfo.personas} pers.</div>
              ${t.reservaInfo.telefono ? `<div><i class="fas fa-phone" style="margin-right:4px;font-size:0.6rem"></i>${escHtml(t.reservaInfo.telefono)}</div>` : ''}
            </div>
            ${t.reservaInfo.nota ? `<div style="margin-top:6px;font-size:0.65rem;color:var(--warning);font-weight:600;background:rgba(247,201,72,0.08);padding:5px 8px;border-radius:6px;border:1px solid rgba(247,201,72,0.25);display:inline-flex;align-items:center;gap:4px"><i class="fas fa-thumbtack" style="font-size:0.55rem"></i>${escHtml(t.reservaInfo.nota.length > 40 ? t.reservaInfo.nota.slice(0,40)+'…' : t.reservaInfo.nota)}</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
            ${t.reservaInfo.estado === 'cerrada' 
              ? `<span style="font-size:0.62rem;background:rgba(0,229,160,0.1);color:var(--success);padding:5px 10px;border-radius:6px;border:1px solid rgba(0,229,160,0.25);font-weight:700;font-family:var(--fh);display:flex;align-items:center;gap:5px"><i class="fas fa-circle-check" style="font-size:0.5rem"></i>FINALIZADA</span>`
              : t.reservaInfo.estado === 'tomada' 
              ? `<span style="font-size:0.62rem;background:rgba(74,158,255,0.12);color:var(--barra);padding:5px 10px;border-radius:6px;border:1px solid rgba(74,158,255,0.3);font-weight:700;font-family:var(--fh);display:flex;align-items:center;gap:5px"><i class="fas fa-user-check" style="font-size:0.5rem"></i>CONFIRMADA</span>`
              : `<span style="font-size:0.62rem;background:rgba(247,201,72,0.1);color:var(--warning);padding:5px 10px;border-radius:6px;border:1px solid rgba(247,201,72,0.25);font-weight:700;font-family:var(--fh);display:flex;align-items:center;gap:5px"><i class="fas fa-hourglass-half" style="font-size:0.5rem"></i>PENDIENTE</span>`
            }
            ${t.reservaInfo.estado !== 'cerrada' && t.reservaInfo.estado !== 'tomada' ? `<button class="btn" style="padding:6px 12px;font-size:0.68rem;background:rgba(74,158,255,0.15);border:1px solid rgba(74,158,255,0.3);color:var(--barra);font-weight:600;border-radius:6px;cursor:pointer;font-family:var(--fh)" 
                  onclick="tomarReservaDesdeTicket('${t.mesa}')"><i class="fas fa-hand-fist" style="margin-right:4px;font-size:0.55rem"></i>Confirmar</button>` : ''}
            ${t.reservaInfo.estado === 'tomada' ? `<button class="btn" style="padding:6px 12px;font-size:0.68rem;background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.25);color:var(--accent);font-weight:600;border-radius:6px;cursor:pointer;font-family:var(--fh)" 
                  onclick="cerrarReservaDesdeTicket('${t.mesa}')"><i class="fas fa-check-double" style="margin-right:4px;font-size:0.55rem"></i>Finalizar</button>` : ''}
          </div>
        </div>` : ''}
        ${bannerEntrega}
        <div class="ticket-items">${itemsHTML}</div>
        <div class="ticket-total-bar">
          <span class="total-label">Total</span>
          <span class="total-amount">€${tot.toFixed(2)}</span>
        </div>
        <div class="ticket-actions">
          <button class="btn btn-dark" onclick="enviarPedido()"><i class="fas fa-paper-plane"></i> Enviar pedido</button>
          ${(db.tickets||[]).find(x=>x.mesa===session.mesa)?.tiketSolicitadoABarra
            ? `<button class="btn btn-success" style="opacity:0.6;cursor:not-allowed" disabled><i class="fas fa-check"></i> Enviado a barra</button>`
            : `<button class="btn btn-success" onclick="solicitarTiketABarra()" id="btn-solicitar-tiket"><i class="fas fa-wine-glass"></i> Solicitar tiket a barra</button>`}
          <button class="btn btn-ghost" style="border-color:rgba(74,158,255,0.3);color:var(--barra);background:rgba(74,158,255,0.06)" onclick="mostrarQRCamarero('${t.mesa}')"><i class="fas fa-qrcode"></i> Compartir QR</button>
          ${items.length > 0 ? `<button class="btn btn-ghost" style="grid-column:1/-1;border-color:rgba(167,139,250,0.3);color:var(--purple);background:rgba(167,139,250,0.06)" onclick="showMoverMesaModal()"><i class="fas fa-right-left"></i> Mover mesa</button>` : ''}
        </div>
        ${buildPedidosClientePanel(session.mesa)}
      </div>

      <div class="prod-panel">
        <div class="filtro-tabs">
          <button class="btn-filtro ${session.filtroProducto==='barra'?'active':''}" onclick="setFiltro('barra')">
            <i class="fas fa-wine-glass"></i> Barra
          </button>
          <button class="btn-filtro ${session.filtroProducto==='cocina'?'active':''}" onclick="setFiltro('cocina')">
            <i class="fas fa-fire-burner"></i> Cocina
          </button>
        </div>
        <div class="prod-search">
          <i class="fas fa-magnifying-glass prod-search-icon"></i>
          <input type="text" id="prod-search-input" placeholder="Buscar producto…"
            value="${escHtml(session.prodSearch)}"
            oninput="doProdSearch(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
          ${session.prodSearch ? `<button onclick="clearSearch()" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0 4px;font-size:0.8rem;flex-shrink:0"><i class="fas fa-xmark"></i></button>` : ''}
        </div>
        <div class="cat-panel-body" id="cat-panel-body">
          ${buildCatPanel(items)}
        </div>
        ${buildMenusSection(items)}
      </div>
    </div>`;
}

function setFiltro(tipo) { session.filtroProducto = tipo; session.prodSearch = ''; session.openCats = null; render(); }

/* ════════════════════════════════════
   MENÚS — sección en panel producto
════════════════════════════════════ */
function buildMenusSection(ticketItems) {
  const menus = db.menus || [];
  if (menus.length === 0) return '';

  const menuBtns = menus.map(m => {
    const enT = (ticketItems||[]).filter(i => i.menuId === m.id && !i.enviado).length;
    const iconoEl = m.imagen
      ? `<img src="${m.imagen}" style="width:54px;height:54px;object-fit:cover;border-radius:8px">`
      : `<span class="prod-emoji">${m.icono||'🍽️'}</span>`;
    return `<button class="prod-btn" style="position:relative" onclick="abrirModalMenu(${m.id})">
      ${enT > 0 ? `<span class="menu-badge-pill">${enT}</span>` : ''}
      ${iconoEl}
      <span class="prod-name">${escHtml(m.nombre)}</span>
      <span class="prod-price" style="color:var(--success)">€${round2(parseFloat(m.precio)).toFixed(2)}</span>

/* ─── Modal paso a paso ─────────────────────────── */
let _menuState = { menuId: null, pasoActual: 0, selecciones: [] };

function abrirModalMenu(menuId) {
  const menu = (db.menus||[]).find(m => m.id === menuId);
  if (!menu || !(menu.pasos||[]).length) return;
  _menuState = { menuId, pasoActual: 0, selecciones: [] };
  _renderMenuPaso();
}

function _renderMenuPaso() {
  document.getElementById('menu-paso-modal')?.remove();
  const menu = (db.menus||[]).find(m => m.id === _menuState.menuId);
  if (!menu) return;
  const pasos = menu.pasos || [];
  const idx   = _menuState.pasoActual;
  const paso  = pasos[idx];
  if (!paso) { _confirmarMenu(); return; }

  const totalPasos = pasos.length;
  const dots = pasos.map((_, i) => {
    const cls = i < idx ? 'done' : i === idx ? 'active' : '';
    return `<div class="menu-step-dot ${cls}"></div>`;
  }).join('');

  const opciones = (paso.opciones || []).map(op => {
    const imgAttr = op.imagen ? ` data-img="${op.imagen}"` : '';
    const iconoEl = op.imagen
      ? `<img src="${op.imagen}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;flex-shrink:0">`
      : `<div class="menu-opcion-icon">${op.icono||'🍽️'}</div>`;
    return `<button class="menu-opcion-btn"${imgAttr} onclick="_seleccionarOpcion('${escHtml(op.nombre)}', '${escHtml(op.icono||'🍽️')}', ${op.imagen ? `'${op.imagen}'` : 'null'})">
      ${iconoEl}
      <span style="flex:1">${escHtml(op.nombre)}</span>
      <span class="menu-step-tipo ${paso.tipo||'cocina'}">${paso.tipo==='barra' ? '<i class="fas fa-wine-glass"></i> Barra' : '<i class="fas fa-fire-burner"></i> Cocina'}</span>
    </button>`;
  }).join('');

  // Resumen pasos completados
  const resumen = _menuState.selecciones.length > 0 ? `
    <div style="padding:0 0 12px">
      <div style="font-size:0.6rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Seleccionado</div>
      ${_menuState.selecciones.map((s, i) => `
        <div class="menu-resumen-item">
          ${s.imagen
            ? `<img src="${s.imagen}" style="width:28px;height:28px;object-fit:cover;border-radius:6px;flex-shrink:0">`
            : `<span style="font-size:1rem">${s.icono}</span>`}
          <span style="font-size:0.72rem;color:var(--muted)">${escHtml(pasos[i]?.nombre||'')}</span>
          <span style="font-size:0.8rem;font-weight:600;color:var(--text)">${escHtml(s.opcion)}</span>
        </div>`).join('')}
    </div>` : '';

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'menu-paso-modal';
  modal.innerHTML = `
    <div class="modal-box" style="max-width:480px;padding:0;overflow:hidden">
      <!-- Header del menú -->
      <div class="menu-step-header">
        <div style="width:46px;height:46px;background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.3);
                    border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
                    font-size:1.4rem;flex-shrink:0;overflow:hidden">
          ${menu.imagen
            ? `<img src="${menu.imagen}" style="width:46px;height:46px;object-fit:cover">`
            : menu.icono||'🍽️'}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--fh);font-weight:700;font-size:1rem;color:#fff">${escHtml(menu.nombre)}</div>
          <div style="font-size:0.7rem;color:var(--success);font-weight:600">€${round2(parseFloat(menu.precio)).toFixed(2)}</div>
        </div>
        <button onclick="cerrarMenuModal()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px;line-height:1;flex-shrink:0"><i class="fas fa-xmark"></i></button>
      </div>
      <!-- Dots progress -->
      <div style="padding:12px 18px 0;display:flex;align-items:center;gap:6px">
        ${dots}
        <span style="font-size:0.62rem;color:var(--muted);font-weight:600;margin-left:6px">Paso ${idx+1} de ${totalPasos}</span>
      </div>
      <!-- Nombre del paso -->
      <div style="padding:12px 18px 8px">
        <div style="font-family:var(--fh);font-weight:700;font-size:1.05rem;color:#fff;margin-bottom:6px">
          ${escHtml(paso.nombre)}
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--muted);margin-bottom:4px">
          Elige una opción para este paso:
        </div>
      </div>
      <!-- Opciones -->
      <div style="padding:0 18px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-bottom:12px">
        ${resumen}
        ${opciones || '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.85rem">Sin opciones definidas</div>'}
      </div>
      <!-- Footer -->
      <div style="padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px">
        ${idx > 0 ? `<button class="btn btn-ghost" style="flex:1" onclick="_pasoAnterior()"><i class="fas fa-arrow-left"></i> Atrás</button>` : `<button class="btn btn-ghost" style="flex:1" onclick="cerrarMenuModal()"><i class="fas fa-xmark"></i> Cancelar</button>`}
      </div>
    </div>`;

  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) cerrarMenuModal(); });
}

function _seleccionarOpcion(opcion, icono, imagen) {
  const menu = (db.menus||[]).find(m => m.id === _menuState.menuId);
  const paso = (menu?.pasos||[])[_menuState.pasoActual];
  _menuState.selecciones.push({ opcion, icono, imagen: imagen||null, tipo: paso?.tipo || 'cocina', pasoNombre: paso?.nombre || '' });
  _menuState.pasoActual++;
  if (_menuState.pasoActual >= (menu?.pasos||[]).length) {
    _confirmarMenu();
  } else {
    _renderMenuPaso();
  }
}

function _pasoAnterior() {
  _menuState.pasoActual--;
  _menuState.selecciones.pop();
  _renderMenuPaso();
}

function _confirmarMenu() {
  cerrarMenuModal();
  const menu = (db.menus||[]).find(m => m.id === _menuState.menuId);
  if (!menu) return;
  const t = (db.tickets||[]).find(x => x.mesa === session.mesa);
  if (!t) return;
  if (!t.items) t.items = [];

  const menuGuid = genUID(); // vínculo de grupo del menú

  _menuState.selecciones.forEach((sel, i) => {
    const paso = (menu.pasos||[])[i];
    t.items.push({
      id: `menu_${menu.id}_${i}_${Date.now()}`,
      icono: sel.icono,
      nombre: sel.opcion,
      precio: i === 0 ? parseFloat(menu.precio) : 0,  // precio solo en primer ítem
      tipo: sel.tipo,
      catId: sel.tipo === 'barra' ? 'otros_b' : 'otros_c',
      cantidad: 1,
      enviado: false,
      entregado: false,
      uid: genUID(),
      nota: '',
      menuId: menu.id,
      menuNombre: menu.nombre,
      menuGuid,  // agrupa todos los ítems de este menú
      pasoNombre: sel.pasoNombre,
      esMenuLinked: true
    });
  });

  sync();
  _refreshTicketInPlace(t);
  toast(`✓ ${menu.nombre} añadido (${_menuState.selecciones.length} pasos)`, 'success', 'fa-book-open');
}

function cerrarMenuModal() {
  document.getElementById('menu-paso-modal')?.remove();
}

function previewMenuImg() {
  const input = document.getElementById('mn-imagen');
  const preview = document.getElementById('mn-imagen-preview');
  if (!input?.files[0] || !preview) return;
  const reader = new FileReader();
  reader.onload = e => {
    preview.innerHTML = `<img src="${e.target.result}" style="max-width:64px;max-height:64px;border-radius:8px;margin-top:6px;border:1px solid var(--border)">`;
  };
  reader.readAsDataURL(input.files[0]);
}

function mnOpcionImgChange(pasoIdx, opcionIdx, input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    _menuBuilderPasos[pasoIdx].opciones[opcionIdx].imagen = e.target.result;
    mnRenderPasos();
  };
  reader.readAsDataURL(input.files[0]);
}

function _readFileAsBase64(file) {
  return new Promise((resolve) => {
    if (!file) { resolve(null); return; }
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

async function guardarNuevoMenu() {
  const nombre = (document.getElementById('mn-nombre')?.value||'').trim();
  const precio = parseFloat(document.getElementById('mn-precio')?.value);
  const icono  = (document.getElementById('mn-icono')?.value||'🍽️').trim();

  if (!nombre)    { toast('Escribe un nombre para el menú', 'danger', 'fa-exclamation'); return; }
  if (isNaN(precio)) { toast('Indica el precio del menú', 'danger', 'fa-exclamation'); return; }
  if (_menuBuilderPasos.length === 0) { toast('Añade al menos un paso al menú', 'danger', 'fa-exclamation'); return; }

  // Validar pasos
  for (let i = 0; i < _menuBuilderPasos.length; i++) {
    const p = _menuBuilderPasos[i];
    if (!p.nombre.trim()) { toast(`El paso ${i+1} necesita un nombre`, 'danger'); return; }
    if (!p.opciones.length) { toast(`El paso "${p.nombre}" necesita al menos una opción`, 'danger'); return; }
    for (let o of p.opciones) {
      if (!o.nombre.trim()) { toast(`Una opción del paso "${p.nombre}" está vacía`, 'danger'); return; }
    }
  }

  // Leer imagen del menú si se subió
  const imgInput = document.getElementById('mn-imagen');
  const imagenMenu = await _readFileAsBase64(imgInput?.files[0] || null);

  if (!db.menus) db.menus = [];
  const nuevoMenu = {
    id: Date.now(),
    nombre,
    precio,
    icono: icono || '🍽️',
    imagen: imagenMenu || null,
    pasos: _menuBuilderPasos.map(p => ({
      nombre: p.nombre.trim(),
      tipo: p.tipo,
      opciones: p.opciones.map(o => ({ nombre: o.nombre.trim(), icono: o.icono||'🍽️', imagen: o.imagen||null }))
    }))
  };
  db.menus.push(nuevoMenu);
  sync();
  _menuBuilderPasos = [];
  tab('mn');
  toast(`✓ Menú "${nombre}" creado con ${nuevoMenu.pasos.length} pasos`, 'success', 'fa-circle-check');
}

function eliminarMenu(id) {
  if (!confirm('¿Eliminar este menú?')) return;
  db.menus = (db.menus||[]).filter(m => m.id !== id);
  sync();

const DEFAULT_CATS = [
  { id:'cafe',    tipo:'barra',  icono:'☕', label:'Cafés e Infusiones' },
  { id:'cerveza', tipo:'barra',  icono:'🍺', label:'Cervezas'           },
