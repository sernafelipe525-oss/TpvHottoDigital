<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #05070d;
  --bg2:         #080b14;
  --surface:     #0c1020;
  --surface2:    #111829;
  --surface3:    #192035;
  --glass:       rgba(12,16,32,0.7);
  --border:      rgba(255,255,255,0.055);
  --border-hi:   rgba(255,255,255,0.13);
  --border-glow: rgba(255,107,53,0.35);
  --text:        #e8edf8;
  --text2:       #a8b3cc;
  --muted:       #4a5572;
  --accent:      #ff6b35;
  --accent2:     #ff8f5e;
  --accent3:     #ffb38a;
  --accent-dk:   #c94d1f;
  --success:     #00e5a0;
  --success-dk:  #00b87e;
  --danger:      #ff3b5c;
  --info:        #4a9eff;
  --warning:     #f7c948;
  --gold:        #e8c96a;
  --cocina:      #ff6b35;
  --barra:       #4a9eff;
  --purple:      #a78bfa;
  --r:           10px;
  --r-md:        14px;
  --r-lg:        18px;
  --r-xl:        24px;
  --r-2xl:       32px;
  --fh:          'Space Grotesk', sans-serif;
  --fb:          'Space Grotesk', sans-serif;
  --shadow:      0 20px 60px rgba(0,0,0,0.7);
  --shadow-sm:   0 4px 20px rgba(0,0,0,0.4);
  --glow-a:      0 0 32px rgba(255,107,53,0.35);
  --glow-s:      0 0 32px rgba(0,229,160,0.3);
  --glow-d:      0 0 32px rgba(255,59,92,0.3);
  --glow-i:      0 0 32px rgba(74,158,255,0.3);
}

body {
  background: var(--bg);
  font-family: var(--fb);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Noise texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.025;
  pointer-events: none;
  z-index: 0;
}

/* Ambient gradients */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 10% -10%, rgba(255,107,53,0.09) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 95% 100%, rgba(74,158,255,0.06) 0%, transparent 50%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(167,139,250,0.02) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

#pos-app { position: relative; z-index: 1; }

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

/* ════════════════════════════
   HEADER
═══════════════════════════ */
.pos-header {
  background: rgba(5,7,13,0.88);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 200;
}
@media (min-width: 768px) { .pos-header { padding: 0 32px; height: 66px; } }

.header-brand { display: flex; align-items: center; gap: 10px; }
.header-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dk) 100%);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  box-shadow: var(--glow-a);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s;
}
.header-logo:hover { transform: rotate(-5deg) scale(1.05); }
.header-logo::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 55%);
}
.header-name {
  font-family: var(--fh);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
  text-transform: uppercase;
}
.header-name span { color: var(--accent); }

.header-center {
  display: none;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 4px 6px;
}
@media (min-width: 900px) { .header-center { display: flex; } }
.hc-pill {
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: transparent;
  font-family: var(--fh);
  letter-spacing: 0.3px;
}
.hc-pill:hover { color: var(--text); }
.hc-pill.active { background: var(--surface3); color: var(--accent); }
#live-clock {
  font-family: var(--fh);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 100px;
  letter-spacing: 0.5px;
}

.header-right { display: flex; gap: 8px; align-items: center; }
.badge-sync {
  font-size: 0.63rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 5px 12px;
  border-radius: 100px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  transition: all 0.4s;
  display: flex; align-items: center; gap: 5px;
  white-space: nowrap;
}
.badge-sync.online { color: var(--success); border-color: rgba(0,229,160,0.25); background: rgba(0,229,160,0.06); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{ opacity: 1; transform: scale(1); } 50%{ opacity: 0.5; transform: scale(0.7); } }

.user-chip {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text2);
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 100px;
  white-space: nowrap;
  transition: border-color 0.2s;
}
.user-chip:hover { border-color: var(--border-hi); }
.role-badge {
  font-size: 0.5rem;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 100px;
  flex-shrink: 0;
}
.role-badge.camarero { background: rgba(167,139,250,0.18); color: var(--purple); border: 1px solid rgba(167,139,250,0.35); }
.role-badge.cocina   { background: rgba(255,107,53,0.15);  color: var(--cocina); border: 1px solid rgba(255,107,53,0.35); }
.role-badge.barra    { background: rgba(74,158,255,0.15);  color: var(--barra);  border: 1px solid rgba(74,158,255,0.35); }
.role-badge.administrador { background: rgba(232,201,106,0.15); color: var(--gold); border: 1px solid rgba(232,201,106,0.35); }
.user-avatar {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-dk));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem; font-weight: 800; color: #fff;
  flex-shrink: 0;
}

/* ════════════════════════════
   MAIN LAYOUT
═══════════════════════════ */
.pos-main {
  padding: 16px;
  max-width: 1200px;
  margin: 0 auto;
}
@media (min-width: 640px) { .pos-main { padding: 20px; } }
@media (min-width: 768px) { .pos-main { padding: 28px; } }

/* ════════════════════════════
   ANIMATIONS
═══════════════════════════ */
@keyframes fadeUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
@keyframes scaleIn  { from { opacity:0; transform:scale(0.93) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
@keyframes slideRight { from{ opacity:0; transform:translateX(-14px); } to{ opacity:1; transform:translateX(0); } }
@keyframes shake    { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-4px)} 40%,80%{transform:translateX(4px)} }
@keyframes pop      { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }
@keyframes spin     { to { transform: rotate(360deg); } }
@keyframes pinShake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }

/* ════════════════════════════
   PIN PAD
═══════════════════════════ */
.pin-display {
  display: flex; gap: 14px;
  justify-content: center;
  margin: 22px 0 26px;
}
.pin-dot {
  width: 15px; height: 15px;
  border-radius: 50%;
  border: 2px solid var(--border-hi);
  background: transparent;
  transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
}
.pin-dot.filled {
  background: var(--purple);
  border-color: var(--purple);
  box-shadow: 0 0 10px rgba(167,139,250,0.55);
  transform: scale(1.2);
}
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  max-width: 230px;
  margin: 0 auto;
}
.pin-btn {
  height: 58px;
  border-radius: var(--r-md);
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--fh);
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.13s;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
}
.pin-btn:hover  { background: var(--surface3); border-color: var(--border-hi); transform: translateY(-1px); }
.pin-btn:active { transform: scale(0.91); background: rgba(167,139,250,0.14); border-color: rgba(167,139,250,0.45); }
.pin-btn.del    { color: var(--muted); font-size: 0.95rem; }
.pin-btn.del:hover { color: var(--danger); border-color: rgba(255,59,92,0.35); }
.pin-btn.empty  { background: transparent; border-color: transparent; cursor: default; }
.pin-btn.empty:hover { transform: none; }
.pin-wrap { animation: scaleIn 0.22s ease both; }
.pin-wrap.pin-shake { animation: pinShake 0.35s ease; }
/* Badge PIN en cards de personal */
.personal-pin-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.58rem; font-weight: 700; letter-spacing: 0.4px;
  padding: 2px 8px; border-radius: 100px;
  margin-top: 4px; cursor: pointer; transition: all 0.15s;
}
.personal-pin-badge.has-pin  { background: rgba(167,139,250,0.14); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }
.personal-pin-badge.has-pin:hover  { background: rgba(255,59,92,0.12); color: var(--danger); border-color: rgba(255,59,92,0.3); }
.personal-pin-badge.no-pin   { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px dashed var(--border-hi); }
.personal-pin-badge.no-pin:hover   { background: rgba(167,139,250,0.08); color: var(--purple); border-color: rgba(167,139,250,0.3); }

/* ════════════════════════════
   LOGIN / ROLE SELECT
═══════════════════════════ */
.login-wrap {
  min-height: calc(100vh - 60px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 24px 16px;
  animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
.login-hero { text-align: center; }
.login-sup {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 0.65rem; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 16px;
  padding: 6px 14px;
  border: 1px solid rgba(255,107,53,0.25);
  border-radius: 100px;
  background: rgba(255,107,53,0.06);
}
.login-hero h1 {
  font-family: var(--fh);
  font-size: clamp(2rem, 6vw, 5rem);
  font-weight: 700;
  color: #fff;
  line-height: 1;
  letter-spacing: -2px;
  margin-bottom: 10px;
}
.login-hero h1 em { font-style: normal; color: var(--accent); }
.login-hero p { color: var(--muted); font-size: 0.9rem; }

.login-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  width: 100%;
  max-width: 520px;
}
@media (min-width: 540px) {
  .login-grid { grid-template-columns: repeat(4, 1fr); max-width: 700px; }
}

.btn-role {
  position: relative;
  height: 160px;
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  font-family: var(--fh);
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.3px;
  transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
  overflow: hidden;
}
@media (min-width: 768px) { .btn-role { height: 186px; } }
.btn-role::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(255,255,255,0.03) 0%, transparent 60%);
  pointer-events: none;
}
.btn-role .role-glow {
  position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
  width: 80px; height: 40px;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.3s, width 0.3s;
  pointer-events: none;
}
.btn-role:hover .role-glow { opacity: 0.5; width: 100px; }
.btn-role[data-color="camarero"] .role-glow { background: radial-gradient(ellipse, var(--purple), transparent 70%); }
.btn-role[data-color="cocina"]   .role-glow { background: radial-gradient(ellipse, var(--accent), transparent 70%); }
.btn-role[data-color="barra"]    .role-glow { background: radial-gradient(ellipse, var(--barra), transparent 70%); }
.btn-role[data-color="admin"]    .role-glow { background: radial-gradient(ellipse, var(--gold), transparent 70%); }

.btn-role:hover { transform: translateY(-6px); border-color: var(--border-hi); }
.btn-role:active { transform: translateY(-2px) scale(0.96); }
.btn-role[data-color="camarero"]:hover { box-shadow: 0 20px 50px rgba(138,99,241,0.22); border-color: rgba(138,99,241,0.4); }
.btn-role[data-color="cocina"]:hover   { box-shadow: 0 20px 50px rgba(255,107,53,0.22); border-color: rgba(255,107,53,0.4); }
.btn-role[data-color="barra"]:hover    { box-shadow: 0 20px 50px rgba(74,158,255,0.22); border-color: rgba(74,158,255,0.4); }
.btn-role[data-color="admin"]:hover    { box-shadow: 0 20px 50px rgba(232,201,106,0.22); border-color: rgba(232,201,106,0.4); }

.role-icon {
  width: 66px; height: 66px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem;
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  position: relative; z-index: 1;
}
.btn-role:hover .role-icon { transform: scale(1.15) rotate(-6deg); }
.btn-role[data-color="camarero"] .role-icon { background: rgba(138,99,241,0.13); color: var(--purple); }
.btn-role[data-color="cocina"]   .role-icon { background: rgba(255,107,53,0.13); color: var(--cocina); }
.btn-role[data-color="barra"]    .role-icon { background: rgba(74,158,255,0.13); color: var(--barra); }
.btn-role[data-color="admin"]    .role-icon { background: rgba(232,201,106,0.13); color: var(--gold); }
.role-label { position: relative; z-index: 1; font-size: 0.82rem; font-weight: 700; color: var(--text); letter-spacing: 0.3px; }

/* ════════════════════════════
   USER SELECT CARD
═══════════════════════════ */
.user-select-wrap {
  max-width: 400px;
  margin: 32px auto 0;
  padding: 0 16px;
  animation: fadeUp 0.35s ease both;
}
/* Cards de usuario en login paso 2 */
.user-cards-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 4px;
}
@media (min-width: 480px) { .user-cards-grid { grid-template-columns: repeat(3, 1fr); } }
.user-login-card {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.user-login-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.2s;
}
.user-login-card:hover { transform: translateY(-3px); border-color: var(--border-hi); }
.user-login-card:active { transform: scale(0.96); }
.user-login-card .ulc-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; font-weight: 800; color: #fff;
  flex-shrink: 0;
  transition: transform 0.2s;
  overflow: hidden;
}
.user-login-card:hover .ulc-avatar { transform: scale(1.1); }
.user-login-card .ulc-name {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text);
  text-align: center;
  line-height: 1.2;
  word-break: break-word;
}
/* Colores por rol */
.ulc-camarero .ulc-avatar { background: linear-gradient(135deg, rgba(167,139,250,0.8), rgba(138,99,241,0.9)); box-shadow: 0 4px 12px rgba(167,139,250,0.3); }
.ulc-camarero:hover        { box-shadow: 0 8px 24px rgba(167,139,250,0.18); border-color: rgba(167,139,250,0.45); }
.ulc-cocina .ulc-avatar    { background: linear-gradient(135deg, rgba(255,107,53,0.8), rgba(201,77,31,0.9));  box-shadow: 0 4px 12px rgba(255,107,53,0.3); }
.ulc-cocina:hover          { box-shadow: 0 8px 24px rgba(255,107,53,0.18);  border-color: rgba(255,107,53,0.45); }
.ulc-barra .ulc-avatar     { background: linear-gradient(135deg, rgba(74,158,255,0.8), rgba(45,110,210,0.9)); box-shadow: 0 4px 12px rgba(74,158,255,0.3); }
.ulc-barra:hover           { box-shadow: 0 8px 24px rgba(74,158,255,0.18);  border-color: rgba(74,158,255,0.45); }
.ulc-administrador .ulc-avatar { background: linear-gradient(135deg, rgba(232,201,106,0.8), rgba(180,145,50,0.9)); box-shadow: 0 4px 12px rgba(232,201,106,0.3); }
.ulc-administrador:hover   { box-shadow: 0 8px 24px rgba(232,201,106,0.18); border-color: rgba(232,201,106,0.45); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px;
  margin-bottom: 12px;
}
@media (min-width: 768px) { .card { padding: 26px; margin-bottom: 14px; } }
.card-title {
  font-family: var(--fh);
  font-size: 0.92rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 8px;
}
.card-title .ct-icon {
  width: 28px; height: 28px;
  background: rgba(255,107,53,0.12);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 0.75rem;
}

/* ════════════════════════════
   INPUTS / SELECTS
═══════════════════════════ */
select, input[type="text"], input[type="number"], input[type="password"], input[type="date"], input[type="time"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  padding: 10px 14px;
  font-family: var(--fb);
  font-size: 0.88rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  margin-bottom: 10px;
  appearance: none;
  -webkit-appearance: none;
}
@media (min-width: 768px) { select, input[type="text"], input[type="number"], input[type="password"] { padding: 11px 16px; } }
select:focus, input:focus {
  border-color: rgba(255,107,53,0.5);
  box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
  background: var(--surface3);
}
input[type="file"] {
  width: 100%;
  background: var(--surface2);
  border: 1px dashed var(--border-hi);
  border-radius: var(--r);
  color: var(--text2);
  padding: 10px 14px;
  font-family: var(--fb);
  font-size: 0.82rem;
  cursor: pointer;
  transition: border-color 0.2s;
  margin-bottom: 8px;
}
input[type="file"]:hover { border-color: rgba(255,107,53,0.4); }

/* ════════════════════════════
   BUTTONS
═══════════════════════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; padding: 10px 18px;
  border-radius: var(--r); border: none;
  font-family: var(--fh);
  font-weight: 600; font-size: 0.78rem;
  letter-spacing: 0.2px;
  cursor: pointer; transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
  white-space: nowrap;
  position: relative; overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events: none;
}
.btn:active { transform: scale(0.96); }

.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 20px rgba(255,107,53,0.35); width: 100%; }
.btn-primary:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 6px 28px rgba(255,107,53,0.45); }
.btn-success { background: var(--success); color: #05070d; box-shadow: 0 4px 20px rgba(0,229,160,0.3); }
.btn-success:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-danger  { background: var(--danger); color: #fff; box-shadow: 0 4px 20px rgba(255,59,92,0.3); }
.btn-danger:hover  { filter: brightness(1.1); transform: translateY(-1px); }
.btn-ghost   { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover   { color: var(--text); border-color: var(--border-hi); background: var(--surface2); }
.btn-ghost::after { display: none; }
.btn-dark    { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-dark:hover    { border-color: var(--border-hi); background: var(--surface3); }
.btn-dark::after { display: none; }
.btn-warning { background: var(--warning); color: #05070d; }
.btn-warning:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-info    { background: var(--info); color: #fff; box-shadow: var(--glow-i); }
.btn-info:hover    { filter: brightness(1.1); transform: translateY(-1px); }

.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 100px;
  border: 1px solid var(--border);
  background: transparent; color: var(--muted);
  font-family: var(--fh); font-size: 0.72rem;
  font-weight: 600; letter-spacing: 0.2px;
  cursor: pointer; transition: all 0.2s; margin-bottom: 16px;
}
.btn-back:hover { color: var(--text); border-color: var(--border-hi); background: var(--surface2); }
.btn-back i { font-size: 0.65rem; }

/* ════════════════════════════
   SECTION LABELS
═══════════════════════════ */
.zona-titulo {
  display: flex; align-items: center; gap: 10px;
  margin: 22px 0 12px;
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
}
.zona-titulo::before {
  content: '';
  width: 18px; height: 1px;
  background: linear-gradient(to right, var(--accent), transparent);
  flex-shrink: 0;
}
.zona-titulo::after {
  content: '';
  flex: 1; height: 1px;
  background: linear-gradient(to right, rgba(255,255,255,0.04), transparent);
}
.zona-badge {
  font-size: 0.6rem;
  padding: 2px 8px;
  border-radius: 100px;
  font-weight: 700;
  background: rgba(255,107,53,0.1);
  color: var(--accent);
  border: 1px solid rgba(255,107,53,0.2);
  letter-spacing: 1px;
}

/* ════════════════════════════
   MESAS GRID
═══════════════════════════ */
.mesas-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  animation: fadeUp 0.3s ease both;
}
.mesas-header h2 {
  font-family: var(--fh);
  font-size: 1.5rem; font-weight: 700; color: #fff;
  letter-spacing: -0.5px;
}
@media (min-width: 768px) { .mesas-header h2 { font-size: 1.9rem; } }

.mesas-legend { display: flex; gap: 14px; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--muted); font-weight: 500; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }
.legend-dot.libre   { background: var(--success); box-shadow: 0 0 8px var(--success); }
.legend-dot.ocupada   { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.legend-dot.reservada { background: var(--barra);  box-shadow: 0 0 8px var(--barra); }
.legend-dot.pendiente-entrega { background: var(--warning); box-shadow: 0 0 8px var(--warning); }

/* ════════════════════════════
   SALON TABS (vista mesas)
═══════════════════════════ */
.salon-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 14px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.salon-tabs::-webkit-scrollbar { display: none; }
.salon-tab {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 9px 16px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: var(--surface2);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
  font-family: var(--fh);
  min-width: 72px;
}
.salon-tab .tab-name {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  transition: color 0.2s;
}
.salon-tab .tab-counter {
  font-size: 0.82rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.salon-tab .tab-suplem {
  font-size: 0.52rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  opacity: 0.7;
}
.salon-tab.active {
  border-color: var(--t-color, var(--accent));
  background: color-mix(in srgb, var(--t-color, var(--accent)) 10%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--t-color, var(--accent)) 30%, transparent);
}
.salon-tab.active .tab-name { color: var(--t-color, var(--accent)); }
.salon-tab:hover:not(.active) { background: var(--surface3); border-color: rgba(255,255,255,0.1); }

/* ── Buscador de mesas ── */
.mesas-search-wrap {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 9px 14px;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.mesas-search-wrap:focus-within { border-color: rgba(255,255,255,0.22); }
.mesas-search-wrap > i { color: var(--muted); font-size: 0.78rem; flex-shrink: 0; }
.mesas-search-wrap input {
  background: none; border: none; outline: none;
  color: var(--text); font-size: 0.88rem; width: 100%;
  font-family: var(--fh); font-weight: 600; letter-spacing: 0.3px;
}
.mesas-search-wrap input::placeholder { color: var(--muted); font-weight: 400; }
.mesas-search-clear {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 0; font-size: 0.8rem; flex-shrink: 0;
  opacity: 0; pointer-events: none;
  transition: opacity 0.15s;
}
.mesas-search-clear.visible { opacity: 1; pointer-events: auto; }
/* Zona vacía en búsqueda */
.mesas-empty {
  text-align: center; padding: 52px 0; color: var(--muted);
}
.mesas-empty i { font-size: 1.6rem; display: block; margin-bottom: 12px; opacity: 0.35; }

/* ── Entrega de productos ── */
.item-row.listo-entregar {
  background: rgba(0,229,160,0.04);
  border: 1px solid rgba(0,229,160,0.18);
  border-radius: var(--r);
  animation: listo-pulse 2.5s ease-in-out infinite;
}
@keyframes listo-pulse {
  0%,100% { border-color: rgba(0,229,160,0.18); box-shadow: none; }
  50%      { border-color: rgba(0,229,160,0.4);  box-shadow: 0 0 12px rgba(0,229,160,0.12); }
}
.item-row.ya-entregado {
  opacity: 0.42;
  background: rgba(255,255,255,0.02);
}
.btn-entregar {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: 100px;
  border: 1px solid rgba(0,229,160,0.4);
  background: rgba(0,229,160,0.1);
  color: var(--success);
  font-family: var(--fh); font-size: 0.62rem; font-weight: 700;
  cursor: pointer; transition: all 0.18s;
  white-space: nowrap; letter-spacing: 0.2px;
  flex-shrink: 0;
}
.btn-entregar:hover {
  background: rgba(0,229,160,0.22);
  border-color: rgba(0,229,160,0.7);
  transform: scale(1.04);
}
.btn-entregar:active { transform: scale(0.96); }
.item-entregado-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.6rem; font-weight: 700; font-family: var(--fh);
  color: var(--success); background: rgba(0,229,160,0.08);
  border: 1px solid rgba(0,229,160,0.2); padding: 3px 8px;
  border-radius: 100px; letter-spacing: 0.2px;
}
.item-despachado-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.6rem; font-weight: 700; font-family: var(--fh);
  color: var(--purple); background: rgba(167,139,250,0.09);
  border: 1px solid rgba(167,139,250,0.25); padding: 3px 8px;
  border-radius: 100px; letter-spacing: 0.2px;
}
/* Contador de pendientes de entrega en la mesa */
.mesa-entrega-badge {
  position: absolute; top: 4px; left: 4px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--warning); color: #000;
  font-size: 0.48rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 10px rgba(247,201,72,0.6);
  animation: pulse-dot 1.5s ease-in-out infinite;
  font-family: var(--fh);
}
/* Banner de pedidos listos para llevar en la vista ticket */
.entrega-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: linear-gradient(to right, rgba(0,229,160,0.09), rgba(0,229,160,0.03));
  border-bottom: 1px solid rgba(0,229,160,0.22);
  font-size: 0.75rem; font-family: var(--fh); font-weight: 700; color: var(--success);
}
.entrega-banner i { font-size: 0.85rem; flex-shrink:0; }
.entrega-banner-count {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--success); color: #05070d;
  font-size: 0.65rem; font-weight: 800; flex-shrink: 0;
}
.btn-entregar-todos {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 100px;
  border: 1px solid rgba(0,229,160,0.5);
  background: rgba(0,229,160,0.15);
  color: var(--success);
  font-family: var(--fh); font-size: 0.65rem; font-weight: 700;
  cursor: pointer; transition: all 0.18s;
}
.btn-entregar-todos:hover { background: rgba(0,229,160,0.28); }
/* Sección separadora de entregados */
.entregados-separator {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px;
  background: rgba(255,255,255,0.02);
  border-top: 1px solid rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 0.6rem; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted);
  font-family: var(--fh);
}

.grid-mesas {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 10px;
  animation: fadeUp 0.35s ease both;
}
@media (min-width: 640px) { .grid-mesas { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); } }
@media (min-width: 768px) { .grid-mesas { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 12px; } }

.mesa {
  height: 90px;
  border: 1px solid transparent;
  border-radius: var(--r-lg);
  cursor: pointer; transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 5px; position: relative; overflow: hidden;
  font-family: var(--fh);
}
@media (min-width: 768px) { .mesa { height: 106px; border-radius: var(--r-xl); } }
.mesa .mesa-num   { font-size: 1rem; font-weight: 800; line-height: 1; opacity: 0.85; }
.mesa .mesa-label { font-size: 0.52rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: 0.6; }
.mesa .mesa-total { font-size: 1rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }

.mesa.libre {
  background: rgba(0,229,160,0.05);
  border-color: rgba(0,229,160,0.15);
  color: var(--success);
}
.mesa.libre:hover  { background: rgba(0,229,160,0.12); border-color: rgba(0,229,160,0.4); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,229,160,0.15); }
.mesa.ocupada {
  background: rgba(255,107,53,0.08);
  border-color: rgba(255,107,53,0.25);
  color: var(--accent);
  animation: mesa-throb 3s ease-in-out infinite;
}
@keyframes mesa-throb { 0%,100%{ border-color: rgba(255,107,53,0.25); } 50%{ border-color: rgba(255,107,53,0.5); } }
@keyframes mesa-entrega-throb { 0%,100%{ border-color: rgba(247,201,72,0.45); box-shadow: none; } 50%{ border-color: rgba(247,201,72,0.75); box-shadow: 0 0 18px rgba(247,201,72,0.2); } }
.mesa.ocupada:hover { background: rgba(255,107,53,0.15); border-color: rgba(255,107,53,0.5); transform: translateY(-3px); box-shadow: var(--glow-a); animation: none; }
.mesa.reservada {
  background: rgba(74,158,255,0.07);
  border-color: rgba(74,158,255,0.22);
  color: var(--barra);
  animation: mesa-reservada-pulse 4s ease-in-out infinite;
}
@keyframes mesa-reservada-pulse { 0%,100%{ border-color: rgba(74,158,255,0.22); } 50%{ border-color: rgba(74,158,255,0.5); } }
.mesa.reservada:hover { background: rgba(74,158,255,0.14); border-color: rgba(74,158,255,0.55); transform: translateY(-3px); box-shadow: var(--glow-i); animation: none; }
.mesa:active { transform: scale(0.92) !important; }

/* ════════════════════════════
   TICKET VIEW
═══════════════════════════ */
.ticket-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  animation: fadeUp 0.3s ease both;
}
@media (min-width: 820px) {
  .ticket-layout { grid-template-columns: 1fr 340px; align-items: start; gap: 16px; }
}
@media (min-width: 1000px) {
  .ticket-layout { grid-template-columns: 1fr 380px; }
}

.ticket-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.ticket-panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(to right, rgba(255,107,53,0.06), transparent);
  gap: 8px; flex-wrap: wrap;
}
@media (min-width: 768px) { .ticket-panel-header { padding: 16px 22px; } }

.ticket-mesa-badge {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255,107,53,0.1);
  border: 1px solid rgba(255,107,53,0.3);
  color: var(--accent);
  padding: 6px 14px; border-radius: 100px;
  font-family: var(--fh); font-weight: 700; font-size: 0.82rem;
}

.ticket-items { padding: 4px 0; max-height: 320px; overflow-y: auto; }
@media (min-width: 768px) { .ticket-items { max-height: 380px; } }

.item-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  animation: slideRight 0.25s ease both;
}
@media (min-width: 768px) { .item-row { padding: 11px 20px; gap: 12px; } }
.item-row:last-child { border-bottom: none; }
.item-row:hover { background: var(--surface2); }

.item-icon-wrap {
  width: 46px; height: 46px;
  background: var(--surface2);
  border-radius: var(--r);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.55rem; flex-shrink: 0;
  transition: transform 0.2s;
  border: 1px solid var(--border);
}
@media (min-width: 768px) { .item-icon-wrap { width: 52px; height: 52px; font-size: 1.8rem; } }
.item-row:hover .item-icon-wrap { transform: scale(1.08); }

.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 600; font-size: 0.8rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 768px) { .item-name { font-size: 0.85rem; } }
.item-meta { display: flex; align-items: center; gap: 5px; margin-top: 3px; flex-wrap: wrap; }

.item-qty     { font-size: 0.62rem; padding: 2px 7px; border-radius: 100px; font-weight: 600; background: var(--surface3); color: var(--muted); }
.item-enviado { font-size: 0.62rem; padding: 2px 7px; border-radius: 100px; font-weight: 700; background: rgba(0,229,160,0.1); color: var(--success); }
.nota-tag     { font-size: 0.62rem; padding: 2px 8px; border-radius: 100px; font-weight: 600; background: rgba(255,107,53,0.1); color: var(--accent); border: 1px solid rgba(255,107,53,0.2); cursor: pointer; transition: all 0.15s; }
.nota-tag:hover { background: rgba(255,107,53,0.2); }

.item-price { font-family: var(--fh); font-weight: 700; font-size: 0.85rem; color: #fff; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.item-del {
  background: transparent; border: none; color: var(--muted);
  cursor: pointer; padding: 4px 6px; border-radius: 6px;
  font-size: 0.85rem; line-height: 1; transition: all 0.15s; flex-shrink: 0;
}
.item-del:hover { color: var(--danger); background: rgba(255,59,92,0.1); }

.ticket-empty {
  padding: 40px 16px; text-align: center; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.ticket-empty-icon {
  width: 56px; height: 56px;
  background: var(--surface2);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; opacity: 0.5;
}
.ticket-empty p { font-size: 0.82rem; }

.ticket-total-bar {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2);
}
@media (min-width: 768px) { .ticket-total-bar { padding: 16px 22px; } }
.total-label { color: var(--muted); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.total-amount { font-family: var(--fh); font-size: 1.6rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
@media (min-width: 768px) { .total-amount { font-size: 1.9rem; } }

.ticket-actions {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; padding: 12px 14px;
  border-top: 1px solid var(--border);
}
@media (min-width: 768px) { .ticket-actions { padding: 14px 20px; gap: 10px; } }

/* ════════════════════════════
   QTY CONTROLS
═══════════════════════════ */
.qty-ctrl { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.qty-btn {
  width: 26px; height: 26px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface3);
  color: var(--text); font-size: 0.9rem; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0; line-height: 1;
}
@media (min-width: 768px) { .qty-btn { width: 28px; height: 28px; } }
.qty-btn:active { transform: scale(0.82); }
.qty-btn.minus:hover { background: rgba(255,59,92,0.15); border-color: rgba(255,59,92,0.3); color: var(--danger); }
.qty-btn.plus:hover  { background: rgba(0,229,160,0.15); border-color: rgba(0,229,160,0.3); color: var(--success); }
.qty-num { font-family: var(--fh); font-size: 0.88rem; font-weight: 700; color: #fff; min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }

/* ════════════════════════════
   PRODUCT PANEL
═══════════════════════════ */
.prod-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}

.filtro-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
.btn-filtro {
  padding: 13px; border: none; background: transparent; color: var(--muted);
  font-family: var(--fh); font-weight: 600; font-size: 0.72rem;
  letter-spacing: 0.3px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border-bottom: 2px solid transparent;
  position: relative;
}
.btn-filtro.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,107,53,0.04); }
.btn-filtro:not(.active):hover { color: var(--text); background: var(--surface2); }

.prod-search {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.prod-search-icon { color: var(--muted); font-size: 0.8rem; flex-shrink: 0; margin-left: 4px; }
.prod-search input {
  background: transparent;
  border: none; outline: none;
  padding: 4px 0; margin: 0;
  font-size: 0.82rem;
  color: var(--text);
  width: 100%;
  box-shadow: none;
}
.prod-search input::placeholder { color: var(--muted); }
.prod-search input:focus { border: none; box-shadow: none; background: transparent; }

.prod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px; padding: 10px;
  max-height: 480px; overflow-y: auto;
}
@media (min-width: 640px) { .prod-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); } }
@media (min-width: 768px) { .prod-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); max-height: 560px; gap: 10px; padding: 12px; } }

.prod-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text); cursor: pointer;
  padding: 14px 8px 12px; text-align: center;
  transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  font-family: var(--fb);
  position: relative; overflow: hidden;
  min-height: 110px; justify-content: center;
}
.prod-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(255,255,255,0.04) 0%, transparent 60%);
  pointer-events: none;
}
.prod-btn:hover { border-color: rgba(255,107,53,0.4); background: rgba(255,107,53,0.06); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
.prod-btn:active { transform: scale(0.93); border-color: var(--accent); }
.prod-emoji { font-size: 2.5rem; display: block; line-height: 1; transition: transform 0.25s cubic-bezier(0.22,1,0.36,1); filter: drop-shadow(0 2px 8px rgba(0,0,0,0.45)); }
@media (min-width: 768px) { .prod-emoji { font-size: 3rem; } }
.prod-btn:hover .prod-emoji { transform: scale(1.18) rotate(-4deg); }
.prod-name  { font-size: 0.65rem; font-weight: 700; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (min-width: 768px) { .prod-name { font-size: 0.72rem; } }
.prod-price { font-family: var(--fh); font-size: 0.8rem; font-weight: 800; color: var(--accent); letter-spacing: -0.3px; }
.prod-qty-badge {
  position: absolute; top: 4px; right: 4px;
  background: var(--accent); color: #fff;
  font-size: 0.58rem; font-weight: 800;
  min-width: 18px; height: 18px; padding: 0 3px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4); pointer-events: none;
  animation: pop 0.3s ease both;
}

/* ════════════════════════════
   MONITOR (COCINA / BARRA)
═══════════════════════════ */
.monitor-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 22px; flex-wrap: wrap;
  animation: fadeUp 0.3s ease both;
}
.monitor-title { font-family: var(--fh); font-size: 1.6rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
.monitor-badge {
  padding: 5px 14px; border-radius: 100px;
  font-family: var(--fh); font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.3px;
}
.monitor-badge.cocina { background: rgba(255,107,53,0.1); color: var(--cocina); border: 1px solid rgba(255,107,53,0.3); }
.monitor-badge.barra  { background: rgba(74,158,255,0.1);  color: var(--barra);  border: 1px solid rgba(74,158,255,0.3); }

.monitor-pending-count {
  font-family: var(--fh); font-size: 0.7rem; font-weight: 700;
  color: var(--muted); margin-left: auto;
}
.monitor-pending-count strong { color: var(--text); }

.monitor-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  animation: fadeUp 0.35s ease both;
}
@media (min-width: 600px) { .monitor-grid { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); } }
@media (min-width: 768px) { .monitor-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; } }

.monitor-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  transition: border-color 0.2s, transform 0.2s;
  animation: scaleIn 0.3s ease both;
}
.monitor-card:hover { border-color: var(--border-hi); transform: translateY(-2px); }
.monitor-card-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2);
}
@media (min-width: 768px) { .monitor-card-header { padding: 14px 18px; } }
.monitor-mesa-tag {
  font-family: var(--fh); font-weight: 700; font-size: 0.82rem; color: #fff;
  display: flex; align-items: center; gap: 6px;
}
.monitor-mesa-tag i { color: var(--accent); font-size: 0.65rem; }
.monitor-time { font-size: 0.65rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.monitor-count {
  font-size: 0.65rem; color: var(--accent); background: rgba(255,107,53,0.1);
  padding: 3px 10px; border-radius: 100px; font-weight: 700;
  border: 1px solid rgba(255,107,53,0.2);
}

.monitor-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
@media (min-width: 768px) { .monitor-item { gap: 14px; padding: 14px 18px; } }
.monitor-item:last-child { border-bottom: none; }
.monitor-item:hover { background: var(--surface2); }
.mon-icon {
  width: 58px; height: 58px; border-radius: var(--r-md);
  background: var(--surface2); display: flex; align-items: center;
  justify-content: center; font-size: 2rem; flex-shrink: 0;
  border: 1px solid var(--border);
  transition: transform 0.2s;
}
.monitor-item:hover .mon-icon { transform: scale(1.08); }
@media (min-width: 768px) { .mon-icon { width: 66px; height: 66px; font-size: 2.4rem; } }
.mon-info { flex: 1; min-width: 0; }
.mon-name { font-weight: 700; font-size: 0.95rem; color: #fff; line-height: 1.3; }
.mon-qty  { font-size: 0.75rem; color: var(--muted); margin-top: 4px; font-weight: 600; }
.mon-nota { font-size: 0.75rem; color: var(--warning); font-weight: 700; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.btn-listo {
  background: var(--success); color: #05070d;
  border: none; border-radius: var(--r-md); padding: 11px 18px;
  font-family: var(--fh); font-weight: 800; font-size: 0.78rem;
  letter-spacing: 0.2px; cursor: pointer;
  transition: all 0.2s cubic-bezier(0.22,1,0.36,1); flex-shrink: 0;
  box-shadow: 0 6px 20px rgba(0,229,160,0.4);
}
.btn-listo:hover { filter: brightness(1.12); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,229,160,0.5); }
.btn-listo:active { transform: scale(0.95); }

.monitor-empty {
  text-align: center; padding: 80px 16px;
  color: var(--muted); animation: fadeUp 0.3s ease both;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}

/* ── Stock Alert Strip ─────────────────────────────────────── */
.stock-alert-strip {
  margin: 14px 0 0;
  padding: 10px 14px;
  background: rgba(247,201,72,0.07);
  border: 1px solid rgba(247,201,72,0.28);
  border-radius: var(--r-md);
  animation: fadeUp 0.3s ease both;
}
.stock-alert-header {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.62rem; font-weight: 800; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--warning);
  margin-bottom: 8px;
}
.stock-alert-chips {
  display: flex; flex-wrap: wrap; gap: 7px;
}
.stock-alert-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px;
  background: rgba(247,201,72,0.1);
  border: 1px solid rgba(247,201,72,0.35);
  border-radius: 100px;
  font-size: 0.73rem; font-weight: 700; color: var(--warning);
  font-family: var(--fh);
  cursor: default;
}
.stock-chip-dismiss {
  background: none; border: none; color: rgba(247,201,72,0.55);
  cursor: pointer; padding: 0 0 0 2px; font-size: 0.72rem;
  line-height: 1; transition: color 0.15s;
}
.stock-chip-dismiss:hover { color: var(--danger); }
.empty-icon {
  width: 70px; height: 70px;
  background: var(--surface2); border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; opacity: 0.4;
}
.monitor-empty p { font-size: 0.9rem; }
.monitor-empty small { font-size: 0.78rem; opacity: 0.6; }

/* ════════════════════════════
   ADMIN
═══════════════════════════ */
.admin-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  animation: fadeUp 0.3s ease both;
}
.admin-header h2 { font-family: var(--fh); font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
@media (min-width: 768px) { .admin-header h2 { font-size: 1.9rem; } }

.admin-tabs {
  display: flex; gap: 4px; flex-wrap: wrap;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 4px;
  margin-bottom: 20px;
  animation: fadeUp 0.3s ease both;
  width: fit-content;
}
.admin-tab {
  padding: 7px 14px; border-radius: 10px;
  border: none; background: transparent;
  color: var(--muted); font-family: var(--fh); font-weight: 600;
  font-size: 0.72rem; letter-spacing: 0.2px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
@media (min-width: 768px) { .admin-tab { padding: 8px 18px; font-size: 0.78rem; } }
.admin-tab:hover     { color: var(--text); }
.admin-tab.active    { background: var(--surface3); color: var(--accent); }

.admin-stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 10px; margin-bottom: 16px;
  animation: fadeUp 0.3s ease both;
}
@media (min-width: 768px) { .admin-stat-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; } }

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 18px;
  position: relative; overflow: hidden;
  transition: border-color 0.2s, transform 0.2s;
}
@media (min-width: 768px) { .stat-card { padding: 22px; } }
.stat-card:hover { border-color: var(--border-hi); transform: translateY(-2px); }
.stat-card::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(to right, var(--accent), transparent 60%);
  opacity: 0.6;
}
.stat-icon {
  width: 46px; height: 46px;
  border-radius: var(--r);
  background: rgba(255,107,53,0.1);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 1.2rem;
  margin-bottom: 14px;
}
.stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.stat-value { font-family: var(--fh); font-size: 1.7rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
@media (min-width: 768px) { .stat-value { font-size: 2.1rem; } }
.stat-value.accent  { color: var(--accent); }
.stat-value.success { color: var(--success); }

/* ─── Camarero Stat Card ─── */
.camarero-stat-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
  position: relative;
  overflow: hidden;
}
.camarero-stat-card:hover {
  border-color: rgba(255,107,53,0.4);
  background: rgba(255,107,53,0.04);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255,107,53,0.15);
}
.camarero-stat-card.active {
  border-color: var(--accent);
  background: rgba(255,107,53,0.08);
  box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
}
.cam-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.cam-name {
  font-family: var(--fh);
  font-weight: 700;
  font-size: 0.9rem;
  color: #fff;
}
.cam-tickets {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--accent);
  background: rgba(255,107,53,0.12);
  padding: 4px 8px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.cam-stats {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cam-stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
}
.cam-label {
  color: var(--muted);
  font-weight: 600;
}
.cam-value {
  font-family: var(--fh);
  color: var(--success);
  font-weight: 700;
  font-size: 0.82rem;
}

/* ─── Forms ─── */
.form-label { font-family: var(--fh); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 700; margin-bottom: 5px; display: block; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group input, .form-group select { margin-bottom: 0; }

.prod-add-form { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: end; animation: fadeUp 0.3s ease both; }
@media (min-width: 640px) { .prod-add-form { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .prod-add-form { grid-template-columns: 1fr auto auto auto; } }

/* ─── Tables ─── */
.admin-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.admin-table th {
  text-align: left; padding: 9px 12px;
  font-family: var(--fh); font-size: 0.62rem; letter-spacing: 1px;
  text-transform: uppercase; color: var(--muted); font-weight: 700;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
@media (min-width: 768px) { .admin-table th { padding: 10px 16px; font-size: 0.65rem; } }
.admin-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
@media (min-width: 768px) { .admin-table td { padding: 12px 16px; } }
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tbody tr { transition: background 0.15s; }
.admin-table tbody tr:hover td { background: var(--surface2); }

.btn-edit-prod, .btn-del-prod {
  padding: 6px 10px; border: 1px solid var(--border);
  background: var(--surface2); border-radius: 8px;
  cursor: pointer; font-size: 0.75rem;
  transition: all 0.15s; margin-left: 4px;
}
.btn-edit-prod { color: var(--info); }
.btn-edit-prod:hover { background: rgba(74,158,255,0.12); border-color: rgba(74,158,255,0.3); }
.btn-del-prod  { color: var(--danger); }
.btn-del-prod:hover  { background: rgba(255,59,92,0.12);  border-color: rgba(255,59,92,0.3); }

/* Edit row */
.edit-prod-row {
  display: none;
  background: var(--bg2);
  padding: 14px 16px;
  gap: 10px; flex-wrap: wrap;
  border-top: 1px solid var(--border);
  align-items: flex-end;
  animation: fadeUp 0.2s ease both;
}
@media (min-width: 768px) { .edit-prod-row { padding: 16px 20px; gap: 12px; } }
.edit-prod-row.open { display: flex; }

/* Personal cards */
.personal-grid { display: grid; grid-template-columns: 1fr; gap: 8px; animation: fadeUp 0.35s ease both; }
@media (min-width: 560px) { .personal-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }

.personal-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 13px 15px;
  display: flex; align-items: center; gap: 12px;
  transition: border-color 0.2s, transform 0.2s;
}
.personal-card:hover { border-color: var(--border-hi); transform: translateY(-2px); }
.personal-avatar {
  width: 46px; height: 46px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem; flex-shrink: 0; font-weight: 700;
  position: relative; overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.2s;
}
.personal-avatar:hover { box-shadow: 0 0 0 2px var(--accent); }
.personal-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: inherit;
  display: block;
}
.personal-avatar-cam {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
  border-radius: inherit;
  font-size: 0.75rem; color: #fff;
  flex-direction: column; gap: 2px;
}
.personal-avatar:hover .personal-avatar-cam { opacity: 1; }
.personal-avatar-cam span { font-size: 0.42rem; font-weight: 700; font-family: var(--fh); letter-spacing: 0.3px; opacity: 0.9; }
.personal-avatar-del {
  position: absolute; top: -2px; right: -2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--danger); border: 1.5px solid var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.45rem; color: #fff; cursor: pointer;
  z-index: 2; opacity: 0; transition: opacity 0.15s;
  line-height: 1;
}
.personal-avatar:hover .personal-avatar-del { opacity: 1; }
.personal-name { font-family: var(--fh); font-weight: 700; font-size: 0.85rem; color: #fff; }
.personal-rol  {
  font-size: 0.63rem; font-weight: 700; margin-top: 3px;
  padding: 2px 7px; border-radius: 100px;
  display: inline-block; font-family: var(--fh); letter-spacing: 0.3px;
}
.btn-del-personal {
  margin-left: auto; flex-shrink: 0;
  background: transparent; border: none;
  color: var(--muted); cursor: pointer;
  padding: 5px 8px; border-radius: 6px;
  transition: all 0.15s; font-size: 0.8rem;
}
.btn-del-personal:hover { color: var(--danger); background: rgba(255,59,92,0.1); }

/* Danger zone */
.danger-card {
  border-color: rgba(255,59,92,0.2);
  background: rgba(255,59,92,0.03);
}
.danger-card .card-title { color: var(--danger); }
.admin-action-row { display: flex; gap: 8px; flex-wrap: wrap; animation: fadeUp 0.35s ease both; }

/* ════════════════════════════
   MODAL
═══════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(12px) saturate(150%);
  -webkit-backdrop-filter: blur(12px) saturate(150%);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; padding: 16px;
  animation: fadeIn 0.2s ease both;
}
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--r-xl);
  padding: 26px;
  width: 100%; max-width: 460px;
  box-shadow: var(--shadow);
  animation: scaleIn 0.28s cubic-bezier(0.22,1,0.36,1) both;
}
@media (min-width: 768px) { .modal-box { padding: 32px; } }
.modal-title {
  font-family: var(--fh);
  font-size: 1.05rem; font-weight: 700;

/* ════════════════════════════════════
   TEXT-TO-SPEECH — Monitor Cocina / Barra
   Anuncia número de mesa y productos
   cuando llega un pedido nuevo.
════════════════════════════════════ */
let ttsActivo = true;          // El usuario puede desactivarlo con el botón
let _ttsQueue = [];            // Cola de textos pendientes de leer
let _ttsBusy  = false;         // ¿Hay síntesis en curso?
// Snapshot de items enviados por mesa para detectar NUEVOS pedidos
let _ttsSnapshotMesa = {};     // { mesa: Set<uid> }
let _ttsAnunciadoTiket = new Set(); // mesas cuyo tiket solicitado ya fue anunciado

function _ttsFlushQueue() {
  if (_ttsBusy || _ttsQueue.length === 0) return;
  if (!window.speechSynthesis) return;
  _ttsBusy = true;
  const texto = _ttsQueue.shift();
  const utt = new SpeechSynthesisUtterance(texto);
  utt.lang  = 'es-ES';
  utt.rate  = 0.92;
  utt.pitch = 1.05;
  utt.volume = 1;
  // Preferir voz en español si hay alguna disponible
  const voces = window.speechSynthesis.getVoices();
  const vozES  = voces.find(v => v.lang.startsWith('es') && !v.name.toLowerCase().includes('online'))
              || voces.find(v => v.lang.startsWith('es'));
  if (vozES) utt.voice = vozES;
  utt.onend = utt.onerror = () => {
    _ttsBusy = false;
    setTimeout(_ttsFlushQueue, 300);
  };
  window.speechSynthesis.speak(utt);
}

function hablarPedido(mesa, items) {
  if (!ttsActivo) return;
  if (!window.speechSynthesis) return;

  const esVD    = mesa && mesa.startsWith('VD');
  const mesaStr = esVD ? 'Barra directa' : `Mesa ${mesa}`;

  // Cada item se anuncia individualmente para poder incluir su nota
  // Items con la misma nota se agrupan; con notas distintas van separados
  const grupos = [];
  items.forEach(i => {
    const nota = (i.nota || '').trim();
    // Buscar grupo existente con mismo nombre y misma nota
    const existente = grupos.find(g => g.nombre === i.nombre && g.nota === nota);
    if (existente) {
      existente.qty += (parseInt(i.cantidad) || 1);
    } else {
      grupos.push({ nombre: i.nombre, qty: parseInt(i.cantidad) || 1, nota });
    }
  });

  const productosStr = grupos.map(g => {
    const cantStr  = g.qty > 1 ? `${g.qty} ` : '';
    const notaStr  = g.nota ? `, ${g.nota}` : '';
    return `${cantStr}${g.nombre}${notaStr}`;
  }).join('. ');

  const texto = `Nuevo pedido. ${mesaStr}. ${productosStr}.`;
  _ttsQueue.push(texto);
  _ttsFlushQueue();
}

function hablarTiketSolicitado(mesa) {
  if (!ttsActivo) return;
  if (!window.speechSynthesis) return;
  const texto = `Tiket solicitado. Mesa ${mesa}.`;
  _ttsQueue.push(texto);
  _ttsFlushQueue();
}

    const u = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(u);
  }
}

/* ════════════════════════════════════
   ARITMÉTICA DE PRECIOS — sin errores de céntimos
   Trabaja en céntimos enteros (int) y convierte
   solo al mostrar. 0.1+0.2 = 0.3, no 0.30000000000000004
════════════════════════════════════ */
/** Precio → céntimos enteros.  12.5 → 1250 */
function toCents(n) {
  return Math.round(parseFloat(n) * 100);
}
/** Total de un array de items {precio, cantidad} → euros con precisión exacta */
function calcTotal(items) {
  if (!items || items.length === 0) return 0;
  const cents = (items).reduce((s, i) => {
    const qty = Math.max(0, Math.round(Number(i.cantidad) || 0));
    return s + toCents(i.precio) * qty;
  }, 0);
  return cents / 100;
}
/** Redondea a 2 decimales sin error de floating point */
function round2(n) {
  return Math.round((Number(n) + Number.EPSILON) * 100) / 100;
}
/** "€12.50" */
function fmtEur(n) {
  return '\u20AC' + round2(n).toFixed(2);
}
/** Precio de línea formateado: "€12.50" para un item {precio, cantidad} */
function fmtLine(item) {
  return fmtEur(toCents(item.precio) * item.cantidad / 100);
}
