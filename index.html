  { id:'otros_b', tipo:'barra',  icono:'🥤', label:'Otros Barra'        },
  { id:'carnes',  tipo:'cocina', icono:'🥩', label:'Carnes y Filetes'   },
  { id:'pollo',   tipo:'cocina', icono:'🍗', label:'Pollo'              },
  { id:'fritos',  tipo:'cocina', icono:'🍟', label:'Fritos y Tapas'     },
  { id:'mar',     tipo:'cocina', icono:'🦐', label:'Pescados y Mariscos'},
  { id:'huevos',  tipo:'cocina', icono:'🍳', label:'Huevos y Revueltos' },
  { id:'otros_c', tipo:'cocina', icono:'🍽️', label:'Otros Cocina'      },
];

/* Get live category list (from db or defaults) */
function getCats(tipo) {
  const all = db.categorias || DEFAULT_CATS;
  return all.filter(c => c.tipo === tipo);
}
function getAllCats() {
  return db.categorias || DEFAULT_CATS;
}

/* Assign product to category — uses explicit catId field first, then fallback */
function getCatId(p) {
  if (p.catId) {
    // Verify the catId still exists for this tipo
    const cats = getCats(p.tipo);
    if (cats.find(c => c.id === p.catId)) return p.catId;
  }
  // Auto-assign by keywords for legacy products
  const kw_map = {
    cafe:    ['café','infusión','colacao','bombón','carajillo','irlandés'],
    cerveza: ['mahou','alhambra','caña','botellín','tercio','0,0','tostada','reserva'],
    zumo:    ['zumo'],
    carnes:  ['filete','ternera','entrecot','milanesa','cinta','lomo','chuleta','pavo'],
    pollo:   ['pollo','alitas','lágrimas'],
    fritos:  ['patatas','bravas','salchipapa','croquetas','oreja','verbena','boquerones','calamares'],
    mar:     ['gambón','boquerón','calamar','marisco'],
    huevos:  ['huevo','revuelto','rotos','setas'],
  };
  const name = p.nombre.toLowerCase();
  const cats = getCats(p.tipo);
  for (const cat of cats) {
    if (cat.id.startsWith('otros')) continue;
    const kws = kw_map[cat.id] || [];
    if (kws.some(k => name.includes(k))) return cat.id;
  }
  const otros = cats.find(c => c.id.startsWith('otros'));
  return otros ? otros.id : (cats[0]?.id || 'otros');
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Build a single product button (reused in both search and category views) */
function buildProdBtn(p, ticketItems) {
  const enT = (ticketItems||[]).filter(i=>i.id===p.id && !i.enviado).reduce((s,i)=>s+i.cantidad,0);
  return `<button class="prod-btn" onclick="addItem(${p.id})">
    ${enT>0 ? `<span class="prod-qty-badge">${enT}</span>` : ''}
    ${p.imagen
      ? `<img src="${p.imagen}" style="width:54px;height:54px;object-fit:cover;border-radius:8px">`
      : `<span class="prod-emoji">${p.icono||'🍽️'}</span>`}
    <span class="prod-name">${escHtml(p.nombre)}</span>
    <span class="prod-price">€${round2(parseFloat(p.precio)).toFixed(2)}</span>
  </button>`;
}

/* Build the full category panel HTML */
function buildCatPanel(ticketItems) {
  const tipo = session.filtroProducto;
  const search = (session.prodSearch||'').trim().toLowerCase();

  // ── SEARCH MODE ──
  if (search.length > 0) {
    const matches = (db.productos||[]).filter(p =>
      p.tipo === tipo &&
      p.nombre.toLowerCase().includes(search)
    );
    if (matches.length === 0) {
      return `<div style="padding:32px 16px;text-align:center;color:var(--muted);font-size:0.85rem">
        <i class="fas fa-magnifying-glass" style="display:block;font-size:1.5rem;margin-bottom:8px;opacity:0.3"></i>
        Sin resultados para "<strong>${escHtml(session.prodSearch)}</strong>"
      </div>`;
    }
    return `<div class="search-results-label">
        <i class="fas fa-magnifying-glass"></i> ${matches.length} resultado${matches.length!==1?'s':''}
      </div>
      <div class="search-flat-grid">
        ${matches.map(p => buildProdBtn(p, ticketItems)).join('')}
      </div>`;
  }

  // ── CATEGORY MODE ──
  const defs = getCats(tipo);
  const openSet = session.openCats || new Set();

  // group products by cat
  const groups = {};
  defs.forEach(d => groups[d.id] = []);
  (db.productos||[]).filter(p => p.tipo === tipo).forEach(p => {
    const cid = getCatId(p);
    if (!groups[cid]) groups[cid] = [];
    groups[cid].push(p);
  });

  return defs.map(cat => {
    const prods = groups[cat.id] || [];
    if (prods.length === 0) return '';
    const isOpen = openSet.has(cat.id);
    const inTicket = prods.reduce((s,p) =>
      s + (ticketItems||[]).filter(i=>i.id===p.id && !i.enviado).reduce((ss,i)=>ss+i.cantidad,0), 0);
    return `<div class="cat-group${isOpen?' open':''}" id="cg-${cat.id}">
      <div class="cat-header" onclick="toggleCat('${cat.id}')">
        <div class="cat-emoji">${cat.icono}</div>
        <div class="cat-info">
          <div class="cat-name">${cat.label}</div>
          <div class="cat-sub">${prods.length} producto${prods.length!==1?'s':''}</div>
        </div>
        <div class="cat-right">
          ${inTicket > 0 ? `<span class="cat-in-ticket">${inTicket} en pedido</span>` : ''}
          <i class="fas fa-chevron-right cat-chevron"></i>
        </div>
      </div>
      <div class="cat-products">
        <div class="cat-prod-grid">
          ${prods.map(p => buildProdBtn(p, ticketItems)).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* Toggle category open/closed WITHOUT re-rendering the whole page */
function toggleCat(catId) {
  if (!session.openCats) session.openCats = new Set();
  const el = document.getElementById('cg-' + catId);
  if (!el) return;
  if (session.openCats.has(catId)) {
    session.openCats.delete(catId);
    el.classList.remove('open');
  } else {
    session.openCats.add(catId);
    el.classList.add('open');
  }
  // refresh badges (in-ticket counts) without full re-render
  refreshCatBadges();
}

/* Update only the "X en pedido" badges after adding an item */
function refreshCatBadges() {
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  const ticketItems = t ? (t.items||[]) : [];
  const tipo = session.filtroProducto;
  const defs = getCats(tipo);
  defs.forEach(cat => {
    const el = document.getElementById('cg-' + cat.id);
    if (!el) return;
    const prods = (db.productos||[]).filter(p => p.tipo === tipo && getCatId(p) === cat.id);
    const inTicket = prods.reduce((s,p) =>
      s + ticketItems.filter(i=>i.id===p.id && !i.enviado).reduce((ss,i)=>ss+i.cantidad,0), 0);
    const right = el.querySelector('.cat-right');
    if (!right) return;
    const existing = right.querySelector('.cat-in-ticket');
    if (inTicket > 0) {
      if (existing) existing.textContent = `${inTicket} en pedido`;
      else {
        const span = document.createElement('span');
        span.className = 'cat-in-ticket';
        span.textContent = `${inTicket} en pedido`;
        right.insertBefore(span, right.querySelector('.cat-chevron'));
      }
    } else {
      if (existing) existing.remove();
    }
  });
}

/* Search: debounced, updates panel in place without full re-render */
let _searchTimer = null;
function doProdSearch(val) {
  session.prodSearch = val;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    const panel = document.getElementById('cat-panel-body');
    if (!panel) return;
    const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
    panel.innerHTML = buildCatPanel(t ? (t.items||[]) : []);
  }, 120);
}

function clearSearch() {
  session.prodSearch = '';
  const inp = document.getElementById('prod-search-input');
  if (inp) inp.value = '';
  const panel = document.getElementById('cat-panel-body');
  if (panel) {
    const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
    panel.innerHTML = buildCatPanel(t ? (t.items||[]) : []);
  }
  // Remove the X button
  render();
}

function addItem(id) {
  const p = (db.productos||[]).find(x=>x.id===id);
  if (!p) return;
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  if (!t) return;
  // If product has variants, show selection modal first
  if ((p.variantes||[]).length > 0) {
    _showVarianteModal(p, t);
    return;
  }
  _doAddItem(p, t, null);
}

function _doAddItem(p, t, variante) {
  let pr = variante ? p.precio + (variante.precioExtra||0) : p.precio;
  // Aplica suplemento dinámico según el salón configurado
  const _salonBarra = (db.mesas?.salones||initialDB.mesas.salones).find(s => session.mesa.startsWith(s.prefijo));
  if (_salonBarra?.precio_extra > 0 && p.tipo==='barra') pr += _salonBarra.precio_extra;
  if (!t.items) t.items = [];
  // Items with variants are never merged (each is individual)
  if (!variante) {
    const ex = t.items.find(i=>i.id===p.id && !i.enviado && !i.variante);
    if (ex) { ex.cantidad++; sync(); _refreshTicketInPlace(t); return; }
  }
  const item = {...p, precio:pr, cantidad:1, enviado:false, entregado:false, uid:genUID(), nota:""};
  if (variante) {
    item.variante = variante.nombre;
    item.nombre_variante = variante.nombre; // alias for display
  }
  t.items.push(item);
  sync();
  _refreshTicketInPlace(t);
}

function _showVarianteModal(p, t) {
  document.getElementById('variante-select-modal')?.remove();
  const modal = document.createElement('div');
  modal.className = 'variante-modal-overlay';
  modal.id = 'variante-select-modal';
  const opts = (p.variantes||[]).map((v, i) => {
    const priceLabel = v.precioExtra > 0
      ? `<span class="variante-opt-price">+€${v.precioExtra.toFixed(2)}</span>`
      : `<span class="variante-opt-price free">€${round2(p.precio).toFixed(2)}</span>`;
    return `<button class="variante-opt-btn" onclick="_selectVariante(${i})">
      <span>${escHtml(v.nombre)}</span>
      ${priceLabel}
    </button>`;
  }).join('');
  modal.innerHTML = `
    <div class="variante-modal-box">
      <div class="variante-modal-title">
        <span>${p.icono||'🍽️'}</span>
        ${escHtml(p.nombre)}
      </div>
      <div class="variante-modal-sub">Elige una opción:</div>
      ${opts}
      <button class="btn btn-ghost" style="width:100%;margin-top:4px" onclick="document.getElementById('variante-select-modal')?.remove()">
        <i class="fas fa-xmark"></i> Cancelar
      </button>
    </div>`;
  // Store context for selection callback
  modal._prodId = p.id;
  modal._ticketMesa = t.mesa;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

function _selectVariante(varianteIdx) {
  const modal = document.getElementById('variante-select-modal');
  if (!modal) return;
  const p = (db.productos||[]).find(x=>x.id===modal._prodId);
  const t = (db.tickets||[]).find(x=>x.mesa===modal._ticketMesa);
  modal.remove();
  if (!p || !t) return;
  const variante = (p.variantes||[])[varianteIdx];
  if (!variante) return;
  _doAddItem(p, t, variante);
}

/* Refresh ticket list + total + product badges WITHOUT closing categories */
function _refreshTicketInPlace(t) {
  const items = t.items || [];
  const tot = calcTotal(items);

  // Update total
  const ta = document.querySelector('.total-amount');
  if (ta) ta.textContent = `€${tot.toFixed(2)}`;

  // Update item count
  const ic = document.querySelector('.ticket-panel-header span:last-child');
  if (ic && ic.style && ic.className === '') ic.textContent = `${items.length} art.`;

  // Separar items por estado
  const noEnviados  = items.filter(i => !i.enviado);
  const listos      = items.filter(i => i.enviado && !i.entregado);
  const entregados  = items.filter(i => i.enviado && i.entregado);

  function buildItemRowInPlace(i) {
    const estaListo     = i.enviado && !i.entregado;
    const estaEntregado = i.enviado && i.entregado;
    const rowClass = estaListo ? 'item-row listo-entregar' : estaEntregado ? 'item-row ya-entregado' : 'item-row';
    const menuTag = i.esMenuLinked
      ? `<span style="font-size:0.58rem;background:rgba(0,229,160,0.1);color:var(--success);padding:2px 6px;border-radius:100px;border:1px solid rgba(0,229,160,0.2);font-weight:700">${escHtml(i.pasoNombre||i.menuNombre||'Menú')}</span>`
      : '';
    const varianteTag = i.variante
      ? `<span class="variante-badge"><i class="fas fa-circle-dot" style="font-size:0.5rem"></i> ${escHtml(i.variante)}</span>`
      : '';
    return `
      <div class="${rowClass}">
        <div class="item-icon-wrap">${i.icono||'🍽️'}</div>
        <div class="item-info">
          <div class="item-name">${escHtml(i.nombre)}</div>
          <div class="item-meta">
            ${menuTag}
            ${varianteTag}
            ${!i.enviado ? '' :
              estaEntregado
                ? `<span class="item-entregado-badge"><i class="fas fa-circle-check"></i> Entregado ${i.horaEntrega||''}</span>`
                : `<span class="item-enviado">✓ Listo</span>`}
            ${!i.enviado ? `<button class="nota-tag" onclick="setNota('${i.uid}')">${escHtml(i.nota)||'+ Nota'}</button>` : ''}
            ${i.nota && i.enviado ? `<span style="font-size:0.6rem;color:var(--muted);font-style:italic">${escHtml(i.nota)}</span>` : ''}
          </div>
        </div>
        ${!i.enviado ? `
          <div class="qty-ctrl">
            <button class="qty-btn minus" onclick="qtyChange('${i.uid}',-1)">−</button>
            <span class="qty-num">${i.cantidad}</span>
            <button class="qty-btn plus" onclick="qtyChange('${i.uid}',1)">+</button>
          </div>` : `<span class="item-qty">${i.cantidad}×</span>`}
        <span class="item-price">${fmtLine(i)}</span>
        ${!i.enviado ? `<button class="item-del" onclick="delItem('${i.uid}')"><i class="fas fa-xmark"></i></button>` : ''}
        ${estaListo ? `<button class="btn-entregar" onclick="marcarEntregado('${i.uid}')"><i class="fas fa-hand-holding"></i> Entregar</button>` : ''}
      </div>`;
  }

  // Rebuild ticket items
  const ti = document.querySelector('.ticket-items');
  if (ti) {
    if (items.length === 0) {
      ti.innerHTML = `<div class="ticket-empty">
        <div class="ticket-empty-icon">🍽️</div>
        <p>Sin artículos</p>
        <small style="color:var(--muted);font-size:0.75rem">Añade productos desde la carta</small>
      </div>`;
    } else {
      let html = '';
      html += noEnviados.map(buildItemRowInPlace).join('');
      html += listos.map(buildItemRowInPlace).join('');
      if (entregados.length > 0) {
        html += `<div class="entregados-separator"><i class="fas fa-circle-check" style="color:var(--success);font-size:0.65rem"></i> Ya entregados (${entregados.length})</div>`;
        html += entregados.map(buildItemRowInPlace).join('');
      }
      ti.innerHTML = html;
    }
  }

  // Actualizar / crear banner de entrega
  const panel = document.querySelector('.ticket-panel');
  if (panel) {
    let banner = panel.querySelector('.entrega-banner');
    if (listos.length > 0) {
      const bannerHTML = `
        <div class="entrega-banner">
          <i class="fas fa-bell"></i>
          <span class="entrega-banner-count">${listos.length}</span>
          <span>${listos.length === 1 ? 'artículo listo' : 'artículos listos'} para llevar a la mesa</span>
          <button class="btn-entregar-todos" onclick="marcarTodosEntregados()">
            <i class="fas fa-hand-holding-box"></i> Entregar todo
          </button>
        </div>`;
      if (banner) {
        banner.outerHTML = bannerHTML;
      } else {
        // Insertar antes de ticket-items
        const ticketItemsEl = panel.querySelector('.ticket-items');
        if (ticketItemsEl) ticketItemsEl.insertAdjacentHTML('beforebegin', bannerHTML);
      }
    } else {
      if (banner) banner.remove();
    }
  }

  // Refresh product badges in category panel
  const catPanel = document.getElementById('cat-panel-body');
  if (catPanel) {
    const search = (session.prodSearch||'').trim().toLowerCase();
    if (search.length > 0) {
      catPanel.innerHTML = buildCatPanel(items);
    } else {
      catPanel.querySelectorAll('.prod-btn').forEach(btn => {
        const onclick = btn.getAttribute('onclick')||'';
        const m = onclick.match(/addItem\((\d+)\)/);
        if (!m) return;
        const pid = parseInt(m[1]);
        const enT = items.filter(i=>i.id===pid && !i.enviado).reduce((s,i)=>s+i.cantidad,0);
        let badge = btn.querySelector('.prod-qty-badge');
        if (enT > 0) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'prod-qty-badge';
            btn.insertBefore(badge, btn.firstChild);
          }
          badge.textContent = enT;
        } else {
          if (badge) badge.remove();
        }
      });
      refreshCatBadges();
    }
  }
}

function qtyChange(uid, delta) {
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  if (!t) return;
  const it = t.items.find(i=>i.uid==uid);
  if (!it || it.enviado) return;
  it.cantidad += delta;
  if (it.cantidad <= 0) t.items = t.items.filter(i=>i.uid!=uid);
  sync();
  _refreshTicketInPlace(t);
}

function delItem(uid) {
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  if (!t) return;
  t.items = t.items.filter(i=>i.uid!=uid);
  sync();
  _refreshTicketInPlace(t);
  toast('Artículo eliminado', 'danger', 'fa-trash-can');
}

function setNota(uid) {
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  if (!t) return;
  const it = t.items.find(i=>i.uid==uid);
  if (!it) return;
  const n = prompt('Nota para este artículo:', it.nota||'');
  if (n !== null) { it.nota=n; sync(); _refreshTicketInPlace(t); }
}

function enviarPedido() {
  const t = (db.tickets||[]).find(x=>x.mesa===session.mesa);
  if (!t) return;
  const pending = t.items.filter(i=>!i.enviado);
  if (pending.length === 0) { toast('No hay artículos por enviar', 'info'); return; }

  const metadatos = {
    usuarioEnvio: session.user,
    horaEnvio: new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
  };

  // Usar transacción atómica en Firebase para evitar race conditions.
  // Si dos camareros envían a la vez, Firebase garantiza que ninguna orden se pierde.
  syncEnviarPedido(session.mesa, pending, metadatos, (error, committed) => {
    if (!error && committed) {
      toast(`${pending.length} artículo${pending.length>1?'s':''} enviados a cocina/barra`, 'success');
      descontarStockItems(pending);
      renderMesas();
    } else if (!committed) {
      toast('⚠️ No se pudo enviar: la mesa ya no existe en el sistema', 'danger', 'fa-triangle-exclamation');
    } else {
      toast('⚠️ Error de conexión al enviar. Reintentando...', 'danger', 'fa-wifi');
      pending.forEach(i=>i.enviado=true);
      Object.assign(t, metadatos);
      descontarStockItems(pending);
      sync();
      setTimeout(renderMesas, 400);
    }
  });
}

function cobrar() {
  // ✅ FIX: cobrar() ya no usa confirm() nativo ni guarda venta sin metodoPago.
  // Delega siempre al modal de pago, que obliga a elegir método antes de cerrar.
  const t = (db.tickets||[]).find(x => x.mesa === session.mesa);
  const tot = calcTotal(t?.items||[]);

  if (!t || tot === 0 || (t.items && t.items.length === 0)) {
    toast('❌ No se puede cobrar una mesa vacía. Debe haber al menos un artículo.', 'danger', 'fa-ban');
    return;
  }

  // 🛡️ ANTI-DOBLE-COBRO: si el ticket ya fue cobrado, bloquearlo
  if (t.cobrado === true) {
    toast('⚠️ Esta mesa ya fue cobrada. Esperando entrega de platos pendientes.', 'warning', 'fa-triangle-exclamation');
    return;
  }

  // Abre el modal de método de pago (tarjeta / efectivo / por partes)
  showModalPago(session.mesa, tot);
}

/* ════════════════════════════════════
   STOCK ALERTAS — helpers monitor
════════════════════════════════════ */
function _buildStockAlertStrip(zona) {
  const alertas = (db.stockAlertas||[]).filter(a => a.monitor === zona);
  if (!alertas.length) return '';
  const chips = alertas.map(a => `
    <span class="stock-alert-chip">
      <span>${a.icono||'⚠️'}</span>
      <span>${escHtml(a.nombre)}</span>
      ${a.nota ? `<span style="font-weight:400;opacity:0.7;font-size:0.63rem">${escHtml(a.nota)}</span>` : ''}
      <span style="font-size:0.58rem;opacity:0.6;font-weight:600">${a.hora||''}</span>
    </span>`).join('');
  return `<div class="stock-alert-strip">
    <div class="stock-alert-header">
      <i class="fas fa-paper-plane"></i>
      Avisado al admin · ${alertas.length} producto${alertas.length!==1?'s':''}
    </div>
    <div class="stock-alert-chips">${chips}</div>
  </div>`;
}

function dismissStockAlerta(id) {
  db.stockAlertas = (db.stockAlertas||[]).filter(a => a.id !== id);
  sync();
  render();
}

function marcarListo(mesa, uid) {
  const t = (db.tickets||[]).find(x=>x.mesa===mesa);
  if (!t) return;
  const it = t.items.find(i=>i.uid==uid);
  if (!it) return;
  it.entregado = true;

  // ── Registrar despacho ──────────────────────────────
  if (!db.despachos) db.despachos = [];
  const ahora = new Date();
  db.despachos.push({
    uid:        it.uid,
    nombre:     it.nombre,
    icono:      it.icono || '🍽️',
    imagen:     it.imagen || null,
    zona:       it.tipo === 'barra' ? 'barra' : 'cocina',
    precio:     parseFloat(it.precio) || 0,
    cantidad:   parseInt(it.cantidad) || 1,
    mesa:       mesa,
    hora:       ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
    fecha:      ahora.toISOString().split('T')[0],
    ts:         ahora.getTime()
  });
  // ───────────────────────────────────────────────────

  // Para tickets VD: comprobar si quedan platos pendientes en ESTE ticket concreto
  if (mesa && mesa.startsWith('VD')) {
    const aun = (t.items||[]).filter(i => i.tipo==='cocina' && i.enviado && !i.entregado);
    if (aun.length === 0 && t.cobrado === true) {
      // Todos despachados Y cobrado — eliminar SOLO este ticket VD (no los demás)
      db.tickets = (db.tickets||[]).filter(x => x.mesa !== mesa);
      sync();
      toast('✓ Todos los platos entregados · Ticket VD cerrado', 'success', 'fa-check-double');
    } else if (aun.length === 0 && !t.cobrado) {
      // Platos listos pero pendiente de cobro
      sync();
      toast('✓ Plato entregado · Pendiente de cobro en barra', 'info', 'fa-clock');
    } else {
      sync();
      toast(`Plato entregado · ${aun.length} pendiente${aun.length>1?'s':''}`, 'success');
    }
  } else {
    // Mesa de salón: comprobar si hay platos aún pendientes
    const aun = (t.items||[]).filter(i => i.enviado && !i.entregado);
    if (aun.length === 0 && t.cobrado === true) {
      // Todo entregado Y ya cobrado — cerrar el ticket
      const reservaHoy = getReservaHoy(mesa);
      if (reservaHoy && reservaHoy.estado === 'tomada') {
        db.reservas = (db.reservas||[]).filter(r => r.id !== reservaHoy.id);
      }
      db.tickets = (db.tickets||[]).filter(x => x.mesa !== mesa);
      sync();
      toast(`✓ Todos los platos entregados · Mesa ${mesa} cerrada`, 'success', 'fa-check-double');
    } else if (aun.length === 0 && !t.cobrado) {
      sync();
      toast('✓ Todo entregado · Pendiente de cobro', 'info', 'fa-clock');
    } else {
      sync();
      toast('Marcado como listo', 'success');
    }
  }
}

function saveTextColors() {
  if (!db.config) db.config = {};
  
  db.config.colorTextMain = document.getElementById('colorTextMain')?.value || '#e8edf8';
  db.config.colorTextSecondary = document.getElementById('colorTextSecondary')?.value || '#a8b3cc';
  db.config.colorMuted = document.getElementById('colorMuted')?.value || '#4a5572';
  db.config.colorAccent = document.getElementById('colorAccent')?.value || '#ff6b35';
  db.config.colorSuccess = document.getElementById('colorSuccess')?.value || '#00e5a0';
  db.config.colorDanger = document.getElementById('colorDanger')?.value || '#ff3b5c';
  
  sync();
  applyTextColors();
  toast('✓ Colores actualizados correctamente', 'success', 'fa-palette');
}

function applyTextColors() {
  const colors = {
    '--text': db.config?.colorTextMain || '#e8edf8',
    '--text2': db.config?.colorTextSecondary || '#a8b3cc',
    '--muted': db.config?.colorMuted || '#4a5572',
    '--accent': db.config?.colorAccent || '#ff6b35',
    '--success': db.config?.colorSuccess || '#00e5a0',
    '--danger': db.config?.colorDanger || '#ff3b5c'
  };
  
  let styleId = 'custom-colors-style';
  let style = document.getElementById(styleId);
  
  if (!style) {
    style = document.createElement('style');
    style.id = styleId;
    document.head.appendChild(style);
  }
  
  let css = ':root { ';
  Object.entries(colors).forEach(([key, value]) => {
    css += `${key}: ${value}; `;
  });
  css += '}';
  
  // Solo reescribir el <style> si el contenido cambió: asignar
  // textContent siempre (aunque sea igual) fuerza un recálculo
  // global de estilos en TODA la página -> parpadeo en cada sync.
  if (style.textContent !== css) style.textContent = css;
}

function resetTextColors() {
  if (!confirm('¿Restaurar todos los colores a los predeterminados?')) return;
  
  if (!db.config) db.config = {};
  db.config.colorTextMain = '#e8edf8';
  db.config.colorTextSecondary = '#a8b3cc';
  db.config.colorMuted = '#4a5572';
  db.config.colorAccent = '#ff6b35';
  db.config.colorSuccess = '#00e5a0';
  db.config.colorDanger = '#ff3b5c';
  
  sync();
  applyTextColors();
  tab('c');
  toast('↻ Colores restaurados a predeterminados', 'info', 'fa-redo');
}

/* Sincroniza session.ventaDirectaItems → db.tickets[ventaDirectaMesaId]
   Cada venta directa tiene su propio ID único → nunca se mezclan ventas distintas. */
function syncVDTicket() {
  if (!db.tickets) db.tickets = [];
  // Asegurar que esta sesión tiene su propio ID de ticket
  if (!session.ventaDirectaMesaId) {
    session.ventaDirectaMesaId = 'VD_' + genUID();
  }
  const mesaId = session.ventaDirectaMesaId;
  let vd = db.tickets.find(t => t.mesa === mesaId);
  if (!vd) {
    vd = {
      mesa:    mesaId,
      user:    session.user,
      items:   [],
      abierto: new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'})
    };
    db.tickets.push(vd);
  }
  vd.items = (session.ventaDirectaItems || []).map(i => ({...i}));
  if (session.user) vd.user = session.user;
  sync();
}

function iniciarVentaDirecta() {
  session.ventaDirecta   = true;
  session.prodSearch     = '';
  session.filtroProducto = 'barra';
  session.openCats       = null;

  // Si ya hay una sesión VD activa con su propio ID, reanudarla
  if (session.ventaDirectaMesaId) {
    const activa = (db.tickets||[]).find(t => t.mesa === session.ventaDirectaMesaId && !t.cobrado);
    if (activa && (activa.items||[]).length > 0) {
      session.ventaDirectaItems = activa.items.map(i => ({...i}));
      toast('Venta anterior reanudada', 'info', 'fa-rotate-right');
      renderMonitor('barra');
      return;
    }
  }

  // Buscar cualquier ticket VD sin cobrar en Firebase (reanudación tras recarga de página)
  const sinCobrar = (db.tickets||[]).find(t => t.mesa && t.mesa.startsWith('VD') && !t.cobrado && (t.items||[]).length > 0);
  if (sinCobrar) {
    session.ventaDirectaMesaId = sinCobrar.mesa;
    session.ventaDirectaItems  = sinCobrar.items.map(i => ({...i}));
    toast('Venta anterior reanudada', 'info', 'fa-rotate-right');
    renderMonitor('barra');
    return;
  }

  // Nueva venta: asignar ID propio y limpiar sesión local
  session.ventaDirectaMesaId = 'VD_' + genUID();
  session.ventaDirectaItems  = [];

  // Limpiar de Firebase solo los tickets VD finalizados (cobrados sin cocina pendiente)
  // Los que tienen cocina pendiente se conservan para que el monitor los siga mostrando.
  db.tickets = (db.tickets||[]).filter(t => {
    if (!t.mesa || !t.mesa.startsWith('VD')) return true;
    const cocinaPendiente = (t.items||[]).some(i => i.tipo === 'cocina' && i.enviado && !i.entregado);
    return cocinaPendiente; // conservar solo si tiene cocina pendiente
  });
  sync();

  renderMonitor('barra');
}

function renderVentaDirecta() {
  // Sincronizar desde el ticket VD de esta sesión para reflejar cambios del monitor
  // (p.ej. cocina marca un plato como listo)
  const mesaIdActiva = session.ventaDirectaMesaId;
  if (mesaIdActiva) {
    const vdDB = (db.tickets||[]).find(t => t.mesa === mesaIdActiva && !t.cobrado);
    if (vdDB && (session.ventaDirectaItems||[]).length > 0) {
      const locales    = session.ventaDirectaItems || [];
      const noEnviados = locales.filter(i => !i.enviado);
      const enviados   = (vdDB.items||[]).filter(i => i.enviado);
      const localUIDs  = new Set(locales.map(i => i.uid));
      const remotoUIDs = new Set(enviados.map(i => i.uid));
      if (enviados.some(i => localUIDs.has(i.uid))) {
        session.ventaDirectaItems = [...enviados, ...noEnviados.filter(i => !remotoUIDs.has(i.uid))];
      }
    }
  }

  const items = session.ventaDirectaItems || [];
  const tot = calcTotal(items);
  const hasCocinaEnviable = items.some(i => i.tipo === 'cocina' && !i.enviado);
  const cocinaEnviados   = items.filter(i => i.tipo === 'cocina' && i.enviado).length;
  const cocinaTotal      = items.filter(i => i.tipo === 'cocina').length;
  
  const itemsHTML = items.length === 0
    ? `<div class="ticket-empty">
        <div class="ticket-empty-icon">🛒</div>
        <p>Sin artículos</p>
        <small style="color:var(--muted);font-size:0.75rem">Añade bebidas o platos desde la carta</small>
       </div>`
    : items.map((i, idx)=>`
      <div class="item-row">
        <div class="item-icon-wrap">${i.icono||'🍽️'}</div>
        <div class="item-info">
          <div class="item-name">${escHtml(i.nombre)}</div>
          ${i.variante ? `<div style="margin-bottom:2px"><span class="variante-badge"><i class="fas fa-circle-dot" style="font-size:0.5rem"></i> ${escHtml(i.variante)}</span></div>` : ''}
          <div class="item-meta">
            ${i.enviado
              ? (i.entregado
                  ? '<span style="font-size:0.62rem;padding:2px 7px;border-radius:100px;font-weight:700;background:rgba(0,229,160,0.1);color:var(--success)">✓ Despachado</span>'
                  : '<span class="item-enviado">✓ En cocina</span>')
              : (i.tipo === 'cocina'
                  ? '<span class="tag tag-cocina" style="font-size:0.58rem;padding:2px 6px">🍳 Cocina</span>'
                  : '<span class="tag tag-barra" style="font-size:0.58rem;padding:2px 6px">🍷 Barra</span>')}
            <button class="nota-tag" onclick="setNotaVD(${idx})">${escHtml(i.nota)||'+ Nota'}</button>
          </div>
        </div>
        ${!i.enviado ? `
          <div class="qty-ctrl">
            <button class="qty-btn minus" onclick="qtyChangeVD(${idx},-1)">−</button>
            <span class="qty-num">${i.cantidad}</span>
            <button class="qty-btn plus" onclick="qtyChangeVD(${idx},1)">+</button>
          </div>` : `<span class="item-qty">${i.cantidad}×</span>`}
        <span class="item-price">${fmtLine(i)}</span>
        ${!i.enviado ? `<button class="item-del" onclick="delItemVD(${idx})"><i class="fas fa-xmark"></i></button>` : ''}
      </div>`).join('');

  document.getElementById('app-body').innerHTML = `
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      <button class="btn-back" onclick="cerrarVentaDirecta()"><i class="fas fa-arrow-left"></i> Volver</button>
      <h2 style="font-family:var(--fh);font-size:1.4rem;color:#fff;margin:0">
        <i class="fas fa-cart-shopping" style="margin-right:8px;color:var(--barra)"></i>Venta Directa
      </h2>
      ${cocinaTotal > 0 ? `<span style="font-size:0.7rem;padding:5px 10px;border-radius:100px;background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.25);color:var(--accent);font-weight:700;font-family:var(--fh)">
        <i class="fas fa-fire-burner" style="margin-right:4px;font-size:0.6rem"></i>Cocina: ${cocinaEnviados}/${cocinaTotal} enviados
      </span>` : ''}
      <span style="margin-left:auto;font-size:0.8rem;color:var(--muted);font-weight:600"><i class="fas fa-user-clock" style="margin-right:4px"></i>${session.user}</span>
    </div>
    <div class="ticket-layout">
      <div class="ticket-panel">
        <div class="ticket-panel-header">
          <span class="ticket-mesa-badge" style="background:rgba(74,158,255,0.1);border:1px solid rgba(74,158,255,0.3);color:var(--barra)">
            <i class="fas fa-wine-glass"></i> Barra Directa
          </span>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span style="font-size:0.72rem;color:var(--muted);font-family:var(--fh)" id="vd-item-count">${items.length} art.</span>
          </div>
        </div>
        <div class="ticket-items">${itemsHTML}</div>
        <div class="ticket-total-bar">
          <span class="total-label">Total</span>
          <span class="total-amount">€${tot.toFixed(2)}</span>
        </div>
        <div class="ticket-actions" style="grid-template-columns:1fr 1fr 1fr">
          <button class="btn btn-ghost" onclick="cerrarVentaDirecta()">
            <i class="fas fa-arrow-left"></i> Volver
          </button>
          <button class="btn btn-dark" id="btn-enviar-vd"
            onclick="enviarPedidoVD()"
            ${!hasCocinaEnviable ? 'disabled style="opacity:0.38;cursor:not-allowed"' : 'style="border-color:rgba(255,107,53,0.45);color:var(--accent)"'}>
            <i class="fas fa-paper-plane"></i> Enviar cocina
          </button>
          <button class="btn btn-success" id="btn-cobrar-vd"
            onclick="cobrarVentaDirecta()"
            ${items.length === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>
            <i class="fas fa-cash-register"></i> Cobrar
          </button>
        </div>
      </div>

      <div class="prod-panel">
        <div class="filtro-tabs">
          <button class="btn-filtro ${session.filtroProducto==='barra'?'active':''}" onclick="setFiltroVD('barra')">
            <i class="fas fa-wine-glass"></i> Barra
          </button>
          <button class="btn-filtro ${session.filtroProducto==='cocina'?'active':''}" onclick="setFiltroVD('cocina')">
            <i class="fas fa-fire-burner"></i> Cocina
          </button>
        </div>
        <div class="prod-search">
          <i class="fas fa-magnifying-glass prod-search-icon"></i>
          <input type="text" id="prod-search-input-vd" placeholder="Buscar producto…"
            value="${escHtml(session.prodSearch)}"
            oninput="doProdSearchVD(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
          ${session.prodSearch ? `<button onclick="clearSearchVD()" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0 4px;font-size:0.8rem;flex-shrink:0"><i class="fas fa-xmark"></i></button>` : ''}
        </div>
        <div class="cat-panel-body" id="cat-panel-body-vd">
          ${buildCatPanelVD()}
        </div>
      </div>
    </div>`;
}

function buildCatPanelVD() {
  const tipo   = session.filtroProducto || 'barra';
  const search = (session.prodSearch||'').trim().toLowerCase();
  const items  = session.ventaDirectaItems || [];

  if (search.length > 0) {
    const matches = (db.productos||[]).filter(p =>
      p.tipo === tipo &&
      p.nombre.toLowerCase().includes(search)
    );
    if (matches.length === 0) {
      return `<div style="padding:32px 16px;text-align:center;color:var(--muted);font-size:0.85rem">
        <i class="fas fa-magnifying-glass" style="display:block;font-size:1.5rem;margin-bottom:8px;opacity:0.3"></i>
        Sin resultados para "<strong>${escHtml(session.prodSearch)}</strong>"
      </div>`;
    }
    return `<div class="search-results-label">
        <i class="fas fa-magnifying-glass"></i> ${matches.length} resultado${matches.length!==1?'s':''}
      </div>
      <div class="search-flat-grid">
        ${matches.map(p => buildProdBtnVD(p, items)).join('')}
      </div>`;
  }

  const defs   = getCats(tipo);
  const openSet = session.openCats || new Set();

  const groups = {};
  defs.forEach(d => groups[d.id] = []);
  (db.productos||[]).filter(p => p.tipo === tipo).forEach(p => {
    const cid = getCatId(p);
    if (!groups[cid]) groups[cid] = [];
    groups[cid].push(p);
  });

  return defs.map(cat => {
    const prods = groups[cat.id] || [];
    if (prods.length === 0) return '';
    const isOpen = openSet.has(cat.id);
    const inCart = prods.reduce((s,p) =>
      s + (items.filter(i=>i.id===p.id).reduce((ss,i)=>ss+i.cantidad,0)), 0);
    return `<div class="cat-group${isOpen?' open':''}" id="cg-${cat.id}">
      <div class="cat-header" onclick="toggleCatVD('${cat.id}')">
        <div class="cat-emoji">${cat.icono}</div>
        <div class="cat-info">
          <div class="cat-name">${cat.label}</div>
          <div class="cat-sub">${prods.length} producto${prods.length!==1?'s':''}</div>
        </div>
        <div class="cat-right">
          ${inCart > 0 ? `<span class="cat-in-ticket">${inCart} en venta</span>` : ''}
          <i class="fas fa-chevron-right cat-chevron"></i>
        </div>
      </div>
      <div class="cat-products">
        <div class="cat-prod-grid">
          ${prods.map(p => buildProdBtnVD(p, items)).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

function buildProdBtnVD(p, items) {
  const enVenta = items.filter(i=>i.id===p.id).reduce((s,i)=>s+i.cantidad,0);
  return `<button class="prod-btn" onclick="addItemVD(${p.id})">
    ${enVenta>0 ? `<span class="prod-qty-badge">${enVenta}</span>` : ''}
    ${p.imagen
      ? `<img src="${p.imagen}" style="width:54px;height:54px;object-fit:cover;border-radius:8px">`
      : `<span class="prod-emoji">${p.icono||'🍷'}</span>`}
    <span class="prod-name">${escHtml(p.nombre)}</span>
    <span class="prod-price">€${round2(parseFloat(p.precio)).toFixed(2)}</span>
  </button>`;
}

function toggleCatVD(catId) {
  if (!session.openCats) session.openCats = new Set();
  const el = document.getElementById('cg-' + catId);
  if (!el) return;
  if (session.openCats.has(catId)) {
    session.openCats.delete(catId);
    el.classList.remove('open');
  } else {
    session.openCats.add(catId);
    el.classList.add('open');
  }
}

function setFiltroVD(tipo) {
  session.filtroProducto = tipo;
  session.prodSearch = '';
  session.openCats = null;
  renderVentaDirecta();
}

function addItemVD(id) {
  const p = (db.productos||[]).find(x=>x.id===id);
  if (!p) return;
  
  if (!session.ventaDirectaItems) session.ventaDirectaItems = [];
  // Solo apilar ítems no enviados (los enviados a cocina están bloqueados)
  const ex = session.ventaDirectaItems.find(i=>i.id===id && !i.enviado);
  if (ex) { ex.cantidad++; }
  else { 
    session.ventaDirectaItems.push({
      ...p, 
      cantidad: 1, 
      enviado:  false,
      entregado: false,
      uid:  genUID(), 
      nota: ""
    }); 
  }

  syncVDTicket();
  _refreshVentaDirectaInPlace();
}

function _refreshVentaDirectaInPlace() {
  const items = session.ventaDirectaItems || [];
  const tot   = calcTotal(items);
  const hasCocinaEnviable = items.some(i => i.tipo === 'cocina' && !i.enviado);
  const cocinaEnviados    = items.filter(i => i.tipo === 'cocina' && i.enviado).length;
  const cocinaTotal       = items.filter(i => i.tipo === 'cocina').length;

  // Update total
  const ta = document.querySelector('.total-amount');
  if (ta) ta.textContent = `€${tot.toFixed(2)}`;

  // Update item count chip
  const ic = document.getElementById('vd-item-count');
  if (ic) ic.textContent = `${items.length} art.`;

  // Update enviar button state
  const btnEnviar = document.getElementById('btn-enviar-vd');
  if (btnEnviar) {
    if (hasCocinaEnviable) {
      btnEnviar.disabled = false;
      btnEnviar.style.cssText = 'border-color:rgba(255,107,53,0.45);color:var(--accent)';
    } else {
      btnEnviar.disabled = true;
      btnEnviar.style.cssText = 'opacity:0.38;cursor:not-allowed';
    }
  }

  // Update cobrar button state
  const btnCobrar = document.getElementById('btn-cobrar-vd');
  if (btnCobrar) {
    btnCobrar.disabled = items.length === 0;
    btnCobrar.style.cssText = items.length === 0 ? 'opacity:0.5;cursor:not-allowed' : '';
  }

  // Rebuild items list
  const ti = document.querySelector('.ticket-items');
  if (ti) {
    if (items.length === 0) {
      ti.innerHTML = `<div class="ticket-empty">
        <div class="ticket-empty-icon">🛒</div>
        <p>Sin artículos</p>
        <small style="color:var(--muted);font-size:0.75rem">Añade bebidas o platos desde la carta</small>
      </div>`;
    } else {
      ti.innerHTML = items.map((i, idx)=>`
        <div class="item-row">
          <div class="item-icon-wrap">${i.icono||'🍽️'}</div>
          <div class="item-info">
            <div class="item-name">${escHtml(i.nombre)}</div>
            ${i.variante ? `<div style="margin-bottom:2px"><span class="variante-badge"><i class="fas fa-circle-dot" style="font-size:0.5rem"></i> ${escHtml(i.variante)}</span></div>` : ''}
            <div class="item-meta">
              ${i.enviado
                ? '<span class="item-enviado">✓ Enviado</span>'
                : (i.tipo === 'cocina'
                    ? '<span class="tag tag-cocina" style="font-size:0.58rem;padding:2px 6px">🍳 Cocina</span>'
                    : '<span class="tag tag-barra" style="font-size:0.58rem;padding:2px 6px">🍷 Barra</span>')}
              <button class="nota-tag" onclick="setNotaVD(${idx})">${escHtml(i.nota)||'+ Nota'}</button>
            </div>
          </div>
          ${!i.enviado ? `
            <div class="qty-ctrl">
              <button class="qty-btn minus" onclick="qtyChangeVD(${idx},-1)">−</button>
              <span class="qty-num">${i.cantidad}</span>
              <button class="qty-btn plus" onclick="qtyChangeVD(${idx},1)">+</button>
            </div>` : `<span class="item-qty">${i.cantidad}×</span>`}
          <span class="item-price">${fmtLine(i)}</span>
          ${!i.enviado ? `<button class="item-del" onclick="delItemVD(${idx})"><i class="fas fa-xmark"></i></button>` : ''}
        </div>`).join('');
    }
  }

  // Refresh product badges in panel
  const panel = document.getElementById('cat-panel-body-vd');
  if (panel) {
    const search = (session.prodSearch||'').trim().toLowerCase();
    if (search.length > 0) {
      panel.innerHTML = buildCatPanelVD();
    } else {
      // Update qty badges on visible product buttons
      panel.querySelectorAll('.prod-btn').forEach(btn => {
        const onclk = btn.getAttribute('onclick')||'';
        const m = onclk.match(/addItemVD\((\d+)\)/);
        if (!m) return;
        const pid = parseInt(m[1]);
        const enVenta = items.filter(i=>i.id===pid).reduce((s,i)=>s+i.cantidad,0);
        let badge = btn.querySelector('.prod-qty-badge');
        if (enVenta > 0) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'prod-qty-badge';
            btn.insertBefore(badge, btn.firstChild);
          }
          badge.textContent = enVenta;
        } else {
          if (badge) badge.remove();
        }
      });

      // Update category in-cart badges (current tipo only)
      const tipo = session.filtroProducto || 'barra';
      getCats(tipo).forEach(cat => {
        const el = document.getElementById('cg-' + cat.id);
        if (!el) return;
        const prods = (db.productos||[]).filter(p => p.tipo === tipo && getCatId(p) === cat.id);
        const inVenta = prods.reduce((s,p) =>
          s + items.filter(i=>i.id===p.id).reduce((ss,i)=>ss+i.cantidad,0), 0);
        const right = el.querySelector('.cat-right');
        if (!right) return;
        const existing = right.querySelector('.cat-in-ticket');
        if (inVenta > 0) {
          if (existing) existing.textContent = `${inVenta} en venta`;
          else {
            const span = document.createElement('span');
            span.className = 'cat-in-ticket';
            span.textContent = `${inVenta} en venta`;
            right.insertBefore(span, right.querySelector('.cat-chevron'));
          }
        } else {
          if (existing) existing.remove();
        }
      });
    }
  }
}

function qtyChangeVD(idx, delta) {
  if (idx < 0 || idx >= session.ventaDirectaItems.length) return;
  const it = session.ventaDirectaItems[idx];
  it.cantidad += delta;
  if (it.cantidad <= 0) session.ventaDirectaItems.splice(idx, 1);
  syncVDTicket();
  _refreshVentaDirectaInPlace();
}

function delItemVD(idx) {
  if (idx < 0 || idx >= session.ventaDirectaItems.length) return;
  session.ventaDirectaItems.splice(idx, 1);
  syncVDTicket();
  _refreshVentaDirectaInPlace();
  toast('Artículo eliminado', 'danger', 'fa-trash-can');
}

function setNotaVD(idx) {
  if (idx < 0 || idx >= session.ventaDirectaItems.length) return;
  const it = session.ventaDirectaItems[idx];
  const n = prompt('Nota para este artículo:', it.nota||'');
  if (n !== null) { it.nota = n; syncVDTicket(); _refreshVentaDirectaInPlace(); }
}

function doProdSearchVD(val) {
  session.prodSearch = val;
  const panel = document.getElementById('cat-panel-body-vd');
  if (panel) {
    panel.innerHTML = buildCatPanelVD();
  }
}

function clearSearchVD() {
  session.prodSearch = '';
  const inp = document.getElementById('prod-search-input-vd');
  if (inp) inp.value = '';
  const panel = document.getElementById('cat-panel-body-vd');
  if (panel) {
    panel.innerHTML = buildCatPanelVD();
  }
}

function enviarPedidoVD() {
  const items   = session.ventaDirectaItems || [];
  const pending = items.filter(i => i.tipo === 'cocina' && !i.enviado);
  
  if (pending.length === 0) {
    toast('No hay platos de cocina pendientes de enviar', 'info', 'fa-info-circle');
    return;
  }

  // Marcar como enviados en la sesión
  pending.forEach(i => { i.enviado = true; });

  // Sincronizar al ticket VD en db.tickets (crea el ticket si no existe)
  syncVDTicket();

  // Actualizar metadatos de envío
  const vdTicket = session.ventaDirectaMesaId ? (db.tickets||[]).find(t => t.mesa === session.ventaDirectaMesaId) : null;
  if (vdTicket) {
    vdTicket.usuarioEnvio = session.user;
    vdTicket.horaEnvio    = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    sync();
  }

  descontarStockItems(pending);

  toast(`${pending.length} plato${pending.length>1?'s':''} enviados a cocina`, 'success', 'fa-paper-plane');
  renderVentaDirecta();
}

function cobrarVentaDirecta() {
  const items = session.ventaDirectaItems || [];
  if (items.length === 0) {
    toast('No hay artículos para cobrar', 'danger', 'fa-ban');
    return;
  }

  const tot           = calcTotal(items);
  const pendingCocina = items.filter(i => i.tipo === 'cocina' && !i.enviado);

  // Si hay platos de cocina sin enviar, preguntar primero con confirm nativo
  // (modal de pago se abre después del envío)
  if (pendingCocina.length > 0) {
    const confirmar = confirm(
      `⚠️ Hay ${pendingCocina.length} plato${pendingCocina.length>1?'s':''} de cocina sin enviar.\n\n` +
      `¿Enviarlos a cocina antes de cobrar?\n\nTotal: €${tot.toFixed(2)}`
    );
    if (!confirmar) return;
    enviarPedidoVD();
  }

  // Abrir modal de método de pago
  showModalPagoVD(tot);
}

/* ── Ejecutar el cobro con el método elegido ── */
function _ejecutarCobroVD(metodo, montoParcial, montoParcial2, metodo2) {
  closeModalPagoVD();
  document.getElementById('pago-partes-vd-modal')?.remove();
  document.getElementById('pago-dividido-vd-modal')?.remove();

  const items = session.ventaDirectaItems || [];
  const tot   = calcTotal(items);

  // Descontar stock de items de barra (consumo inmediato en venta directa).
  // Los items de cocina ya se descontaron al enviarse a cocina con enviarPedidoVD().
  const itemsBarraVD = items.filter(i => i.tipo === 'barra');
  if (itemsBarraVD.length) descontarStockItems(itemsBarraVD);

  if (!db.historicoVentas) db.historicoVentas = [];
  const ahora = new Date();

  const venta = {
    mesa:         'VD',
    user:         session.user,
    items:        items.map(i => ({
      id:       i.id,
      nombre:   i.nombre,
      precio:   i.precio,
      cantidad: i.cantidad,
      nota:     i.nota || '',
      icono:    i.icono,
      tipo:     i.tipo
    })),
    abierto:      ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}),
    fecha:        ahora.toLocaleString('es-ES'),
    totalFinal:   tot,
    metodoPago:   metodo,
    ...(metodo2 ? { metodoPago2: metodo2, montoPago1: montoParcial, montoPago2: montoParcial2 } : {}),
    usuarioEnvio: session.user,
    horaEnvio:    ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
    usuarioCobro: session.user,
    horaCobro:    ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
    tipo:         'ventaDirecta'
  };

  db.historicoVentas.push(venta);

  // Usar el ID de ticket de ESTA sesión, nunca un find genérico por 'VD'
  const mesaIdVD = session.ventaDirectaMesaId;
  const vdTicket = mesaIdVD ? (db.tickets||[]).find(t => t.mesa === mesaIdVD) : null;
  const cocinaPendiente = vdTicket
    ? (vdTicket.items||[]).filter(i => i.tipo === 'cocina' && i.enviado && !i.entregado)
    : [];

  const iconoPago = metodo === 'tarjeta' ? '💳' : metodo === 'efectivo' ? '💵' : '💰';
  const metodoLabel = metodo2
    ? `Mixto (€${Number(montoParcial).toFixed(2)} ${metodo} + €${Number(montoParcial2).toFixed(2)} ${metodo2})`
    : (metodo === 'tarjeta' ? 'Tarjeta' : 'Efectivo');

  if (cocinaPendiente.length > 0) {
    // Marcar cobrado y dejar SOLO los items de cocina pendientes en el ticket
    // El ticket permanece en Firebase hasta que cocina despacha todo
    vdTicket.cobrado     = true;
    vdTicket.cobradoHora = ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
    vdTicket.items       = cocinaPendiente.map(i => ({...i}));
    sync();
    toast(`${iconoPago} Cobrado €${tot.toFixed(2)} · ${metodoLabel} · ${cocinaPendiente.length} plato${cocinaPendiente.length>1?'s':''} en cocina`, 'success', 'fa-check-circle');
  } else {
    // Sin cocina pendiente: eliminar solo este ticket
    if (mesaIdVD) db.tickets = (db.tickets||[]).filter(t => t.mesa !== mesaIdVD);
    sync();
    toast(`${iconoPago} Venta cobrada — €${tot.toFixed(2)} · ${metodoLabel}`, 'success', 'fa-check-circle');
  }

  // Limpiar sesión — el ticket anterior (cobrado/con cocina) sigue en Firebase independiente
  session.ventaDirecta       = false;
  session.ventaDirectaItems  = [];
  session.ventaDirectaMesaId = null;  // nueva venta tendrá su propio ID
  session.prodSearch         = '';
  session.openCats           = null;
  renderMonitor('barra');
}

              style="width:100%;background:var(--surface2);border:1px solid var(--border-hi);border-radius:var(--r);color:#fff;padding:9px 12px;font-family:var(--fh);font-size:0.85rem;outline:none;margin:0"

function closeModalPagoPartesVD() {
  document.getElementById('pago-partes-vd-modal')?.remove();
}

function calcRestoPagoVD(total) {
  const ef = parseFloat(document.getElementById('vd-monto-efectivo')?.value || 0);
  const ti = document.getElementById('vd-monto-tarjeta');
  if (ti) ti.value = Math.max(0, total - ef).toFixed(2);
  actualizarAvisoMixtoVD(total);
}

function calcRestoTarjetaVD(total) {
  const ti = parseFloat(document.getElementById('vd-monto-tarjeta')?.value || 0);
  const ef = document.getElementById('vd-monto-efectivo');
  if (ef) ef.value = Math.max(0, total - ti).toFixed(2);
  actualizarAvisoMixtoVD(total);
}

function actualizarAvisoMixtoVD(total) {
  const ef   = parseFloat(document.getElementById('vd-monto-efectivo')?.value || 0);
  const ti   = parseFloat(document.getElementById('vd-monto-tarjeta')?.value || 0);
  const suma = ef + ti;
  const aviso = document.getElementById('aviso-mixto-vd');
  if (!aviso) return;
  if (round2(Math.abs(round2(suma) - round2(total))) < 0.01) {
    aviso.innerHTML = `<span style="color:var(--success)"><i class="fas fa-check" style="margin-right:4px"></i>Total cubierto</span>`;
  } else if (suma > total) {
    aviso.innerHTML = `<span style="color:var(--danger)"><i class="fas fa-triangle-exclamation" style="margin-right:4px"></i>Suma superior al total (€${suma.toFixed(2)})</span>`;
  } else {
    aviso.innerHTML = `<span style="color:var(--warning)"><i class="fas fa-triangle-exclamation" style="margin-right:4px"></i>Faltan €${(total - suma).toFixed(2)} por asignar</span>`;
  }
}

function confirmarPagoMixtoVD(total) {
  const ef = parseFloat(document.getElementById('vd-monto-efectivo')?.value || 0);
  const ti = parseFloat(document.getElementById('vd-monto-tarjeta')?.value || 0);
  if (round2(Math.abs(round2(ef + ti) - round2(total))) > 0.01) {
    actualizarAvisoMixtoVD(total);
    toast('⚠️ Los montos no cuadran con el total', 'danger', 'fa-triangle-exclamation');
    return;
  }
  closeModalPagoPartesVD();
  _ejecutarCobroVD('efectivo', ef, ti, 'tarjeta');
}

function cerrarVentaDirecta() {
  const items = session.ventaDirectaItems || [];

  if (items.length > 0) {
    // Guardar estado actual en db para poder retomarlo
    syncVDTicket();
    const enviados = items.filter(i => i.enviado).length;
    const noEnviados = items.filter(i => !i.enviado).length;
    let msg = `Venta guardada`;
    if (enviados > 0 && noEnviados > 0) msg += ` · ${enviados} en cocina, ${noEnviados} sin enviar`;
    else if (enviados > 0) msg += ` · ${enviados} plato${enviados>1?'s':''} en cocina`;
    toast(msg + ' — pulsa Retomar para continuar', 'info', 'fa-floppy-disk');
  } else {
    // Sesión vacía — verificar en Firebase si existe ticket VD con ítems sin cobrar
    const mesaIdCierre = session.ventaDirectaMesaId;
    const vd = mesaIdCierre ? (db.tickets||[]).find(t => t.mesa === mesaIdCierre) : null;
    if (vd && !vd.cobrado && (vd.items||[]).length > 0) {
      toast('Venta guardada — pulsa Retomar para continuar', 'info', 'fa-floppy-disk');
    } else if (vd && !(vd.items||[]).some(i => i.tipo==='cocina' && i.enviado && !i.entregado)) {
      db.tickets = (db.tickets||[]).filter(t => t.mesa !== mesaIdCierre);
      sync();
    }
  }

  session.ventaDirecta       = false;
  session.ventaDirectaItems  = [];
  session.ventaDirectaMesaId = null;
  session.prodSearch         = '';
  session.openCats           = null;
  renderMonitor('barra');
}

function cambiarCantElim(delta) {
  const input = document.getElementById('cantElim');
  if (!input) return;
  const max = parseInt(input.max);
  const nuevo = Math.max(1, Math.min(max, parseInt(input.value) + delta));
  input.value = nuevo;
  // Actualizar el texto de unidades que quedan
  const cantActual = parseInt(input.max);
  const small = document.querySelector('#eliminar-modal small');
  if (small && cantActual > 1) {
    small.textContent = `(Quedarán ${cantActual - nuevo} unidad(es) en el ticket)`;
  }
}

function validarCantElim(max) {
  const input = document.getElementById('cantElim');
  if (!input) return;
  let val = parseInt(input.value);
  if (isNaN(val) || val < 1) val = 1;
  if (val > max) val = max;
  input.value = val;
}

function closeEliminarModal() {
  document.getElementById('eliminar-modal')?.remove();
}

function confirmarEliminacion(mesa, uid) {
  const cantAEliminar = parseInt(document.getElementById('cantElim')?.value) || 1;
  const motivo = document.getElementById('motivoElim')?.value?.trim() || '';
  const t = (db.tickets||[]).find(x=>x.mesa===mesa);
  if (!t) return;

  const it = t.items.find(i=>i.uid==uid);
  if (!it) return;

  const cantOriginal = it.cantidad;
  const cantRestante = cantOriginal - cantAEliminar;

  // 📊 Guardar en historial de eliminaciones
  if (!db.productosEliminados) db.productosEliminados = [];
  
  const eliminacion = {
    id: genUID(),
    producto: it.nombre,
    icono: it.icono || '🍽️',
    cantidad: cantAEliminar,  // Solo lo que se eliminó
    precio: it.precio,
    mesa: mesa,
    zona: it.tipo === 'cocina' ? 'Cocina' : 'Barra',
    eliminadoPor: session.user,
    eliminadoHora: new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),
    eliminadoFecha: new Date().toISOString().split('T')[0],
    eliminadoTimestamp: new Date().toLocaleString('es-ES'),
    motivo: motivo,
    totalProducto: it.precio * cantAEliminar
  };
  
  db.productosEliminados.push(eliminacion);

  // Si quedan unidades, reducir la cantidad
  if (cantRestante > 0) {
    it.cantidad = cantRestante;
  } else {
    // Si se eliminan todas, remover del ticket
    t.items = t.items.filter(i=>i.uid!=uid);
  }

  sync();
  closeEliminarModal();
  
  if (cantRestante > 0) {
    toast(`⚠️ "${it.nombre}": ${cantAEliminar}× eliminado(s)${motivo ? ' · '+motivo : ''} (${cantRestante}× permanecen)`, 'info', 'fa-exclamation');
  } else {
    toast(`❌ "${it.nombre}": ${cantAEliminar}× eliminado(s)${motivo ? ' · '+motivo : ''}`, 'danger', 'fa-trash-can');
  }
  
  render(); // Re-renderizar para actualizar monitor
}

   ESTADÍSTICAS DE MESAS
════════════════════════════════════ */
function getEstadisticasMesas() {
  const ventas = db.historicoVentas || [];
  const stats = {};

  // Obtener todas las mesas posibles
  const mesas = db.mesas?.salones || initialDB.mesas.salones;
  const mesasSet = new Set();
  mesas.forEach(salon => {
    for (let i = 1; i <= salon.cantidad; i++) {
      mesasSet.add(salon.prefijo + i);
    }
  });

  // Calcular estadísticas por mesa
  mesasSet.forEach(mesaId => {
    stats[mesaId] = {
      mesa: mesaId,
      tickets: 0,
      totalVentas: 0,
      promedio: 0,
      ultimaVenta: '—',
      articulosVendidos: 0
    };
  });

  // Poblar datos desde historial
  ventas.forEach(v => {
    if (!stats[v.mesa]) stats[v.mesa] = { mesa: v.mesa, tickets: 0, totalVentas: 0, promedio: 0, ultimaVenta: '—', articulosVendidos: 0 };
    stats[v.mesa].tickets++;
    stats[v.mesa].totalVentas += v.totalFinal || 0;
    stats[v.mesa].ultimaVenta = v.fecha || '—';
    stats[v.mesa].articulosVendidos += (v.items || []).length;
  });

  // Calcular promedios
  Object.values(stats).forEach(s => {
    s.promedio = s.tickets > 0 ? s.totalVentas / s.tickets : 0;
  });

  // Retornar ordenadas por total de ventas
  return Object.values(stats)
    .filter(s => s.tickets > 0)
    .sort((a, b) => b.totalVentas - a.totalVentas);
}

function getSalonInfo(prefijo) {
  const salon = (db.mesas?.salones || []).find(s => s.prefijo === prefijo);
  return salon || null;
}
function getEstadisticasCamareros() {
  const ventas = db.historicoVentas || [];
  const stats = {};

  // Solo los que vendieron (enviaron pedido) generan ranking.
  // Quien cobra puede ser la barra y no debe quitarle merito al camarero.
  const camareros = new Set();
  ventas.forEach(v => {
    if (v.usuarioEnvio) camareros.add(v.usuarioEnvio);
  });

  camareros.forEach(camarero => {
    // La venta se atribuye a quien sirvio la mesa (usuarioEnvio)
    const ventasVendidas  = ventas.filter(v => v.usuarioEnvio === camarero);
    const totalVentas     = round2(ventasVendidas.reduce((s,v) => s + (v.totalFinal||0), 0));
    const tickets         = ventasVendidas.length;
    const ticketsCobrados = ventas.filter(v => v.usuarioCobro === camarero).length;
    const promedio        = tickets > 0 ? totalVentas / tickets : 0;
    const ultimaVenta     = ventasVendidas[ventasVendidas.length - 1]?.fecha || '—';

    stats[camarero] = {
      nombre: camarero,
      tickets,          // mesas vendidas (atribuidas al que sirvio)
      ticketsCobrados,  // solo informativo
      totalVentas,
      promedio,
      ultimaVenta,
      ventasCount: ventasVendidas.length
    };
  });

  // Ordenar por mesas vendidas descendente; total ventas como desempate
  return Object.values(stats).sort((a, b) => b.tickets - a.tickets || b.totalVentas - a.totalVentas);
}

function addStockAlerta(nombre, icono, nota, zona) {
  if (!nombre) return;
  if (!db.stockAlertas) db.stockAlertas = [];

  const dup = db.stockAlertas.find(a =>
    a.nombre.toLowerCase() === nombre.toLowerCase() && a.monitor === zona
  );
  if (dup) {
    toast('Ya hay una alerta activa para ese producto', 'info', 'fa-info-circle');
    return;
  }

  const ahora = new Date();
  db.stockAlertas.push({
    id:       'st_' + Date.now(),
    nombre,
    icono:    icono || '⚠️',
    monitor:  zona,
    nota:     nota || '',
    hora:     ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}),
    addedBy:  session.user || zona
  });
  sync();
}

function _stMonAutoIcono(nombre) {
  const prods = db.productos || [];
  const match = prods.find(p => p.nombre.toLowerCase() === nombre.trim().toLowerCase());
  if (match) {
    const inp = document.getElementById('st-mon-icono');
    if (inp && (!inp.value || inp.value === '⚠️')) inp.value = match.icono || '⚠️';
  }
}

function _submitStockAlertaModal(zona) {
  const nombre = document.getElementById('st-mon-nombre')?.value?.trim();
  const icono  = document.getElementById('st-mon-icono')?.value?.trim() || '⚠️';
  const nota   = document.getElementById('st-mon-nota')?.value?.trim()  || '';
  if (!nombre) {
    toast('Escribe el nombre del producto', 'danger', 'fa-exclamation');
    document.getElementById('st-mon-nombre')?.focus();
    return;
  }
  addStockAlerta(nombre, icono, nota, zona);
  document.getElementById('stock-alerta-modal')?.remove();
  toast(`⚠️ Aviso enviado al admin: ${nombre}`, 'success', 'fa-paper-plane');
  render();
}

function deleteStockAlerta(id) {
  db.stockAlertas = (db.stockAlertas||[]).filter(a => a.id !== id);
  sync();
  tab('st');
  toast('Alerta eliminada', 'info', 'fa-xmark');
}

function clearAllStockAlertas() {
  if (!confirm('¿Marcar todos los productos como comprados / repuestos?')) return;
  db.stockAlertas = [];
  sync();
  tab('st');
  toast('✓ Todos los productos marcados como repuestos', 'success', 'fa-check-double');
}

/* ════════════════════════════════════

════════════════════════════════════ */
function renderDespachos(container) {
  const despachos = db.despachos || [];
  const hoy = new Date().toISOString().split('T')[0];
  const hoy_d = despachos.filter(d => d.fecha === hoy);

  const dCocina = despachos.filter(d => d.zona === 'cocina');
  const dBarra  = despachos.filter(d => d.zona === 'barra');
  const dCoH    = hoy_d.filter(d => d.zona === 'cocina');
  const dBaH    = hoy_d.filter(d => d.zona === 'barra');

  const totalUnidCocina = dCocina.reduce((s, d) => s + d.cantidad, 0);
  const totalUnidBarra  = dBarra.reduce ((s, d) => s + d.cantidad, 0);
  const totalUnidCoH    = dCoH.reduce   ((s, d) => s + d.cantidad, 0);
  const totalUnidBaH    = dBaH.reduce   ((s, d) => s + d.cantidad, 0);

  // ── Ranking helper ──────────────────────────────────────
  function calcRanking(lista) {
    const map = {};
    lista.forEach(d => {
      const k = d.nombre;
      if (!map[k]) map[k] = { nombre: d.nombre, icono: d.icono, imagen: d.imagen||null, unidades: 0, ingresos: 0 };
      map[k].unidades += d.cantidad;
      map[k].ingresos += d.precio * d.cantidad;
    });
    return Object.values(map).sort((a, b) => b.unidades - a.unidades);
  }

  const rankCocina = calcRanking(dCocina);
  const rankBarra  = calcRanking(dBarra);
  const rankCoH    = calcRanking(dCoH);
  const rankBaH    = calcRanking(dBaH);

  // ── SVG bar chart helper ─────────────────────────────────
  function barChart(data, color, maxItems = 8) {
    const top = data.slice(0, maxItems);
    if (top.length === 0) return `<div style="padding:28px;text-align:center;color:var(--muted);font-size:0.82rem"><i class="fas fa-chart-bar" style="font-size:1.8rem;display:block;margin-bottom:8px;opacity:0.2"></i>Sin datos aún</div>`;
    const maxVal = Math.max(...top.map(d => d.unidades), 1);
    return `<div style="display:flex;flex-direction:column;gap:8px;padding:4px 0">
      ${top.map((d, i) => {
        const pct = Math.round((d.unidades / maxVal) * 100);
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `<span style="font-size:0.65rem;font-weight:800;color:var(--muted)">${i+1}</span>`;
        const iconEl = d.imagen
          ? `<img src="${d.imagen}" style="width:26px;height:26px;object-fit:cover;border-radius:5px;flex-shrink:0">`
          : `<span style="font-size:1.1rem;flex-shrink:0;line-height:1">${d.icono||'🍽️'}</span>`;
        return `<div style="display:flex;align-items:center;gap:8px">
          <div style="width:22px;text-align:center;flex-shrink:0">${medal}</div>
          ${iconEl}
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
              <span style="font-size:0.72rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%">${escHtml(d.nombre)}</span>
              <span style="font-size:0.68rem;font-weight:800;color:${color};font-family:var(--fh);flex-shrink:0">${d.unidades} uds · €${d.ingresos.toFixed(2)}</span>
            </div>
            <div style="height:6px;border-radius:3px;background:var(--surface3);overflow:hidden">
              <div style="height:100%;border-radius:3px;background:${color};width:${pct}%;transition:width 0.6s cubic-bezier(0.22,1,0.36,1)"></div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // ── Actividad por hora (últimas 12h) ─────────────────────
  function horaChart(lista, colorCo, colorBa) {
    const ahora = new Date();
    const horas = Array.from({length: 12}, (_, i) => {
      const h = (ahora.getHours() - 11 + i + 24) % 24;
      return { h, label: String(h).padStart(2,'0')+'h', co: 0, ba: 0 };
    });
    lista.forEach(d => {
      if (d.fecha !== hoy) return;
      const h = parseInt((d.hora||'00').split(':')[0]);
      const slot = horas.find(x => x.h === h);
      if (!slot) return;
      if (d.zona === 'cocina') slot.co += d.cantidad;
      else slot.ba += d.cantidad;
    });
    const maxVal = Math.max(...horas.map(x => x.co + x.ba), 1);
    return `<div style="display:flex;align-items:flex-end;gap:3px;height:64px;padding:0 2px">
      ${horas.map(slot => {
        const pctCo = Math.round((slot.co / maxVal) * 100);
        const pctBa = Math.round((slot.ba / maxVal) * 100);
        const total = slot.co + slot.ba;
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="${slot.label}: ${slot.co} cocina, ${slot.ba} barra">
          <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:52px;gap:1px">
            <div style="background:${colorBa};border-radius:2px 2px 0 0;height:${pctBa}%;min-height:${slot.ba>0?2:0}px;transition:height 0.4s ease"></div>
            <div style="background:${colorCo};border-radius:${slot.ba>0?'0':'2px 2px'} 0 0;height:${pctCo}%;min-height:${slot.co>0?2:0}px;transition:height 0.4s ease"></div>
          </div>
          <span style="font-size:0.48rem;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);height:10px">${slot.label}</span>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:12px;margin-top:8px;justify-content:flex-end">
      <span style="font-size:0.6rem;color:${colorCo};font-weight:700;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:${colorCo};display:inline-block"></span>Cocina</span>
      <span style="font-size:0.6rem;color:${colorBa};font-weight:700;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:${colorBa};display:inline-block"></span>Barra</span>
    </div>`;
  }

  // ── Filtro activo ───────────────────────────────────────
  const filtro = (window._dsFiltro || 'hoy');

  const rankC = filtro === 'hoy' ? rankCoH : rankCocina;
  const rankB = filtro === 'hoy' ? rankBaH  : rankBarra;
  const totalC = filtro === 'hoy' ? totalUnidCoH : totalUnidCocina;
  const totalB = filtro === 'hoy' ? totalUnidBaH : totalUnidBarra;
  const totalD = filtro === 'hoy' ? hoy_d.length : despachos.length;

  container.innerHTML = `
  <div style="animation:fadeUp 0.25s ease both">

    <!-- KPIs -->
    <div class="admin-stat-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(255,107,53,0.1);color:var(--cocina)"><i class="fas fa-fire-burner"></i></div>
        <div class="stat-label">Despachos Cocina${filtro==='hoy'?' Hoy':''}</div>
        <div class="stat-value" style="color:var(--cocina)">${totalC}</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(74,158,255,0.1);color:var(--barra)"><i class="fas fa-wine-glass"></i></div>
        <div class="stat-label">Despachos Barra${filtro==='hoy'?' Hoy':''}</div>
        <div class="stat-value" style="color:var(--barra)">${totalB}</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(0,229,160,0.1);color:var(--success)"><i class="fas fa-check-circle"></i></div>
        <div class="stat-label">Total Despachados${filtro==='hoy'?' Hoy':''}</div>
        <div class="stat-value success">${totalC + totalB}</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(167,139,250,0.1);color:var(--purple)"><i class="fas fa-list-check"></i></div>
        <div class="stat-label">Registros${filtro==='hoy'?' Hoy':''}</div>
        <div class="stat-value" style="color:var(--purple)">${totalD}</div>
      </div>
    </div>

    <!-- Filtro Hoy / Todo -->
    <div style="display:flex;gap:6px;margin-bottom:14px;align-items:center">
      <button onclick="window._dsFiltro='hoy';tab('ds')"
        style="padding:7px 16px;border-radius:100px;font-size:0.72rem;font-weight:700;font-family:var(--fh);cursor:pointer;border:1px solid ${filtro==='hoy'?'var(--accent)':'var(--border)'};background:${filtro==='hoy'?'rgba(255,107,53,0.12)':'var(--surface2)'};color:${filtro==='hoy'?'var(--accent)':'var(--muted)'}">
        Hoy
      </button>
      <button onclick="window._dsFiltro='todo';tab('ds')"
        style="padding:7px 16px;border-radius:100px;font-size:0.72rem;font-weight:700;font-family:var(--fh);cursor:pointer;border:1px solid ${filtro==='todo'?'var(--accent)':'var(--border)'};background:${filtro==='todo'?'rgba(255,107,53,0.12)':'var(--surface2)'};color:${filtro==='todo'?'var(--accent)':'var(--muted)'}">
        Jornada completa
      </button>
      <span style="margin-left:auto;font-size:0.68rem;color:var(--muted)">${despachos.length} registros en jornada</span>
    </div>

    <!-- Actividad por hora (solo Hoy) -->
    ${hoy_d.length > 0 ? `
    <div class="card" style="animation:fadeUp 0.28s ease both;margin-bottom:14px">
      <div class="card-title">
        <div class="ct-icon" style="background:rgba(167,139,250,0.1);color:var(--purple)"><i class="fas fa-chart-column"></i></div>
        Actividad por hora — Hoy
      </div>
      <div style="padding:4px 8px 8px">
        ${horaChart(despachos, 'var(--cocina)', 'var(--barra)')}
      </div>
    </div>` : ''}

    <!-- Rankings lado a lado -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">

      <!-- Ranking Cocina -->
      <div class="card" style="animation:fadeUp 0.3s ease both;border:1px solid rgba(255,107,53,0.25);background:linear-gradient(to bottom,rgba(255,107,53,0.04),transparent)">
        <div class="card-title" style="margin-bottom:14px">
          <div class="ct-icon" style="background:rgba(255,107,53,0.12);color:var(--cocina)"><i class="fas fa-fire-burner"></i></div>
          Ranking Cocina
          <span style="margin-left:auto;font-size:0.65rem;background:rgba(255,107,53,0.1);color:var(--cocina);padding:3px 9px;border-radius:100px;border:1px solid rgba(255,107,53,0.25);font-weight:700">${totalC} uds</span>
        </div>
        ${barChart(rankC, 'var(--cocina)')}
        ${rankC.length === 0 ? '' : `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:0.62rem;color:var(--muted);text-align:center">${rankC.length} producto${rankC.length!==1?'s':''} distintos</div>`}
      </div>

      <!-- Ranking Barra -->
      <div class="card" style="animation:fadeUp 0.32s ease both;border:1px solid rgba(74,158,255,0.25);background:linear-gradient(to bottom,rgba(74,158,255,0.04),transparent)">
        <div class="card-title" style="margin-bottom:14px">
          <div class="ct-icon" style="background:rgba(74,158,255,0.12);color:var(--barra)"><i class="fas fa-wine-glass"></i></div>
          Ranking Barra
          <span style="margin-left:auto;font-size:0.65rem;background:rgba(74,158,255,0.1);color:var(--barra);padding:3px 9px;border-radius:100px;border:1px solid rgba(74,158,255,0.25);font-weight:700">${totalB} uds</span>
        </div>
        ${barChart(rankB, 'var(--barra)')}
        ${rankB.length === 0 ? '' : `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:0.62rem;color:var(--muted);text-align:center">${rankB.length} producto${rankB.length!==1?'s':''} distintos</div>`}
      </div>
    </div>

    <!-- Top combinado (si hay datos) -->
    ${(rankC.length > 0 || rankB.length > 0) ? (() => {
      const combined = calcRanking(filtro === 'hoy' ? hoy_d : despachos);
      return `
      <div class="card" style="animation:fadeUp 0.34s ease both;margin-bottom:14px">
        <div class="card-title">
          <div class="ct-icon" style="background:rgba(0,229,160,0.1);color:var(--success)"><i class="fas fa-trophy"></i></div>
          Top Global — Más despachados
          <span style="margin-left:auto;font-size:0.65rem;color:var(--muted);font-weight:400">${filtro==='hoy'?'Hoy':'Jornada'}</span>
        </div>
        ${barChart(combined, 'var(--success)', 10)}
      </div>`;
    })() : ''}

    <!-- Historial reciente -->
    <div class="card" style="animation:fadeUp 0.38s ease both">
      <div class="card-title">
        <div class="ct-icon"><i class="fas fa-clock-rotate-left"></i></div>
        Historial Reciente
        <span style="margin-left:auto;font-size:0.68rem;color:var(--muted);font-weight:400">${despachos.length} total</span>
        ${despachos.length > 0 ? `<button class="btn" onclick="pdfDespachos()" style="margin-left:10px;padding:5px 12px;font-size:0.68rem;background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.3);color:var(--success);gap:5px"><i class="fas fa-file-arrow-down"></i> PDF</button>` : ''}
      </div>
      ${despachos.length === 0
        ? `<div style="padding:32px;text-align:center;color:var(--muted);font-size:0.85rem">
             <i class="fas fa-check-circle" style="font-size:1.8rem;display:block;margin-bottom:10px;opacity:0.2"></i>
             Sin despachos registrados aún. Marca platos como listos desde el monitor de cocina o barra.
           </div>`
        : `<div style="overflow-x:auto">
             <table class="admin-table">
               <thead><tr><th>Producto</th><th>Zona</th><th>Uds</th><th>Mesa</th><th>Hora</th><th style="text-align:right">Precio</th></tr></thead>
               <tbody>
                 ${despachos.slice().reverse().slice(0,40).map(d => {
                   const zonaColor = d.zona === 'cocina' ? 'var(--cocina)' : 'var(--barra)';
                   const zonaBg    = d.zona === 'cocina' ? 'rgba(255,107,53,0.1)' : 'rgba(74,158,255,0.1)';
                   const zonaBorder= d.zona === 'cocina' ? 'rgba(255,107,53,0.25)' : 'rgba(74,158,255,0.25)';
                   const zonaIcon  = d.zona === 'cocina' ? 'fa-fire-burner' : 'fa-wine-glass';
                   const iconEl    = d.imagen
                     ? `<img src="${d.imagen}" style="width:24px;height:24px;object-fit:cover;border-radius:4px;flex-shrink:0">`
                     : `<span style="font-size:1rem">${d.icono||'🍽️'}</span>`;
                   return `<tr>
                     <td style="max-width:200px">
                       <div style="display:flex;align-items:center;gap:7px">
                         ${iconEl}
                         <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.8rem">${escHtml(d.nombre)}</span>
                       </div>
                     </td>
                     <td>
                       <span style="font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:100px;background:${zonaBg};color:${zonaColor};border:1px solid ${zonaBorder};display:inline-flex;align-items:center;gap:4px;white-space:nowrap">
                         <i class="fas ${zonaIcon}" style="font-size:0.55rem"></i>
                         ${d.zona === 'cocina' ? 'Cocina' : 'Barra'}
                       </span>
                     </td>
                     <td style="text-align:center;font-weight:700;color:var(--text2)">${d.cantidad}×</td>
                     <td style="color:var(--accent);font-weight:700;font-size:0.82rem">${d.mesa}</td>
                     <td style="color:var(--muted);font-size:0.75rem;white-space:nowrap">${d.hora}</td>
                     <td style="text-align:right;font-family:var(--fh);font-weight:700;color:var(--success)">€${(d.precio * d.cantidad).toFixed(2)}</td>
                   </tr>`;
                 }).join('')}
               </tbody>
             </table>
           </div>`}
    </div>
  </div>`;

  // IIFE for combined ranking used above (needs to be accessible)
  function calcRanking(lista) {
    const map = {};
    lista.forEach(d => {
      const k = d.nombre;
      if (!map[k]) map[k] = { nombre: d.nombre, icono: d.icono, imagen: d.imagen||null, unidades: 0, ingresos: 0 };
      map[k].unidades += d.cantidad;
      map[k].ingresos += d.precio * d.cantidad;
    });
    return Object.values(map).sort((a, b) => b.unidades - a.unidades);
  }
}

function cambiarCantMesas(salonId, delta) {
  const input = document.getElementById('cant-' + salonId);
  if (!input) return;
  const nueva = Math.max(1, parseInt(input.value) + delta);
  input.value = nueva;
}

function guardarCantMesas(salonId) {
  const input = document.getElementById('cant-' + salonId);
  const precioInput = document.getElementById('precio-' + salonId);
  if (!input) return;
  
  const salon = (db.mesas?.salones || []).find(s => s.id === salonId);
  if (!salon) return;
  
  const nuevaCant = parseInt(input.value);
  if (isNaN(nuevaCant) || nuevaCant < 1) {
    toast('Cantidad debe ser mayor a 0', 'danger');
    return;
  }

  const anterior = salon.cantidad;
  salon.cantidad = nuevaCant;
  if (precioInput) salon.precio_extra = parseFloat(precioInput.value) || 0;
  
  sync();
  toast(`${salon.nombre}: ${anterior} → ${nuevaCant} mesas`, 'success', 'fa-chair');
  tab('m');
}

function actualizarPrecioExtra(salonId, valor) {
  const salon = (db.mesas?.salones || []).find(s => s.id === salonId);
  if (salon) {
    salon.precio_extra = parseFloat(valor) || 0;
    sync();
  }
}
