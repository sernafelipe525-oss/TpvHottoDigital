function refreshCatSelect(selectedCatId) {
  const tipo = document.getElementById('pf-tipo')?.value || 'cocina';
  const sel = document.getElementById('pf-cat');
  if (!sel) return;
  const cats = (Array.isArray(db.categorias) ? db.categorias : Object.values(db.categorias)).filter(c => c.tipo === tipo);
  sel.innerHTML = `<option value="">Sin categoría</option>` + cats.map(c => `<option value="${c.id}">${escHtml(c.icono || '')} ${escHtml(c.label || '')}</option>`).join('');
  if (selectedCatId !== undefined && selectedCatId !== null) sel.value = String(selectedCatId);
}

function confirmProducto(prodId) {
  const nombre = (document.getElementById('pf-nombre')?.value || '').trim();
  if (!nombre) { toast('Indica un nombre', 'danger'); return; }
  const tipo = document.getElementById('pf-tipo')?.value || 'cocina';
  const catVal = document.getElementById('pf-cat')?.value || '';
  const icono = (document.getElementById('pf-icono')?.value || '').trim();
  const imagen = (document.getElementById('pf-imagen')?.value || '').trim();
  const costo = parseFloat(document.getElementById('pf-costo')?.value);
  const precio = parseFloat(document.getElementById('pf-precio')?.value);

  if (!Array.isArray(db.productos)) db.productos = Object.values(db.productos || {});

  let p = (prodId !== undefined && prodId !== null) ? getProducto(prodId) : null;
  const isNew = !p;
  if (isNew) {
    const ids = db.productos.map(x => Number(x.id) || 0);
    const nextId = (ids.length ? Math.max(...ids) : 0) + 1;
    p = { id: nextId };
    db.productos.push(p);
  }

  let catId = null;
  if (catVal !== '') {
    const cats = Array.isArray(db.categorias) ? db.categorias : Object.values(db.categorias);
    const foundCat = cats.find(c => String(c.id) === catVal);
    catId = foundCat ? foundCat.id : catVal;
  }

  p.nombre = nombre;
  p.tipo = tipo;
  p.catId = catId;
  if (icono) p.icono = icono; else delete p.icono;
  if (imagen) p.imagen = imagen; else delete p.imagen;
  if (!isNaN(costo) && costo >= 0) p.costoUnit = round2(costo); else delete p.costoUnit;
  if (!isNaN(precio) && precio >= 0) p.precio = round2(precio); else delete p.precio;

  syncProductos();
  closeModal();
  toast(isNew ? `"${nombre}" creado` : `"${nombre}" actualizado`, 'success');
  renderProductos();
}

function showDeleteProductoConfirm(prodId) {
  const p = getProducto(prodId);
  if (!p) return;
  closeModal();
  createModal(`
    <div class="inv-modal-title"><i class="fas fa-trash" style="color:var(--danger)"></i> Eliminar producto</div>
    <div class="inv-modal-sub">¿Seguro que quieres eliminar "${escHtml(p.nombre)}"? Se borrará también su stock. Esta acción no se puede deshacer.</div>
    <div class="inv-modal-row">
      <button class="btn-modal ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-modal" style="background:var(--danger);color:#fff" onclick="confirmDeleteProducto(${prodId})"><i class="fas fa-trash"></i> Eliminar</button>
    </div>
  `);
}

function confirmDeleteProducto(prodId) {
  const arr = Array.isArray(db.productos) ? db.productos : Object.values(db.productos);
  db.productos = arr.filter(p => p.id !== prodId && p.id !== Number(prodId));
  if (db.inventario) delete db.inventario[prodId];

  // Limpiar recetas: la propia (si el producto era un plato) y las que lo usaban como ingrediente
  if (db.escandallos) {
    delete db.escandallos[prodId];
    Object.keys(db.escandallos).forEach(pid => {
      db.escandallos[pid] = (db.escandallos[pid] || []).filter(ing => String(ing.ingredienteId) !== String(prodId));
      if (db.escandallos[pid].length === 0) delete db.escandallos[pid];
    });
  }
  if (db.escandallosVariante) {
    delete db.escandallosVariante[prodId];
    Object.keys(db.escandallosVariante).forEach(pid => {
      const porVariante = db.escandallosVariante[pid] || {};
      Object.keys(porVariante).forEach(varNombre => {
        porVariante[varNombre] = (porVariante[varNombre] || []).filter(ing => String(ing.ingredienteId) !== String(prodId));
        if (porVariante[varNombre].length === 0) delete porVariante[varNombre];
      });
      if (Object.keys(porVariante).length === 0) delete db.escandallosVariante[pid];
    });
  }

  syncProductos();
  syncInventario();
  syncEscandallos();
  syncEscandallosVariante();
  closeModal();
  toast('Producto eliminado', 'success');
  renderProductos();
}

function deleteCategoria(catId) {
  if (!Array.isArray(db.categorias)) db.categorias = Object.values(db.categorias || {});
  db.categorias = db.categorias.filter(c => String(c.id) !== String(catId));
  const prods = Array.isArray(db.productos) ? db.productos : Object.values(db.productos);
  let affected = 0;
  prods.forEach(p => { if (String(p.catId) === String(catId)) { p.catId = null; affected++; } });
  syncCategorias();

  renderCatChipList();
  toast('Categoría eliminada' + (affected ? ` (${affected} producto${affected !== 1 ? 's' : ''} sin categoría)` : ''), 'success');

function confirmPedido(provId) {
  const pr = db.proveedores[provId];
  if (!pr) return;
  const rows = document.querySelectorAll('#pedido-form-rows .pedido-item-row');
  const items = [];
  let total = 0;
  rows.forEach(row => {
    const cantInput = row.querySelector('[data-role="cant"]');
    const costoInput = row.querySelector('[data-role="costo"]');
    if (!cantInput) return;
    const pid = Number(cantInput.dataset.pid);
    const cantidad = parseFloat(cantInput.value);
    const costoUnit = parseFloat(costoInput.value) || 0;
    if (!isNaN(cantidad) && cantidad > 0) {
      const p = getProducto(pid);
      const entry = getInvEntry(pid);
      items.push({ prodId: pid, nombre: p?.nombre || '', unidad: entry.unidad, cantidad: round2(cantidad), costoUnit: round2(costoUnit) });
      total += cantidad * costoUnit;
    }
  });
  if (items.length === 0) { toast('Indica al menos una cantidad', 'danger'); return; }
  const notas = (document.getElementById('pedido-notas')?.value || '').trim();

  if (!db.pedidosProveedor) db.pedidosProveedor = {};
  const id = 'pd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  db.pedidosProveedor[id] = {
    id, proveedorId: provId, proveedorNombre: pr.nombre,
    fecha: new Date().toISOString(), estado: 'pendiente',
    items, total: round2(total), notas
  };
  syncPedidos();
  toast('Pedido registrado', 'success');
  showProveedorDetalle(provId);
}

function marcarPedidoRecibido(pedidoId) {
  const pd = db.pedidosProveedor[pedidoId];
  if (!pd || pd.estado === 'recibido') return;
  (pd.items || []).forEach(it => {
    const entry = getInvEntry(it.prodId);
    entry.cantidad = round2(entry.cantidad + it.cantidad);
    entry.actualizado = new Date().toISOString();
    registrarMovimiento(it.prodId, it.nombre, 'entrada', it.cantidad, `Pedido a ${pd.proveedorNombre}`);
    const p = getProducto(it.prodId);
    if (p && it.costoUnit) p.costoUnit = it.costoUnit;
    autoClearStockAlertas(it.prodId);
  });
  pd.estado = 'recibido';
  pd.recibidoEn = new Date().toISOString();
  syncInventario();
  syncProductos();
  syncPedidos();
  toast('Pedido marcado como recibido: stock actualizado', 'success', 'fa-check-circle');
  showProveedorDetalle(pd.proveedorId);
}

  const d = computeDashboardData();
  container.innerHTML = buildDashboardHtml(d);
}

function computeDashboardData() {
  const prods = Array.isArray(db.productos) ? db.productos : Object.values(db.productos || {});
  const movs  = Object.values(db.inventarioMovimientos || {});
  const now = Date.now();
  const since30 = now - 30 * 24 * 60 * 60 * 1000;

  let valorTotal = 0, cOk = 0, cBajo = 0, cAgotado = 0;
  let sumaMargenPct = 0, nMargen = 0;
  const porCategoria = {};
  const porProducto = [];

  prods.forEach(p => {
    const entry = getInvEntry(p.id);
    const est = getEstado(entry);
    if (est === 'ok') cOk++; else if (est === 'bajo') cBajo++; else cAgotado++;

    const valor = (p.costoUnit || 0) * (entry.cantidad || 0);
    valorTotal += valor;
    if (valor > 0) porProducto.push({ nombre: p.nombre, icono: p.icono, valor: round2(valor) });

    const catLabel = getCatLabel(p) || 'Sin categoría';
    porCategoria[catLabel] = (porCategoria[catLabel] || 0) + valor;

    if (p.costoUnit != null && p.precio) {
      sumaMargenPct += ((p.precio - p.costoUnit) / p.precio) * 100;
      nMargen++;
    }
  });

  porProducto.sort((a, b) => b.valor - a.valor);
  const topProductos = porProducto.slice(0, 5);
  const categoriasArr = Object.entries(porCategoria)
    .map(([label, valor]) => ({ label, valor: round2(valor) }))
    .filter(c => c.valor > 0)
    .sort((a, b) => b.valor - a.valor)
    .slice(0, 6);

  let ventasCount = 0, ventasValor = 0, entradasCount = 0, entradasValor = 0, mermasCount = 0, mermasValor = 0;
  const mermasPorMotivo = {};
  movs.forEach(m => {
    const t = m.fecha ? new Date(m.fecha).getTime() : 0;
    if (!t || t < since30) return;
    const p = getProducto(m.prodId);
    const costo = p && p.costoUnit ? p.costoUnit : 0;
    const valorMov = Math.abs(m.cantidad || 0) * costo;
    if (m.tipo === 'venta') { ventasCount++; ventasValor += valorMov; }
    else if (m.tipo === 'entrada') { entradasCount++; entradasValor += valorMov; }
    else if (m.tipo === 'merma') {
      mermasCount++; mermasValor += valorMov;
      const motivo = (m.motivo || 'Otro').split(' — ')[0];
      mermasPorMotivo[motivo] = (mermasPorMotivo[motivo] || 0) + 1;
    }
  });
  const mermasMotivoArr = Object.entries(mermasPorMotivo)
    .map(([motivo, count]) => ({ motivo, count }))
    .sort((a, b) => b.count - a.count);

  const pedidos = Object.values(db.pedidosProveedor || {});
  const gastoPorProveedor = {};
  let pedidosPendientes = 0;
  pedidos.forEach(pd => {
    if (pd.estado === 'pendiente') pedidosPendientes++;
    else if (pd.estado === 'recibido') {
      gastoPorProveedor[pd.proveedorNombre] = (gastoPorProveedor[pd.proveedorNombre] || 0) + (pd.total || 0);
    }
  });
  const proveedoresArr = Object.entries(gastoPorProveedor)
    .map(([nombre, total]) => ({ nombre, total: round2(total) }))
    .sort((a, b) => b.total - a.total)
    .slice(0, 5);

  return {
    valorTotal: round2(valorTotal), totalProds: prods.length, cOk, cBajo, cAgotado,
    margenMedio: nMargen ? round2(sumaMargenPct / nMargen) : null,
    topProductos, categoriasArr,
    ventasCount, ventasValor: round2(ventasValor),
    entradasCount, entradasValor: round2(entradasValor),
    mermasCount, mermasValor: round2(mermasValor),
    mermasMotivoArr, proveedoresArr, pedidosPendientes
  };
}

function buildBarList(items, opts) {
  if (!items || items.length === 0) return `<div class="empty-mini" style="padding:14px">Sin datos todavía</div>`;
  const max = Math.max(...items.map(opts.value)) || 1;
  return items.map(i => `
    <div class="bar-row">
      <div class="bar-row-top"><span>${opts.label(i)}</span><span>${opts.format(opts.value(i))}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4, opts.value(i) / max * 100)}%;background:${opts.color || 'var(--accent)'}"></div></div>
    </div>
  `).join('');
}

function buildDashboardHtml(d) {
  const totalStock = d.cOk + d.cBajo + d.cAgotado || 1;
  const gOk = d.cOk / totalStock * 100;
  const gBajo = gOk + (d.cBajo / totalStock * 100);

  return `
    <div class="dash-grid-top">
      <div class="dash-stat-card">
        <div class="dsc-label">Valor total en stock</div>
        <div class="dsc-value success">${fmtMoney(d.valorTotal)}</div>
      </div>
      <div class="dash-stat-card">
        <div class="dsc-label">Margen medio</div>
        <div class="dsc-value purple">${d.margenMedio != null ? d.margenMedio + '%' : '—'}</div>
        <div class="dsc-sub">${d.margenMedio != null ? 'sobre productos con costo y precio' : 'define costo y precio en Productos'}</div>
      </div>
      <div class="dash-stat-card">
        <div class="dsc-label">Mermas (30 días)</div>
        <div class="dsc-value danger">${fmtMoney(d.mermasValor)}</div>
        <div class="dsc-sub">${d.mermasCount} registro${d.mermasCount !== 1 ? 's' : ''}</div>
      </div>
      <div class="dash-stat-card">
        <div class="dsc-label">Pedidos pendientes</div>
        <div class="dsc-value warning">${d.pedidosPendientes}</div>
        <div class="dsc-sub">esperando recepción de proveedor</div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-title"><i class="fas fa-chart-pie"></i> Distribución del stock</div>
      <div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(var(--success) 0% ${gOk}%, var(--warning) ${gOk}% ${gBajo}%, var(--danger) ${gBajo}% 100%)">
          <div class="donut-hole"><span>${d.totalProds}</span><small>productos</small></div>
        </div>
        <div class="donut-legend">
          <div><span class="dl-dot" style="background:var(--success)"></span>En stock<strong>${d.cOk}</strong></div>
          <div><span class="dl-dot" style="background:var(--warning)"></span>Stock bajo<strong>${d.cBajo}</strong></div>
          <div><span class="dl-dot" style="background:var(--danger)"></span>Agotados<strong>${d.cAgotado}</strong></div>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-title"><i class="fas fa-arrow-right-arrow-left"></i> Movimientos (últimos 30 días)</div>
      <div class="mov30-grid">
        <div class="mov30-card">
          <div class="m30-icon" style="color:var(--accent)"><i class="fas fa-receipt"></i></div>
          <div class="m30-count">${d.ventasCount}</div>
          <div class="m30-valor">Ventas · ${fmtMoney(d.ventasValor)}</div>
        </div>
        <div class="mov30-card">
          <div class="m30-icon" style="color:var(--success)"><i class="fas fa-truck-ramp-box"></i></div>
          <div class="m30-count">${d.entradasCount}</div>
          <div class="m30-valor">Entradas · ${fmtMoney(d.entradasValor)}</div>
        </div>
        <div class="mov30-card">
          <div class="m30-icon" style="color:var(--danger)"><i class="fas fa-triangle-exclamation"></i></div>
          <div class="m30-count">${d.mermasCount}</div>
          <div class="m30-valor">Mermas · ${fmtMoney(d.mermasValor)}</div>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-title"><i class="fas fa-ranking-star"></i> Top 5 productos por valor en stock</div>
      ${buildBarList(d.topProductos, {
        value: i => i.valor,
        label: i => `${i.icono || '🍽️'} ${escHtml(i.nombre)}`,
        format: v => fmtMoney(v),
        color: 'var(--accent)'
      })}
    </div>

    <div class="dash-section">
      <div class="dash-section-title"><i class="fas fa-layer-group"></i> Valor de inventario por categoría</div>
      ${buildBarList(d.categoriasArr, {
        value: i => i.valor,
        label: i => escHtml(i.label),
        format: v => fmtMoney(v),
        color: 'var(--purple)'
      })}
    </div>

    <div class="dash-section">
      <div class="dash-section-title"><i class="fas fa-triangle-exclamation"></i> Mermas por motivo (30 días)</div>
      ${buildBarList(d.mermasMotivoArr, {
        value: i => i.count,
        label: i => escHtml(i.motivo),
        format: v => v + (v === 1 ? ' registro' : ' registros'),
        color: 'var(--danger)'
      })}
    </div>

    <div class="dash-section">
      <div class="dash-section-title"><i class="fas fa-truck-field"></i> Gasto por proveedor (pedidos recibidos)</div>
      ${buildBarList(d.proveedoresArr, {
        value: i => i.total,
        label: i => escHtml(i.nombre),
        format: v => fmtMoney(v),
        color: 'var(--success)'
      })}
    </div>
  `;
}
</script>
</body>
</html>
