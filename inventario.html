<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inventario · HOTTO DIGITAL</title>
<meta name="theme-color" content="#05070d">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #05070d;
  --bg2:         #080b14;
  --surface:     #0c1020;
  --surface2:    #111829;
  --surface3:    #192035;
  --border:      rgba(255,255,255,0.055);
  --border-hi:   rgba(255,255,255,0.13);
  --text:        #e8edf8;
  --text2:       #a8b3cc;
  --muted:       #4a5572;
  --accent:      #ff6b35;
  --accent2:     #ff8f5e;
  --success:     #00e5a0;
  --success-dk:  #00b87e;
  --danger:      #ff3b5c;
  --warning:     #f7c948;
  --cocina:      #ff6b35;
  --barra:       #4a9eff;
  --purple:      #a78bfa;
  --r:           10px;
  --r-md:        14px;
  --r-lg:        18px;
  --fh:          'Space Grotesk', sans-serif;
  --fb:          'Space Grotesk', sans-serif;
}

html, body { background: var(--bg); color: var(--text); font-family: var(--fb); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; padding-bottom: 40px; }

/* ── Header ─────────────────────────────────────── */
.inv-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  background: rgba(8,11,20,0.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.inv-logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(255,107,53,0.35);
}
.inv-title { font-family: var(--fh); font-weight: 800; font-size: 1.05rem; letter-spacing: 0.3px; }
.inv-title span { color: var(--accent); }
.inv-subtitle { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }
.inv-header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.badge-sync {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.65rem; font-weight: 700; letter-spacing: 0.3px;
  padding: 5px 11px; border-radius: 100px;
  background: rgba(0,229,160,0.1); color: var(--success);
  border: 1px solid rgba(0,229,160,0.25);
  font-family: var(--fh); white-space: nowrap;
  transition: all 0.3s;
}
.badge-sync.offline { background: rgba(255,59,92,0.1); color: var(--danger); border-color: rgba(255,59,92,0.25); }
.badge-sync.connecting { background: rgba(247,201,72,0.1); color: var(--warning); border-color: rgba(247,201,72,0.25); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ── Avisos de stock del TPV (cocina/barra) ────── */
.stock-alertas-banner {
  background: rgba(247,201,72,0.06); border: 1px solid rgba(247,201,72,0.25);
  border-radius: var(--r-md); padding: 14px; margin-bottom: 16px;
}
.sab-header {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.8rem; font-weight: 700; color: var(--warning); margin-bottom: 10px;
}
.sab-list { display: flex; flex-direction: column; gap: 8px; }
.sab-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 9px 10px;
}
.sab-icon { font-size: 1.1rem; flex-shrink: 0; }
.sab-info { flex: 1; min-width: 0; }
.sab-name { font-size: 0.78rem; font-weight: 700; }
.sab-meta { font-size: 0.63rem; color: var(--muted); margin-top: 2px; }
.sab-zona {
  font-size: 0.56rem; font-weight: 800; padding: 3px 8px; border-radius: 100px;
  font-family: var(--fh); flex-shrink: 0; white-space: nowrap;
}
.sab-zona.cocina { background: rgba(255,107,53,0.12); color: var(--cocina); }
.sab-zona.barra  { background: rgba(74,158,255,0.12); color: var(--barra); }
.sab-actions { display: flex; gap: 6px; flex-shrink: 0; }
.sab-actions button {
  width: 28px; height: 28px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text2); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 0.7rem; transition: all 0.15s;
}
.sab-actions button:hover { color: var(--text); border-color: var(--border-hi); }
.sab-actions button.reponer { color: var(--success); border-color: rgba(0,229,160,0.3); }
.sab-actions button.reponer:hover { background: rgba(0,229,160,0.1); }

/* ── Layout ─────────────────────────────────────── */
.inv-main { max-width: 1280px; margin: 0 auto; padding: 18px; }

/* ── Stats strip ────────────────────────────────── */
.stats-strip {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin-bottom: 16px;
}
@media (min-width: 700px) { .stats-strip { grid-template-columns: repeat(4, 1fr); } }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  transition: border-color 0.2s;
}
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { border-color: var(--border-hi); }
.stat-card.active { border-color: var(--accent); background: rgba(255,107,53,0.06); }
.stat-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.stat-icon.total  { background: rgba(167,139,250,0.12); color: var(--purple); }
.stat-icon.ok     { background: rgba(0,229,160,0.1);    color: var(--success); }
.stat-icon.bajo   { background: rgba(247,201,72,0.1);   color: var(--warning); }
.stat-icon.agotado{ background: rgba(255,59,92,0.1);    color: var(--danger); }
.stat-value { font-family: var(--fh); font-weight: 800; font-size: 1.35rem; line-height: 1.1; }
.stat-label { font-size: 0.65rem; color: var(--muted); font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }

/* ── Toolbar ────────────────────────────────────── */
.toolbar {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin-bottom: 14px;
}
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-wrap i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.8rem; pointer-events: none; }
.search-input {
  width: 100%; padding: 10px 14px 10px 36px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text); font-size: 0.85rem;
  font-family: var(--fb); transition: border-color 0.15s;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }

.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-pill {
  padding: 9px 14px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); font-size: 0.75rem; font-weight: 700;
  font-family: var(--fh); letter-spacing: 0.2px;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.filter-pill:hover { border-color: var(--border-hi); }
.filter-pill.active { background: var(--accent); border-color: var(--accent); color: #05070d; }
.filter-pill.active.barra  { background: var(--barra);  border-color: var(--barra);  color: #05070d; }
.filter-pill.active.cocina { background: var(--cocina); border-color: var(--cocina); color: #05070d; }

/* ── Section headers ────────────────────────────── */
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin: 22px 0 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.section-head .ico { font-size: 1.05rem; }
.section-head h2 { font-family: var(--fh); font-size: 0.95rem; font-weight: 800; letter-spacing: 0.3px; }
.section-head .count { margin-left: auto; font-size: 0.68rem; color: var(--muted); font-weight: 600; }

/* ── Product grid ───────────────────────────────── */
.prod-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 10px;
}
.inv-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 13px;
  transition: border-color 0.2s;
  position: relative; overflow: hidden;
}
.inv-card.bajo    { border-color: rgba(247,201,72,0.35); }
.inv-card.agotado { border-color: rgba(255,59,92,0.4); }
.inv-card.bajo::before, .inv-card.agotado::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.inv-card.bajo::before    { background: var(--warning); }
.inv-card.agotado::before { background: var(--danger); }

.inv-card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.inv-icon {
  width: 38px; height: 38px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem; background: var(--surface2); flex-shrink: 0;
  overflow: hidden;
}
.inv-icon img { width: 100%; height: 100%; object-fit: cover; }
.inv-info { flex: 1; min-width: 0; }
.inv-name {
  font-size: 0.82rem; font-weight: 700; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.inv-cat { font-size: 0.62rem; color: var(--muted); margin-top: 2px; }

.inv-status-badge {
  font-size: 0.58rem; font-weight: 800; padding: 2px 8px; border-radius: 100px;
  font-family: var(--fh); letter-spacing: 0.4px; flex-shrink: 0;
  white-space: nowrap;
}
.inv-status-badge.ok     { background: rgba(0,229,160,0.1);  color: var(--success); border: 1px solid rgba(0,229,160,0.25); }
.inv-status-badge.bajo   { background: rgba(247,201,72,0.1); color: var(--warning); border: 1px solid rgba(247,201,72,0.25); }
.inv-status-badge.agotado{ background: rgba(255,59,92,0.1);  color: var(--danger);  border: 1px solid rgba(255,59,92,0.25); }

.inv-stock-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.stock-btn {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 1rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.12s; flex-shrink: 0;
}
.stock-btn:hover   { background: var(--surface3); border-color: var(--border-hi); }
.stock-btn:active  { transform: scale(0.92); }
.stock-btn.minus:hover { color: var(--danger);  border-color: rgba(255,59,92,0.3); }
.stock-btn.plus:hover  { color: var(--success); border-color: rgba(0,229,160,0.3); }

.stock-qty-input {
  flex: 1; text-align: center; font-family: var(--fh); font-weight: 800;
  font-size: 1.1rem; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 4px; color: var(--text);
  min-width: 0; transition: border-color 0.15s;
}
.stock-qty-input:focus { outline: none; border-color: var(--accent); }

.inv-meta-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.62rem; color: var(--muted);
}
.inv-min-edit { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.inv-min-edit input {
  width: 38px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 5px; color: var(--text2); font-size: 0.62rem;
  text-align: center; padding: 2px; font-family: var(--fb);
  transition: border-color 0.15s;
}
.inv-min-edit input:focus { outline: none; border-color: var(--accent); color: var(--text); }
.inv-updated { font-style: italic; }

/* ── Unit select & factor ───────────────────────── */
.stock-unit-select {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text2); font-size: 0.65rem;
  font-family: var(--fb); padding: 5px 4px; min-width: 52px;
  cursor: pointer; transition: border-color 0.15s;
}
.stock-unit-select:focus { outline: none; border-color: var(--accent); color: var(--text); }

.inv-actions-row { display: flex; gap: 6px; margin-top: 8px; }
.btn-reponer {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  background: rgba(0,229,160,0.08); border: 1px solid rgba(0,229,160,0.25);
  color: var(--success); border-radius: 8px; padding: 7px 8px;
  font-size: 0.68rem; font-weight: 700; font-family: var(--fh);
  cursor: pointer; transition: background 0.15s;
}
.btn-reponer:hover { background: rgba(0,229,160,0.16); }
.btn-factor {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); border-radius: 8px; padding: 7px 9px;
  font-size: 0.68rem; font-weight: 700; font-family: var(--fh);
  cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.btn-factor:hover { color: var(--text2); border-color: var(--border-hi); }
.btn-merma {
  width: 34px; height: 34px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,59,92,0.06); border: 1px solid rgba(255,59,92,0.25);
  color: var(--danger); border-radius: 8px; cursor: pointer; transition: background 0.15s;
}
.btn-merma:hover { background: rgba(255,59,92,0.14); }

/* ── Top action bar ─────────────────────────────── */
.top-actions { display: flex; justify-content: flex-end; margin-bottom: 4px; }
.btn-history {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); border-radius: 100px; padding: 8px 16px;
  font-size: 0.72rem; font-weight: 700; font-family: var(--fh);
  cursor: pointer; transition: all 0.15s;
}
.btn-history:hover { border-color: var(--border-hi); color: var(--text); }

/* ── Modal ──────────────────────────────────────── */
.inv-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; animation: fadeIn 0.15s ease; padding: 16px;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.inv-modal-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px; max-width: 380px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: slideUp 0.2s ease both; max-height: 80vh; overflow-y: auto;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.inv-modal-title {
  font-family: var(--fh); font-size: 0.95rem; font-weight: 800;
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
}
.inv-modal-sub { font-size: 0.7rem; color: var(--muted); margin-bottom: 14px; }
.inv-modal-label { font-size: 0.65rem; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; display: block; }
.inv-modal-input {
  width: 100%; padding: 9px 12px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: var(--r); color: var(--text);
  font-size: 0.85rem; font-family: var(--fb); margin-bottom: 12px;
  transition: border-color 0.15s;
}
.inv-modal-input:focus { outline: none; border-color: var(--accent); }
.inv-modal-row { display: flex; gap: 8px; }
.inv-modal-row > div { flex: 1; }
.btn-modal {
  padding: 10px 16px; border-radius: var(--r); border: none;
  font-family: var(--fh); font-weight: 700; font-size: 0.78rem;
  cursor: pointer; transition: opacity 0.15s; flex: 1;
}
.btn-modal:hover { opacity: 0.88; }
.btn-modal.primary { background: var(--success); color: #05070d; }
.btn-modal.ghost   { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }

/* ── History list ────────────────────────────────── */
.mov-list { display: flex; flex-direction: column; gap: 6px; }
.mov-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--r);
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 0.72rem;
}
.mov-icon {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 0.7rem;
}
.mov-icon.venta   { background: rgba(255,107,53,0.1); color: var(--accent); }
.mov-icon.entrada { background: rgba(0,229,160,0.1);  color: var(--success); }
.mov-icon.ajuste  { background: rgba(167,139,250,0.1);color: var(--purple); }
.mov-icon.merma   { background: rgba(255,59,92,0.1);  color: var(--danger); }
.mov-info { flex: 1; min-width: 0; }
.mov-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mov-meta { font-size: 0.6rem; color: var(--muted); margin-top: 1px; }
.mov-qty { font-family: var(--fh); font-weight: 800; font-size: 0.8rem; white-space: nowrap; }
.mov-qty.pos { color: var(--success); }
.mov-qty.neg { color: var(--danger); }
.mov-empty { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 30px 10px; }
.mov-filter-pills { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.mov-filter-pill {
  padding: 5px 11px; border-radius: 100px; font-size: 0.65rem; font-weight: 700;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  cursor: pointer; font-family: var(--fh); transition: all 0.15s;
}
.mov-filter-pill.active { background: var(--accent); border-color: var(--accent); color: #05070d; }

/* ── Empty state ────────────────────────────────── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state i { font-size: 2.2rem; margin-bottom: 10px; opacity: 0.3; display: block; }
.empty-state p { font-size: 0.85rem; }

/* ── Toast ──────────────────────────────────────── */
#toast-container { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border-hi);
  border-radius: 100px; padding: 9px 18px; font-size: 0.78rem; font-weight: 600;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  animation: toastIn 0.25s ease both;
}
.toast.success { color: var(--success); border-color: rgba(0,229,160,0.3); }
.toast.danger  { color: var(--danger);  border-color: rgba(255,59,92,0.3); }
.toast.info    { color: var(--text2); }
.toast.out { animation: toastOut 0.3s ease forwards; }
@keyframes toastIn  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }

/* ── Loading ─────────────────────────────────────── */
#loading-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999; gap: 12px;
}
.loading-spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid var(--surface3); border-top-color: var(--accent);
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 0.78rem; color: var(--muted); font-family: var(--fh); }

/* ── Tabs ───────────────────────────────────────── */
.tab-bar {
  display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border); padding-bottom: 10px;
}
.tab-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 16px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); font-size: 0.78rem; font-weight: 700;
  font-family: var(--fh); cursor: pointer; transition: all 0.15s;
}
.tab-btn:hover { border-color: var(--border-hi); }
.tab-btn.active { background: var(--accent); border-color: var(--accent); color: #05070d; }
.panel { display: none; }
.panel.active { display: block; }

/* ── Stats strip (ahora flexible) ──────────────── */
.stats-strip { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

/* ── Cost line on inventory cards ──────────────── */
.inv-cost-line {
  font-size: 0.63rem; color: var(--muted); margin-top: 6px;
  display: flex; justify-content: space-between; gap: 6px;
}
.inv-cost-line strong { color: var(--text2); }

/* ── Top action bar (productos / proveedores) ──── */
.admin-toolbar {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin-bottom: 14px;
}
.btn-primary-add {
  display: flex; align-items: center; gap: 7px;
  background: var(--accent); color: #05070d; border: none;
  border-radius: 100px; padding: 9px 16px;
  font-size: 0.75rem; font-weight: 800; font-family: var(--fh);
  cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
}
.btn-primary-add:hover { opacity: 0.88; }
.btn-secondary {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface); color: var(--text2); border: 1px solid var(--border);
  border-radius: 100px; padding: 9px 16px;
  font-size: 0.75rem; font-weight: 700; font-family: var(--fh);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-secondary:hover { border-color: var(--border-hi); color: var(--text); }

/* ── Product admin card ─────────────────────────── */
.padm-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 12px; display: flex; gap: 10px; align-items: flex-start;
}
.padm-icon {
  width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0;
  background: var(--surface2); display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; overflow: hidden;
}
.padm-icon img { width: 100%; height: 100%; object-fit: cover; }
.padm-info { flex: 1; min-width: 0; }
.padm-name { font-size: 0.85rem; font-weight: 700; }
.padm-meta { font-size: 0.65rem; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.padm-tipo-badge {
  font-size: 0.58rem; font-weight: 800; padding: 2px 8px; border-radius: 100px;
  font-family: var(--fh); letter-spacing: 0.3px;
}
.padm-tipo-badge.cocina { background: rgba(255,107,53,0.1); color: var(--cocina); }
.padm-tipo-badge.barra  { background: rgba(74,158,255,0.1); color: var(--barra); }
.padm-price-row { font-size: 0.68rem; color: var(--text2); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
.padm-price-row .margin-pos { color: var(--success); font-weight: 700; }
.padm-price-row .margin-neg { color: var(--danger); font-weight: 700; }
.padm-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.padm-actions button {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; font-size: 0.75rem;
}
.padm-actions button:hover { color: var(--text); border-color: var(--border-hi); }
.padm-actions button.danger:hover { color: var(--danger); border-color: rgba(255,59,92,0.3); }
.padm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

/* ── Category chips ─────────────────────────────── */
.cat-chip-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 260px; overflow-y: auto; }
.cat-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 8px 10px; font-size: 0.78rem;
}
.cat-chip .cc-label { flex: 1; }
.cat-chip .cc-tipo { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
.cat-chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 4px; }
.cat-chip button:hover { color: var(--danger); }

/* ── Supplier card ───────────────────────────────── */
.prov-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 14px; cursor: pointer; transition: border-color 0.15s;
}
.prov-card:hover { border-color: var(--border-hi); }
.prov-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.prov-icon {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  background: rgba(167,139,250,0.1); color: var(--purple);
  display: flex; align-items: center; justify-content: center; font-size: 1rem;
}
.prov-name { font-weight: 700; font-size: 0.88rem; }
.prov-sub { font-size: 0.65rem; color: var(--muted); }
.prov-contact-row { font-size: 0.7rem; color: var(--text2); display: flex; flex-direction: column; gap: 3px; }
.prov-contact-row i { width: 14px; color: var(--muted); }
.prov-count-badge {
  margin-left: auto; font-size: 0.62rem; font-weight: 700; color: var(--muted);
  background: var(--surface2); border-radius: 100px; padding: 3px 10px; white-space: nowrap;
}
.prov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }

/* ── Checkbox list (multi-select productos) ─────── */
.chk-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--r); padding: 8px; }
.chk-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 0.78rem; border-radius: 6px; }
.chk-item:hover { background: var(--surface2); }
.chk-item input { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }

/* ── Pedido item row ─────────────────────────────── */
.pedido-item-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.pedido-item-row .pi-name { flex: 1.4; font-size: 0.75rem; }
.pedido-item-row input { flex: 1; }
.pedido-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.pedido-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px; font-size: 0.75rem;
}
.pedido-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.pedido-estado { font-size: 0.6rem; font-weight: 800; padding: 2px 8px; border-radius: 100px; font-family: var(--fh); }
.pedido-estado.pendiente { background: rgba(247,201,72,0.1); color: var(--warning); }
.pedido-estado.recibido  { background: rgba(0,229,160,0.1); color: var(--success); }
.pedido-items-mini { color: var(--muted); font-size: 0.68rem; margin: 4px 0; }
.pedido-total { font-family: var(--fh); font-weight: 800; }

/* ── Dashboard / Estadísticas ────────────────────── */
.dash-grid-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.dash-stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; }
.dash-stat-card .dsc-label { font-size: 0.62rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 7px; }
.dash-stat-card .dsc-value { font-family: var(--fh); font-size: 1.3rem; font-weight: 800; color: var(--text); }
.dash-stat-card .dsc-value.success { color: var(--success); }
.dash-stat-card .dsc-value.danger  { color: var(--danger); }
.dash-stat-card .dsc-value.purple  { color: var(--purple); }
.dash-stat-card .dsc-value.warning { color: var(--warning); }
.dash-stat-card .dsc-sub { font-size: 0.62rem; color: var(--muted); margin-top: 3px; }

.dash-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; margin-bottom: 14px; }
.dash-section-title { font-family: var(--fh); font-weight: 700; font-size: 0.82rem; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--text); }
.dash-section-title i { color: var(--accent); }

.bar-row { margin-bottom: 12px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-row-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.74rem; margin-bottom: 5px; color: var(--text2); }
.bar-row-top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row-top span:last-child { color: var(--text); font-weight: 700; font-family: var(--fh); flex-shrink: 0; }
.bar-track { height: 7px; background: var(--surface2); border-radius: 100px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 100px; transition: width 0.3s; }

.donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut { width: 112px; height: 112px; border-radius: 50%; position: relative; flex-shrink: 0; }
.donut-hole { position: absolute; inset: 15px; background: var(--surface); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.donut-hole span { font-family: var(--fh); font-weight: 800; font-size: 1.35rem; }
.donut-hole small { font-size: 0.58rem; color: var(--muted); }
.donut-legend { display: flex; flex-direction: column; gap: 9px; font-size: 0.76rem; color: var(--text2); }
.donut-legend strong { color: var(--text); margin-left: 5px; font-family: var(--fh); }
.dl-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }

.mov30-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.mov30-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; text-align: center; }
.mov30-card .m30-icon { font-size: 1rem; margin-bottom: 6px; }
.mov30-card .m30-count { font-family: var(--fh); font-weight: 800; font-size: 1.1rem; }
.mov30-card .m30-valor { font-size: 0.66rem; color: var(--muted); margin-top: 2px; }

/* ── Empty small state ──────────────────────────── */
.empty-mini { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 30px 10px; }
.empty-mini i { font-size: 1.6rem; display: block; margin-bottom: 8px; opacity: 0.3; }

/* ── Responsive ─────────────────────────────────── */
@media (max-width: 480px) {
  .prod-grid { grid-template-columns: repeat(2, 1fr); }
  .inv-title { font-size: 0.92rem; }
  .padm-grid, .prov-grid { grid-template-columns: 1fr; }
  .btn-reponer, .btn-factor { font-size: 0.62rem; padding: 7px 6px; }
}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Conectando con Firebase…</div>
</div>

<header class="inv-header">
  <div class="inv-logo"><i class="fas fa-boxes-stacked"></i></div>
  <div>
    <div class="inv-title">HOTTO <span>GESTIÓN</span></div>
    <div class="inv-subtitle">Sincronizado en tiempo real con el TPV</div>
  </div>
  <div class="inv-header-right">
    <div id="sync-status" class="badge-sync connecting"><span class="sync-dot"></span>Conectando</div>
  </div>
</header>

<main class="inv-main">

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="stock"        onclick="setTab('stock')"><i class="fas fa-boxes-stacked"></i> Stock</button>
    <button class="tab-btn"        data-tab="productos"     onclick="setTab('productos')"><i class="fas fa-utensils"></i> Productos</button>
    <button class="tab-btn"        data-tab="proveedores"   onclick="setTab('proveedores')"><i class="fas fa-truck-field"></i> Proveedores</button>
    <button class="tab-btn"        data-tab="estadisticas"  onclick="setTab('estadisticas')"><i class="fas fa-chart-pie"></i> Estadísticas</button>
  </div>

  <!-- ═══════════ PANEL: STOCK ═══════════ -->
  <div class="panel active" id="panel-stock">

    <!-- Avisos de cocina/barra: producto agotando -->
    <div class="stock-alertas-banner" id="stock-alertas-banner" style="display:none">
      <div class="sab-header">
        <i class="fas fa-bell"></i>
        <strong id="stock-alertas-count">0</strong>&nbsp;aviso(s) de cocina/barra: producto agotando
      </div>
      <div class="sab-list" id="stock-alertas-list"></div>
    </div>

    <!-- Stats -->
    <div class="stats-strip">
      <div class="stat-card clickable" id="stat-total" onclick="setStatusFilter('todos')">
        <div class="stat-icon total"><i class="fas fa-cubes"></i></div>
        <div><div class="stat-value" id="st-total">0</div><div class="stat-label">Productos</div></div>
      </div>
      <div class="stat-card clickable" id="stat-ok" onclick="setStatusFilter('ok')">
        <div class="stat-icon ok"><i class="fas fa-check"></i></div>
        <div><div class="stat-value" id="st-ok">0</div><div class="stat-label">En stock</div></div>
      </div>
      <div class="stat-card clickable" id="stat-bajo" onclick="setStatusFilter('bajo')">
        <div class="stat-icon bajo"><i class="fas fa-triangle-exclamation"></i></div>
        <div><div class="stat-value" id="st-bajo">0</div><div class="stat-label">Stock bajo</div></div>
      </div>
      <div class="stat-card clickable" id="stat-agotado" onclick="setStatusFilter('agotado')">
        <div class="stat-icon agotado"><i class="fas fa-circle-xmark"></i></div>
        <div><div class="stat-value" id="st-agotado">0</div><div class="stat-label">Agotados</div></div>
      </div>
      <div class="stat-card" id="stat-valor">
        <div class="stat-icon" style="background:rgba(0,229,160,0.1);color:var(--success)"><i class="fas fa-sack-dollar"></i></div>
        <div><div class="stat-value" id="st-valor">0€</div><div class="stat-label">Valor stock</div></div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" class="search-input" id="search-input" placeholder="Buscar producto..." oninput="render()">
      </div>
      <div class="filter-pills">
        <button class="filter-pill active" data-tipo="todos"   onclick="setTipoFilter('todos')"><i class="fas fa-layer-group"></i> Todo</button>
        <button class="filter-pill"        data-tipo="cocina"  onclick="setTipoFilter('cocina')"><i class="fas fa-fire-burner"></i> Cocina</button>
        <button class="filter-pill"        data-tipo="barra"   onclick="setTipoFilter('barra')"><i class="fas fa-wine-glass"></i> Barra</button>
      </div>
      <button class="btn-history" onclick="showHistorialModal()"><i class="fas fa-clock-rotate-left"></i> Historial</button>
    </div>

    <div id="content"></div>
  </div>

  <!-- ═══════════ PANEL: PRODUCTOS ═══════════ -->
  <div class="panel" id="panel-productos">
    <div class="admin-toolbar">
      <div class="search-wrap">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" class="search-input" id="prod-search-input" placeholder="Buscar producto..." oninput="renderProductos()">
      </div>
      <button class="btn-secondary" onclick="showCategoriasModal()"><i class="fas fa-tags"></i> Categorías</button>
      <button class="btn-primary-add" onclick="showProductoModal()"><i class="fas fa-plus"></i> Nuevo producto</button>
    </div>
    <div id="productos-content"></div>
  </div>

  <!-- ═══════════ PANEL: PROVEEDORES ═══════════ -->
  <div class="panel" id="panel-proveedores">
    <div class="admin-toolbar">
      <div class="search-wrap">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" class="search-input" id="prov-search-input" placeholder="Buscar proveedor..." oninput="renderProveedores()">
      </div>
      <button class="btn-primary-add" onclick="showProveedorModal()"><i class="fas fa-plus"></i> Nuevo proveedor</button>
    </div>
    <div id="proveedores-content"></div>
  </div>

  <!-- ═══════════ PANEL: ESTADÍSTICAS ═══════════ -->
  <div class="panel" id="panel-estadisticas">
    <div id="estadisticas-content"></div>
  </div>

</main>

<div id="toast-container"></div>

<script>
/* ════════════════════════════════════
   FIREBASE CONFIG
════════════════════════════════════ */
const _FB_URL_DEFAULT = "https://tpv-hottodigital-default-rtdb.europe-west1.firebasedatabase.app/";
const firebaseConfig = {
  databaseURL: localStorage.getItem('firebaseURL') || _FB_URL_DEFAULT
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();

/* ════════════════════════════════════
   ESTADO LOCAL
════════════════════════════════════ */
let db = { productos: [], categorias: [], inventario: {}, inventarioMovimientos: {}, proveedores: {}, pedidosProveedor: {}, escandallos: {}, escandallosVariante: {}, stockAlertas: [] };
let _ready = false;
let activeTab = 'stock'; // stock | productos | proveedores
let filtroTipo   = 'todos';  // todos | cocina | barra
let filtroEstado = 'todos';  // todos | ok | bajo | agotado
let _historialFiltro = 'todos';
let _prodTipoEnModal = 'cocina'; // tipo seleccionado dentro del formulario de producto
let _escandalloProdId = null;
let _escandalloEdit = []; // filas en edición dentro del modal de consumo/receta
let _escandalloVarianteSel = null; // nombre de la variante en edición dentro del modal (null = producto/receta base)

const UNIDADES = ['ud', 'kg', 'g', 'l', 'ml', 'botella', 'caja', 'paquete', 'barril'];

/* ════════════════════════════════════
   FIREBASE: ESCUCHA SELECTIVA (no escucha / entero)
════════════════════════════════════ */

// Escuchar solo los nodos que necesitamos
rtdb.ref('/productos').on('value', snap => {
  db.productos = snap.val() || [];
  if (!Array.isArray(db.productos)) {
    // Si llegó como objeto (firebase push keys), convertir a array
    db.productos = Object.values(db.productos);
  }
  renderIfReady();
});

rtdb.ref('/categorias').on('value', snap => {
  db.categorias = snap.val() || [];
  if (!Array.isArray(db.categorias)) db.categorias = Object.values(db.categorias);
  renderIfReady();
});

rtdb.ref('/inventario').on('value', snap => {
  db.inventario = snap.val() || {};
  renderIfReady();
});

// Movimientos como objeto con push keys (NO array — los arrays en RTDB son frágiles)
rtdb.ref('/inventarioMovimientos').on('value', snap => {
  const raw = snap.val() || {};
  // Normalizar: si llegó como array (legacy), convertir
  if (Array.isArray(raw)) {
    const obj = {};
    raw.forEach((m, i) => { if (m) obj['legacy_' + i] = m; });
    db.inventarioMovimientos = obj;
  } else {
    db.inventarioMovimientos = raw;
  }
  renderIfReady();
});

// Avisos del equipo de cocina/barra (reportados desde el TPV)
rtdb.ref('/stockAlertas').on('value', snap => {
  db.stockAlertas = snap.val() || [];
  renderIfReady();
  renderStockAlertasBanner();
});

rtdb.ref('/proveedores').on('value', snap => {
  db.proveedores = snap.val() || {};
  renderIfReady();
});

rtdb.ref('/pedidosProveedor').on('value', snap => {
  db.pedidosProveedor = snap.val() || {};
  renderIfReady();
});

rtdb.ref('/escandallos').on('value', snap => {
  db.escandallos = snap.val() || {};
  renderIfReady();
});

rtdb.ref('/escandallosVariante').on('value', snap => {
  db.escandallosVariante = snap.val() || {};
  renderIfReady();
});

rtdb.ref('.info/connected').on('value', snap => {
  setSyncStatus(snap.val() === true ? 'online' : 'offline');
});

let _readyFlags = { productos: false, categorias: false, inventario: false, movimientos: false, proveedores: false, pedidos: false, escandallos: false, escandallosVariante: false, stockAlertas: false };
// Marcamos ready cuando lleguen los datos críticos
rtdb.ref('/productos').once('value',   () => { _readyFlags.productos = true;   trySetReady(); });
rtdb.ref('/categorias').once('value',  () => { _readyFlags.categorias = true;  trySetReady(); });
rtdb.ref('/inventario').once('value',  () => { _readyFlags.inventario = true;  trySetReady(); });
rtdb.ref('/inventarioMovimientos').once('value', () => { _readyFlags.movimientos = true; trySetReady(); });
rtdb.ref('/proveedores').once('value', () => { _readyFlags.proveedores = true; trySetReady(); });
rtdb.ref('/pedidosProveedor').once('value', () => { _readyFlags.pedidos = true; trySetReady(); });
rtdb.ref('/escandallos').once('value', () => { _readyFlags.escandallos = true; trySetReady(); });
rtdb.ref('/escandallosVariante').once('value', () => { _readyFlags.escandallosVariante = true; trySetReady(); });
rtdb.ref('/stockAlertas').once('value', () => { _readyFlags.stockAlertas = true; trySetReady(); });

function trySetReady() {
  if (_readyFlags.productos && _readyFlags.categorias && _readyFlags.inventario && _readyFlags.movimientos && _readyFlags.proveedores && _readyFlags.pedidos && _readyFlags.escandallos && _readyFlags.escandallosVariante && _readyFlags.stockAlertas) {
    _ready = true;
    document.getElementById('loading-screen').style.display = 'none';
    setSyncStatus('online');
    render();
    renderStockAlertasBanner();
  }
}

function renderIfReady() {
  if (!_ready) return;
  if (activeTab === 'stock') render();
  else if (activeTab === 'productos') renderProductos();
  else if (activeTab === 'proveedores') renderProveedores();
  else if (activeTab === 'estadisticas') renderEstadisticas();
}

function setSyncStatus(state) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (state === 'online') {
    el.className = 'badge-sync';
    el.innerHTML = '<span class="sync-dot"></span>Sincronizado';
  } else if (state === 'offline') {
    el.className = 'badge-sync offline';
    el.innerHTML = '<span class="sync-dot"></span>Sin conexión';
  } else {
    el.className = 'badge-sync connecting';
    el.innerHTML = '<span class="sync-dot"></span>Conectando';
  }
}

/* ════════════════════════════════════
   SYNC: escrituras atómicas por nodo
════════════════════════════════════ */
let _syncDebounce = null;
function syncInventario() {
  // Debounce de 400ms para no saturar Firebase con clicks rápidos
  clearTimeout(_syncDebounce);
  _syncDebounce = setTimeout(() => {
    rtdb.ref('/inventario').set(db.inventario || {}).catch(err => {
      toast('Error al guardar. Comprueba la conexión.', 'danger');
      console.error('[inventario] sync error:', err);
    });
  }, 400);

/* ════════════════════════════════════
   AVISOS DE STOCK DEL TPV
   Reportados por cocina/barra ("Reportar producto agotando").
   Se guardan en /stockAlertas como ARRAY (mismo formato que usa
   el TPV) para no romper su panel de administración.
════════════════════════════════════ */
function renderStockAlertasBanner() {
  const banner = document.getElementById('stock-alertas-banner');
  const list = document.getElementById('stock-alertas-list');
  const countEl = document.getElementById('stock-alertas-count');
  if (!banner || !list) return;
  const alertas = db.stockAlertas || [];
  if (alertas.length === 0) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  if (countEl) countEl.textContent = alertas.length;

  const prods = Array.isArray(db.productos) ? db.productos : Object.values(db.productos || {});
  list.innerHTML = alertas.map(a => {
    const match = prods.find(p => (p.nombre || '').toLowerCase() === (a.nombre || '').toLowerCase());
    return `<div class="sab-item">
      <span class="sab-icon">${a.icono || '⚠️'}</span>
      <div class="sab-info">
        <div class="sab-name">${escHtml(a.nombre)}${a.nota ? ` <span style="color:var(--text2);font-weight:400">· ${escHtml(a.nota)}</span>` : ''}</div>
        <div class="sab-meta">${a.hora ? 'a las ' + escHtml(a.hora) : ''}${a.addedBy ? ' · ' + escHtml(a.addedBy) : ''}</div>
      </div>
      <span class="sab-zona ${a.monitor}">${a.monitor === 'barra' ? 'BARRA' : 'COCINA'}</span>
      <div class="sab-actions">
        ${match ? `<button class="reponer" onclick="showReponerModal(${match.id})" title="Reponer stock"><i class="fas fa-truck-ramp-box"></i></button>` : ''}
        <button onclick="dismissStockAlertaInv('${a.id}')" title="Descartar aviso"><i class="fas fa-xmark"></i></button>
      </div>
    </div>`;
  }).join('');
}

function dismissStockAlertaInv(id) {
  db.stockAlertas = (db.stockAlertas || []).filter(a => a.id !== id);
  syncStockAlertas();
  renderStockAlertasBanner();
  toast('Aviso descartado', 'success');
}

/** Al reponer stock, si el producto vuelve a estado "ok" quitamos automáticamente
 *  cualquier aviso pendiente de cocina/barra que coincida por nombre. */
function autoClearStockAlertas(prodId) {
  if (!db.stockAlertas || db.stockAlertas.length === 0) return;
  const p = getProducto(prodId);
  if (!p) return;
  const entry = getInvEntry(prodId);
  if (getEstado(entry) !== 'ok') return;
  const before = db.stockAlertas.length;
  db.stockAlertas = db.stockAlertas.filter(a => (a.nombre || '').toLowerCase() !== (p.nombre || '').toLowerCase());
  if (db.stockAlertas.length !== before) {
    syncStockAlertas();
    renderStockAlertasBanner();
  }
}

/* ════════════════════════════════════
   HELPERS
════════════════════════════════════ */
function escHtml(s) {
  return (s || '').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getCatLabel(p) {
  const cats = Array.isArray(db.categorias) ? db.categorias : Object.values(db.categorias);
  if (!p.catId) return null;
  const cat = cats.find(c => c.id === p.catId && c.tipo === p.tipo);
  return cat ? `${cat.icono || ''} ${cat.label || ''}`.trim() : null;
}

function getInvEntry(prodId) {
  if (!db.inventario) db.inventario = {};
  if (!db.inventario[prodId]) {
    db.inventario[prodId] = { cantidad: 0, unidad: 'ud', stockMinimo: 5, factorConsumo: 1, actualizado: null };
  }
  const e = db.inventario[prodId];
  if (e.cantidad      === undefined) e.cantidad      = 0;
  if (e.unidad        === undefined) e.unidad        = 'ud';
  if (e.stockMinimo   === undefined) e.stockMinimo   = 5;
  if (e.factorConsumo === undefined) e.factorConsumo = 1;
  return e;
}

function getEstado(entry) {
  if (entry.cantidad <= 0)                      return 'agotado';
  if (entry.cantidad <= entry.stockMinimo)      return 'bajo';
  return 'ok';
}

function round2(n) { return Math.round(n * 100) / 100; }

function toast(msg, type = 'info', icon = '') {
  const container = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: 'fa-check-circle', danger: 'fa-exclamation-circle', info: 'fa-info-circle' };
  t.innerHTML = `<i class="fas ${icon || icons[type] || icons.info}"></i><span>${escHtml(msg)}</span>`;
  container.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2500);
}

function fmtTime(iso) {
  if (!iso) return 'sin registrar';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return `hoy ${time}`;
  return `${d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' })} ${time}`;
}

/* ════════════════════════════════════
   REGISTRAR MOVIMIENTO
   Usa push keys de Firebase (no array)
════════════════════════════════════ */
function registrarMovimiento(prodId, prodNombre, tipo, cantidad, motivo) {
  if (!db.inventarioMovimientos) db.inventarioMovimientos = {};
  const key = 'mv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  db.inventarioMovimientos[key] = {
    id: key,
    prodId,
    prodNombre,
    tipo,        // 'venta' | 'entrada' | 'ajuste'
    cantidad,
    motivo: motivo || '',
    fecha: new Date().toISOString(),
    usuario: 'Inventario'
  };

  // Limitar a 500 entradas: borrar las más antiguas
  const keys = Object.keys(db.inventarioMovimientos);
  if (keys.length > 500) {
    // Ordenar por fecha y eliminar las más viejas
    const sorted = keys.sort((a, b) => {
      const fa = db.inventarioMovimientos[a]?.fecha || '';
      const fb = db.inventarioMovimientos[b]?.fecha || '';
      return fa.localeCompare(fb);
    });
    sorted.slice(0, keys.length - 500).forEach(k => delete db.inventarioMovimientos[k]);
  }

  syncMovimientos();
}

/* ════════════════════════════════════
   MUTACIONES DE STOCK
════════════════════════════════════ */
function changeStock(prodId, delta) {
  const entry = getInvEntry(prodId);
  const before = entry.cantidad;
  entry.cantidad = Math.max(0, round2(entry.cantidad + delta));
  entry.actualizado = new Date().toISOString();
  const real = round2(entry.cantidad - before);
  if (real !== 0) {
    const p = getProducto(prodId);
    registrarMovimiento(prodId, p?.nombre || '', 'ajuste', real, 'Ajuste manual');
  }
  syncInventario();
  // Actualizar solo el input del card en cuestión (no re-renderizar todo)
  const input = document.getElementById('qty-' + prodId);
  if (input && document.activeElement !== input) input.value = entry.cantidad;
  refreshCard(prodId);
}

function setStockExact(prodId, value) {
  const entry = getInvEntry(prodId);
  const v = parseFloat(value);
  if (isNaN(v) || v < 0) { render(); return; }
  const before = entry.cantidad;
  entry.cantidad = round2(v);
  entry.actualizado = new Date().toISOString();
  const diff = round2(entry.cantidad - before);
  if (diff !== 0) {
    const p = getProducto(prodId);
    registrarMovimiento(prodId, p?.nombre || '', 'ajuste', diff, 'Edición manual de cantidad');
  }
  syncInventario();
  refreshCard(prodId);
}

function setStockMinimo(prodId, value) {
  const entry = getInvEntry(prodId);
  const v = parseFloat(value);
  if (isNaN(v) || v < 0) { render(); return; }
  entry.stockMinimo = round2(v);
  syncInventario();
  refreshCard(prodId);
}

function setStockUnidad(prodId, value) {
  const entry = getInvEntry(prodId);
  entry.unidad = value;
  syncInventario();
}

/* Actualiza solo los badges/estado de una card sin re-renderizar todo */
function refreshCard(prodId) {
  const entry = getInvEntry(prodId);
  const estado = getEstado(entry);
  const card = document.getElementById('inv-card-' + prodId);
  if (!card) { render(); return; }

  // Clases de estado en la card
  card.classList.remove('ok', 'bajo', 'agotado');
  card.classList.add(estado);

  // Badge
  const badge = card.querySelector('.inv-status-badge');
  if (badge) {
    badge.className = `inv-status-badge ${estado}`;
    badge.textContent = estado === 'ok' ? 'EN STOCK' : estado === 'bajo' ? 'STOCK BAJO' : 'AGOTADO';
  }

  // Timestamp
  const upd = card.querySelector('.inv-updated');
  if (upd) upd.textContent = fmtTime(entry.actualizado);

  // Actualizar stats globales (rápido)
  updateStats();

  // Si el producto volvió a estado "ok", limpiar avisos de cocina/barra que lo mencionen
  autoClearStockAlertas(prodId);
}

function updateStats() {
  const allProds = Array.isArray(db.productos) ? db.productos : Object.values(db.productos);
  let cTotal = allProds.length, cOk = 0, cBajo = 0, cAgotado = 0, valorTotal = 0;
  allProds.forEach(p => {
    const entry = getInvEntry(p.id);
    const est = getEstado(entry);
    if (est === 'ok')       cOk++;
    else if (est === 'bajo') cBajo++;
    else                     cAgotado++;
    if (p.costoUnit) valorTotal += (entry.cantidad || 0) * p.costoUnit;
  });
  document.getElementById('st-total').textContent   = cTotal;
  document.getElementById('st-ok').textContent      = cOk;
  document.getElementById('st-bajo').textContent    = cBajo;
  document.getElementById('st-agotado').textContent = cAgotado;
  const stValor = document.getElementById('st-valor');
  if (stValor) stValor.textContent = fmtMoney(valorTotal);
}

function fmtMoney(n) {
  return (Math.round((n || 0) * 100) / 100).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';
}

/* ════════════════════════════════════
   MODAL: REPONER STOCK
════════════════════════════════════ */
function showReponerModal(prodId) {
  const p = getProducto(prodId);
  if (!p) return;
  const entry = getInvEntry(prodId);
  closeModal();
  const modal = createModal(`
    <div class="inv-modal-title"><i class="fas fa-truck-ramp-box" style="color:var(--success)"></i> Reponer stock</div>
    <div class="inv-modal-sub">${escHtml(p.icono || '🍽️')} ${escHtml(p.nombre)} · actual: <strong>${entry.cantidad} ${escHtml(entry.unidad)}</strong></div>
    <label class="inv-modal-label">Cantidad a añadir</label>
    <input type="number" id="reponer-cantidad" class="inv-modal-input" min="0.01" step="any" placeholder="0" autofocus>
    <label class="inv-modal-label">Motivo / proveedor (opcional)</label>
    <input type="text" id="reponer-motivo" class="inv-modal-input" placeholder="ej. Pedido Makro, recepción semanal...">
    <div class="inv-modal-row">
      <button class="btn-modal ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-modal primary" onclick="confirmReponer(${prodId})"><i class="fas fa-check"></i> Añadir al stock</button>
    </div>
  `);
  // Enter para confirmar
  modal.querySelector('#reponer-cantidad').addEventListener('keydown', e => { if (e.key === 'Enter') confirmReponer(prodId); });
  modal.querySelector('#reponer-motivo').addEventListener('keydown', e => { if (e.key === 'Enter') confirmReponer(prodId); });
  setTimeout(() => modal.querySelector('#reponer-cantidad')?.focus(), 60);
}

function confirmReponer(prodId) {
  const v = parseFloat(document.getElementById('reponer-cantidad')?.value);
  const motivo = (document.getElementById('reponer-motivo')?.value || '').trim() || 'Reposición de stock';
  if (isNaN(v) || v <= 0) { toast('Indica una cantidad válida', 'danger'); return; }
  const entry = getInvEntry(prodId);
  entry.cantidad = round2(entry.cantidad + v);
  entry.actualizado = new Date().toISOString();
  const p = getProducto(prodId);
  registrarMovimiento(prodId, p?.nombre || '', 'entrada', v, motivo);
  syncInventario();
  closeModal();
  toast(`"${p?.nombre}" → +${v} ${entry.unidad}`, 'success', 'fa-truck-ramp-box');
  refreshCard(prodId);
  // Actualizar el input del card
  const input = document.getElementById('qty-' + prodId);
  if (input) input.value = entry.cantidad;
}

/* ════════════════════════════════════
   MODAL: CONSUMO POR VENTA (simple o receta/escandallo)
   Si el producto tiene VARIANTES (creadas en el TPV, p.ej. "Coca-Cola"/"Fanta"
   dentro de un producto "Refresco"), se puede definir además una receta propia
   por cada variante — así cada una descuenta ingredientes distintos del stock.
   Si una variante no tiene receta propia, hereda el consumo/receta base del producto.
════════════════════════════════════ */
function showConsumoModal(prodId, varianteNombre) {
  const p = getProducto(prodId);
  if (!p) return;
  _escandalloProdId = prodId;
  _escandalloVarianteSel = varianteNombre || null;

  let modoInicial;
  if (_escandalloVarianteSel) {
    const escVar = ((db.escandallosVariante && db.escandallosVariante[prodId]) || {})[_escandalloVarianteSel] || [];
    _escandalloEdit = escVar.map(x => ({ ...x }));
    modoInicial = escVar.length > 0 ? 'receta' : 'heredado';
  } else {
    const escandallo = (db.escandallos && db.escandallos[prodId]) || [];
    _escandalloEdit = escandallo.map(x => ({ ...x }));
    modoInicial = escandallo.length > 0 ? 'receta' : 'simple';
  }

  const tieneVariantes = (p.variantes || []).length > 0;
  const variantePills = tieneVariantes ? `
    <div class="inv-modal-sub" style="margin-bottom:6px">Consumo para:</div>
    <div class="mov-filter-pills" id="consumo-variante-pills" style="margin-bottom:12px;flex-wrap:wrap">
      <button class="mov-filter-pill ${!_escandalloVarianteSel ? 'active' : ''}" onclick="showConsumoModal(${prodId}, null)"><i class="fas fa-cube"></i> Producto base</button>
      ${p.variantes.map(v => `<button class="mov-filter-pill ${_escandalloVarianteSel === v.nombre ? 'active' : ''}" onclick="showConsumoModal(${prodId}, ${JSON.stringify(v.nombre)})"><i class="fas fa-circle-dot" style="font-size:0.55rem"></i> ${escHtml(v.nombre)}</button>`).join('')}
    </div>` : '';

  closeModal();
  createModal(`
    <div class="inv-modal-title"><i class="fas fa-scale-balanced" style="color:var(--purple)"></i> Consumo por venta</div>
    <div class="inv-modal-sub">${escHtml(p.icono || '🍽️')} ${escHtml(p.nombre)}</div>
    ${variantePills}
    <div class="mov-filter-pills" id="consumo-modo-pills" style="margin-bottom:14px">
      ${_escandalloVarianteSel ? `
        <button class="mov-filter-pill ${modoInicial === 'heredado' ? 'active' : ''}" data-modo="heredado" onclick="setConsumoModo('heredado')"><i class="fas fa-arrow-turn-up"></i> Usar receta base</button>
        <button class="mov-filter-pill ${modoInicial === 'receta' ? 'active' : ''}" data-modo="receta" onclick="setConsumoModo('receta')"><i class="fas fa-list-check"></i> Receta propia</button>
      ` : `
        <button class="mov-filter-pill ${modoInicial === 'simple' ? 'active' : ''}" data-modo="simple" onclick="setConsumoModo('simple')"><i class="fas fa-cube"></i> Consumo simple</button>
        <button class="mov-filter-pill ${modoInicial === 'receta' ? 'active' : ''}" data-modo="receta" onclick="setConsumoModo('receta')"><i class="fas fa-list-check"></i> Receta (varios ingredientes)</button>
      `}
    </div>
    <div id="consumo-modo-body"></div>
    <div class="inv-modal-row" style="margin-top:10px">
      <button class="btn-modal ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-modal primary" onclick="confirmConsumo()"><i class="fas fa-check"></i> Guardar</button>
    </div>
  `, '460px');
  renderConsumoModoBody(modoInicial);
}

function setConsumoModo(modo) {
  renderConsumoModoBody(modo);
}

function renderConsumoModoBody(modo) {
  document.querySelectorAll('#consumo-modo-pills .mov-filter-pill').forEach(b => b.classList.toggle('active', b.dataset.modo === modo));
  const body = document.getElementById('consumo-modo-body');
  if (!body) return;
  const entry = getInvEntry(_escandalloProdId);
  if (modo === 'simple') {
    body.innerHTML = `
      <p style="font-size:0.72rem;color:var(--text2);line-height:1.5;margin-bottom:12px">
        Cuántas <strong>${escHtml(entry.unidad)}</strong> de stock (del mismo producto) se descuentan automáticamente
        cada vez que se vende <strong>1 unidad</strong> de este producto en el TPV.<br>
        <span style="color:var(--muted)">Ponlo a <strong>0</strong> si no quieres gestionar su inventario.</span>
      </p>
      <label class="inv-modal-label">Consumo por venta (${escHtml(entry.unidad)})</label>
      <input type="number" id="factor-valor" class="inv-modal-input" min="0" step="any" value="${entry.factorConsumo}">
    `;
  } else if (modo === 'heredado') {
    body.innerHTML = `
      <p style="font-size:0.72rem;color:var(--text2);line-height:1.5">
        Esta variante no tiene receta propia: al venderse, se descontará el <strong>consumo o receta base</strong>
        definido para el producto (pestaña "Producto base").
      </p>
    `;
  } else {
    body.innerHTML = `
      <p style="font-size:0.72rem;color:var(--text2);line-height:1.5;margin-bottom:10px">
        ${_escandalloVarianteSel
          ? `Ingredientes que se descuentan de <strong>otros productos</strong> del stock cada vez que se vende
             1 unidad de la variante "<strong>${escHtml(_escandalloVarianteSel)}</strong>". Sustituye a la receta base solo para esta variante.`
          : `Define los ingredientes que se descuentan de <strong>otros productos</strong> del stock cada vez
             que se vende 1 unidad de este plato. Esto sustituye al consumo simple.`}
      </p>
      <div id="escandallo-rows"></div>
      <button class="btn-secondary" style="margin-top:8px" onclick="addEscandalloRow()"><i class="fas fa-plus"></i> Añadir ingrediente</button>
    `;
    renderEscandalloRows();
  }
}

function addEscandalloRow() {
  _escandalloEdit.push({ ingredienteId: null, cantidad: 1, unidad: 'ud' });
  renderEscandalloRows();
}

function removeEscandalloRow(idx) {
  _escandalloEdit.splice(idx, 1);
  renderEscandalloRows();
}

function updateEscandalloRow(idx, field, value) {
  if (!_escandalloEdit[idx]) return;
  if (field === 'ingredienteId') {
    const id = value === '' ? null : (isNaN(Number(value)) ? value : Number(value));
    _escandalloEdit[idx].ingredienteId = id;
    const ingP = getProducto(id);
    _escandalloEdit[idx].unidad = ingP ? getInvEntry(ingP.id).unidad : 'ud';
  } else if (field === 'cantidad') {
    _escandalloEdit[idx].cantidad = parseFloat(value);
  }
}

function renderEscandalloRows() {
  const container = document.getElementById('escandallo-rows');
  if (!container) return;
  const allProds = (Array.isArray(db.productos) ? db.productos : Object.values(db.productos))
    .filter(p => p.id !== _escandalloProdId)
    .slice()
    .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));

  if (_escandalloEdit.length === 0) {
    container.innerHTML = `<div class="empty-mini" style="padding:14px"><i class="fas fa-list-check"></i>Sin ingredientes todavía. Añade el primero.</div>`;
    return;
  }
  container.innerHTML = _escandalloEdit.map((row, idx) => `
    <div class="pedido-item-row">
      <select class="inv-modal-input" style="margin-bottom:0;flex:1.6" onchange="updateEscandalloRow(${idx}, 'ingredienteId', this.value)">
        <option value="">Selecciona ingrediente...</option>
        ${allProds.map(p => `<option value="${p.id}" ${String(row.ingredienteId) === String(p.id) ? 'selected' : ''}>${p.icono || '🍽️'} ${escHtml(p.nombre)}</option>`).join('')}
      </select>
      <input type="number" min="0" step="any" class="inv-modal-input" style="margin-bottom:0" placeholder="Cant." value="${row.cantidad != null && !isNaN(row.cantidad) ? row.cantidad : ''}" onchange="updateEscandalloRow(${idx}, 'cantidad', this.value)">
      <button class="btn-secondary" style="padding:8px 10px" onclick="removeEscandalloRow(${idx})" title="Quitar"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');
}

function confirmConsumo() {
  const activeModo = document.querySelector('#consumo-modo-pills .mov-filter-pill.active')?.dataset.modo || 'simple';
  const prodId = _escandalloProdId;

  if (!db.escandallos) db.escandallos = {};
  if (!db.escandallosVariante) db.escandallosVariante = {};

  if (_escandalloVarianteSel) {
    // ── Receta específica de una variante ──
    if (!db.escandallosVariante[prodId]) db.escandallosVariante[prodId] = {};
    if (activeModo === 'heredado') {
      delete db.escandallosVariante[prodId][_escandalloVarianteSel];
      if (Object.keys(db.escandallosVariante[prodId]).length === 0) delete db.escandallosVariante[prodId];
    } else {
      const valid = _escandalloEdit
        .filter(r => r.ingredienteId != null && r.ingredienteId !== '' && !isNaN(r.cantidad) && r.cantidad > 0)
        .map(r => ({ ingredienteId: r.ingredienteId, cantidad: round2(r.cantidad), unidad: r.unidad || 'ud' }));
      if (valid.length === 0) { toast('Añade al menos un ingrediente con cantidad', 'danger'); return; }
      db.escandallosVariante[prodId][_escandalloVarianteSel] = valid;
    }
    syncEscandallosVariante();
  } else {
    // ── Consumo/receta base del producto ──
    const entry = getInvEntry(prodId);
    if (activeModo === 'simple') {
      const v = parseFloat(document.getElementById('factor-valor')?.value);
      if (isNaN(v) || v < 0) { toast('Indica un valor válido', 'danger'); return; }
      entry.factorConsumo = round2(v);
      delete db.escandallos[prodId];
      syncInventario();
      syncEscandallos();
    } else {
      const valid = _escandalloEdit
        .filter(r => r.ingredienteId != null && r.ingredienteId !== '' && !isNaN(r.cantidad) && r.cantidad > 0)
        .map(r => ({ ingredienteId: r.ingredienteId, cantidad: round2(r.cantidad), unidad: r.unidad || 'ud' }));
      if (valid.length === 0) { toast('Añade al menos un ingrediente con cantidad', 'danger'); return; }
      db.escandallos[prodId] = valid;
      syncEscandallos();
    }
  }
  closeModal();
  toast('Consumo por venta actualizado', 'success');
  render();
}

════════════════════════════════════ */
function showMermaModal(prodId) {
  const p = getProducto(prodId);
  if (!p) return;
  const entry = getInvEntry(prodId);
  closeModal();
  const modal = createModal(`
    <div class="inv-modal-title"><i class="fas fa-triangle-exclamation" style="color:var(--danger)"></i> Registrar merma</div>
    <div class="inv-modal-sub">${escHtml(p.icono || '🍽️')} ${escHtml(p.nombre)} · actual: <strong>${entry.cantidad} ${escHtml(entry.unidad)}</strong></div>
    <label class="inv-modal-label">Cantidad perdida (${escHtml(entry.unidad)})</label>
    <input type="number" id="merma-cantidad" class="inv-modal-input" min="0.01" step="any" placeholder="0">
    <label class="inv-modal-label">Motivo</label>
    <select id="merma-motivo" class="inv-modal-input">
      <option value="Rotura">Rotura</option>
      <option value="Caducado">Caducado</option>
      <option value="Consumo interno">Consumo interno / personal</option>
      <option value="Error de cocina">Error de cocina o barra</option>
      <option value="Robo o pérdida">Robo o pérdida</option>
      <option value="Otro">Otro</option>
    </select>
    <label class="inv-modal-label">Detalle (opcional)</label>
    <input type="text" id="merma-detalle" class="inv-modal-input" placeholder="ej. Se cayó una bandeja...">
    <div class="inv-modal-row">
      <button class="btn-modal ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-modal" style="background:var(--danger);color:#fff" onclick="confirmMerma(${prodId})"><i class="fas fa-check"></i> Registrar</button>
    </div>
  `);
  modal.querySelector('#merma-cantidad').addEventListener('keydown', e => { if (e.key === 'Enter') confirmMerma(prodId); });
  setTimeout(() => modal.querySelector('#merma-cantidad')?.focus(), 60);
}

function confirmMerma(prodId) {
  const v = parseFloat(document.getElementById('merma-cantidad')?.value);
  const motivo = document.getElementById('merma-motivo')?.value || 'Otro';
  const detalle = (document.getElementById('merma-detalle')?.value || '').trim();
  if (isNaN(v) || v <= 0) { toast('Indica una cantidad válida', 'danger'); return; }

  const entry = getInvEntry(prodId);
  const before = entry.cantidad;
  entry.cantidad = Math.max(0, round2(entry.cantidad - v));
  entry.actualizado = new Date().toISOString();
  const real = round2(before - entry.cantidad);

  const p = getProducto(prodId);
  const motivoTexto = motivo + (detalle ? ` — ${detalle}` : '');
  registrarMovimiento(prodId, p?.nombre || '', 'merma', -real, motivoTexto);
  syncInventario();

  closeModal();
  toast(`Merma registrada: -${real} ${entry.unidad}`, 'danger', 'fa-triangle-exclamation');
  refreshCard(prodId);
  const input = document.getElementById('qty-' + prodId);
  if (input) input.value = entry.cantidad;
}

      <button class="mov-filter-pill" data-mfiltro="merma"   onclick="setHistFiltro('merma')"><i class="fas fa-triangle-exclamation"></i> Mermas</button>

    </div>
    <div id="mov-list-container"></div>
    <div class="inv-modal-row" style="margin-top:14px">
      <button class="btn-modal ghost" onclick="closeModal()">Cerrar</button>
    </div>
  `, '440px');
  renderHistorial();
}

function setHistFiltro(f) {
  _historialFiltro = f;
  renderHistorial();
}

function renderHistorial() {
  const container = document.getElementById('mov-list-container');
  if (!container) return;

  // Actualizar pills
  document.querySelectorAll('.mov-filter-pill[data-mfiltro]').forEach(el => {
    el.classList.toggle('active', el.dataset.mfiltro === _historialFiltro);
  });

  // Obtener movimientos como array ordenado por fecha desc
  let movs = Object.values(db.inventarioMovimientos || {})
    .filter(m => m && m.fecha)
    .sort((a, b) => b.fecha.localeCompare(a.fecha));

  if (_historialFiltro !== 'todos') movs = movs.filter(m => m.tipo === _historialFiltro);
  movs = movs.slice(0, 60);

  if (movs.length === 0) {
    container.innerHTML = `<div class="mov-empty"><i class="fas fa-inbox" style="font-size:1.6rem;display:block;margin-bottom:8px;opacity:0.3"></i>Sin movimientos registrados</div>`;
    return;
  }

  const icons = { venta: 'fa-receipt', entrada: 'fa-truck-ramp-box', ajuste: 'fa-sliders', merma: 'fa-triangle-exclamation' };

  let summaryHtml = '';
  if (_historialFiltro === 'merma' && movs.length) {
    let valorPerdido = 0;
    movs.forEach(m => {
      const p = getProducto(m.prodId);
      if (p && p.costoUnit) valorPerdido += Math.abs(m.cantidad) * p.costoUnit;
    });
    summaryHtml = `<div style="background:rgba(255,59,92,0.08);border:1px solid rgba(255,59,92,0.25);border-radius:var(--r);padding:9px 12px;margin-bottom:10px;font-size:0.72rem;color:var(--danger);font-weight:700">
      <i class="fas fa-triangle-exclamation"></i> Valor estimado perdido (mostrado): ${fmtMoney(valorPerdido)}
    </div>`;
  }

  container.innerHTML = summaryHtml + `<div class="mov-list">${movs.map(m => {
    const isPos  = m.cantidad > 0;
    const isNeg  = m.cantidad < 0;
    const sign   = isPos ? 'pos' : (isNeg ? 'neg' : '');
    const signCh = isPos ? '+' : '';
    return `<div class="mov-item">
      <div class="mov-icon ${m.tipo || 'ajuste'}"><i class="fas ${icons[m.tipo] || 'fa-circle'}"></i></div>
      <div class="mov-info">
        <div class="mov-name">${escHtml(m.prodNombre)}</div>
        <div class="mov-meta">${escHtml(m.motivo || '')} · ${fmtTime(m.fecha)}${m.usuario ? ' · ' + escHtml(m.usuario) : ''}</div>
      </div>
      <div class="mov-qty ${sign}">${signCh}${m.cantidad}</div>
    </div>`;
  }).join('')}</div>`;
}

/* ════════════════════════════════════
   MODAL: UTILIDADES
════════════════════════════════════ */
function createModal(innerHtml, maxWidth = '380px') {
  const overlay = document.createElement('div');
  overlay.className = 'inv-modal-overlay';
  overlay.id = 'inv-modal';
  overlay.innerHTML = `<div class="inv-modal-box" style="max-width:${maxWidth}">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  // Escape para cerrar
  const escListener = e => { if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escListener); } };
  document.addEventListener('keydown', escListener);
  return overlay;
}

function closeModal() {
  document.getElementById('inv-modal')?.remove();
}

/* ════════════════════════════════════
   HELPERS DE PRODUCTOS
════════════════════════════════════ */
function getProducto(prodId) {
  const arr = Array.isArray(db.productos) ? db.productos : Object.values(db.productos);
  return arr.find(x => x.id === prodId || x.id === Number(prodId)) || null;
}

/* ════════════════════════════════════
   RENDER PRINCIPAL
════════════════════════════════════ */
function render() {
  if (!_ready) return;
  renderStockAlertasBanner();
  const search = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  let prods = Array.isArray(db.productos) ? db.productos.slice() : Object.values(db.productos);

  if (filtroTipo !== 'todos') prods = prods.filter(p => p.tipo === filtroTipo);
  if (search) prods = prods.filter(p => (p.nombre || '').toLowerCase().includes(search) || (p.icono || '').includes(search));
  if (filtroEstado !== 'todos') prods = prods.filter(p => getEstado(getInvEntry(p.id)) === filtroEstado);

  updateStats();
  updateStatActiveClass();

  const content = document.getElementById('content');

  if (prods.length === 0) {
    content.innerHTML = `<div class="empty-state">
      <i class="fas fa-box-open"></i>
      <p>No hay productos que coincidan con los filtros actuales.</p>
    </div>`;
    return;
  }

  if (filtroTipo === 'todos') {
    const cocina = prods.filter(p => p.tipo === 'cocina');
    const barra  = prods.filter(p => p.tipo === 'barra');
    let html = '';
    if (cocina.length) html += renderSection('🍳 Cocina', cocina);
    if (barra.length)  html += renderSection('🍷 Barra',  barra);
    content.innerHTML = html;
  } else {
    content.innerHTML = renderGrid(prods);
  }
}

function updateStatActiveClass() {
  ['stat-ok','stat-bajo','stat-agotado','stat-total'].forEach(id => {
    document.getElementById(id)?.classList.remove('active');
  });
  const map = { ok: 'stat-ok', bajo: 'stat-bajo', agotado: 'stat-agotado', todos: 'stat-total' };
  document.getElementById(map[filtroEstado] || 'stat-total')?.classList.add('active');
}

function renderSection(label, prods) {
  const ico   = label.split(' ')[0];
  const title = label.split(' ').slice(1).join(' ');
  return `
    <div class="section-head">
      <span class="ico">${ico}</span>
      <h2>${escHtml(title)}</h2>
      <span class="count">${prods.length} producto${prods.length !== 1 ? 's' : ''}</span>
    </div>
    ${renderGrid(prods)}
  `;
}

function renderGrid(prods) {
  const orden = { agotado: 0, bajo: 1, ok: 2 };
  const sorted = prods.slice().sort((a, b) => {
    const ea = getEstado(getInvEntry(a.id));
    const eb = getEstado(getInvEntry(b.id));
    if (orden[ea] !== orden[eb]) return orden[ea] - orden[eb];
    return (a.nombre || '').localeCompare(b.nombre || '', 'es');
  });
  return `<div class="prod-grid">${sorted.map(buildCard).join('')}</div>`;
}

function buildCard(p) {
  const entry     = getInvEntry(p.id);
  const estado    = getEstado(entry);
  const catLabel  = getCatLabel(p);
  const badgeText = estado === 'ok' ? 'EN STOCK' : estado === 'bajo' ? 'STOCK BAJO' : 'AGOTADO';
  const escandallo = (db.escandallos && db.escandallos[p.id]) || [];

  return `<div class="inv-card ${estado}" id="inv-card-${p.id}">
    <div class="inv-card-top">
      <div class="inv-icon">
        ${p.imagen ? `<img src="${escHtml(p.imagen)}" loading="lazy">` : `<span>${p.icono || '🍽️'}</span>`}
      </div>
      <div class="inv-info">
        <div class="inv-name">${escHtml(p.nombre)}</div>
        ${catLabel ? `<div class="inv-cat">${escHtml(catLabel)}</div>` : ''}
      </div>
      <span class="inv-status-badge ${estado}">${badgeText}</span>
    </div>
    <div class="inv-stock-row">
      <button class="stock-btn minus" onclick="changeStock(${p.id}, -1)"><i class="fas fa-minus"></i></button>
      <input type="number" class="stock-qty-input" id="qty-${p.id}"
             value="${entry.cantidad}" step="any" min="0"
             onchange="setStockExact(${p.id}, this.value)"
             onfocus="this.select()">
      <button class="stock-btn plus" onclick="changeStock(${p.id}, 1)"><i class="fas fa-plus"></i></button>
      <select class="stock-unit-select" onchange="setStockUnidad(${p.id}, this.value)">
        ${UNIDADES.map(u => `<option value="${u}"${entry.unidad === u ? ' selected' : ''}>${u}</option>`).join('')}
      </select>
    </div>
    <div class="inv-meta-row">
      <label class="inv-min-edit" title="Stock mínimo para alertar">
        <i class="fas fa-bell" style="font-size:0.6rem"></i> mín:
        <input type="number" value="${entry.stockMinimo}" min="0" step="any"
               onchange="setStockMinimo(${p.id}, this.value)">
      </label>
      <span class="inv-updated">${fmtTime(entry.actualizado)}</span>
    </div>
    <div class="inv-actions-row">
      <button class="btn-reponer" onclick="showReponerModal(${p.id})"><i class="fas fa-truck-ramp-box"></i> Reponer</button>
      <button class="btn-factor" onclick="showConsumoModal(${p.id})" title="Consumo por venta">
        ${escandallo.length ? `<i class="fas fa-list-check"></i> Receta (${escandallo.length})` : `<i class="fas fa-scale-balanced"></i> ×${entry.factorConsumo}`}
      </button>
      <button class="btn-merma" onclick="showMermaModal(${p.id})" title="Registrar merma"><i class="fas fa-triangle-exclamation"></i></button>
    </div>
    ${(p.variantes && p.variantes.length) ? (() => {
      const nVarConReceta = Object.keys((db.escandallosVariante && db.escandallosVariante[p.id]) || {}).length;
      return `<div class="inv-meta-row" style="margin-top:6px">
        <span style="font-size:0.65rem;color:var(--muted)"><i class="fas fa-list-ul"></i> ${p.variantes.length} variante${p.variantes.length>1?'s':''}${nVarConReceta ? ` · ${nVarConReceta} con receta propia` : ''}</span>
      </div>`;
    })() : ''}
    ${p.costoUnit ? `<div class="inv-cost-line"><span>Costo: <strong>${fmtMoney(p.costoUnit)}</strong>/${escHtml(entry.unidad)}</span><span>Valor: <strong>${fmtMoney(entry.cantidad * p.costoUnit)}</strong></span></div>` : ''}
  </div>`;
}

/* ════════════════════════════════════════════════════
   PANEL: PRODUCTOS (CRUD)
════════════════════════════════════════════════════ */
function renderProductos() {
  const search = (document.getElementById('prod-search-input')?.value || '').trim().toLowerCase();
  let prods = Array.isArray(db.productos) ? db.productos.slice() : Object.values(db.productos);
  if (search) prods = prods.filter(p => (p.nombre || '').toLowerCase().includes(search));
  prods.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));

  const container = document.getElementById('productos-content');
  if (!container) return;
  if (prods.length === 0) {
    container.innerHTML = `<div class="empty-mini"><i class="fas fa-utensils"></i>No hay productos que coincidan. Crea el primero con "Nuevo producto".</div>`;
    return;
  }
  container.innerHTML = `<div class="padm-grid">${prods.map(buildProdAdminCard).join('')}</div>`;
}

function buildProdAdminCard(p) {
  const catLabel = getCatLabel(p);
  const hasCosto = p.costoUnit != null && p.costoUnit !== '';
  const hasPrecio = p.precio != null && p.precio !== '';
  const margin = (hasCosto && hasPrecio) ? round2(p.precio - p.costoUnit) : null;
  const marginPct = (margin != null && p.precio) ? round2((margin / p.precio) * 100) : null;
  const escandallo = (db.escandallos && db.escandallos[p.id]) || [];
  const nVarConReceta = Object.keys((db.escandallosVariante && db.escandallosVariante[p.id]) || {}).length;

  return `<div class="padm-card">
    <div class="padm-icon">${p.imagen ? `<img src="${escHtml(p.imagen)}" loading="lazy">` : `<span>${p.icono || '🍽️'}</span>`}</div>
    <div class="padm-info">
      <div class="padm-name">${escHtml(p.nombre)}</div>
      <div class="padm-meta">
        <span class="padm-tipo-badge ${p.tipo}">${p.tipo === 'barra' ? 'BARRA' : 'COCINA'}</span>
        ${catLabel ? `<span>${escHtml(catLabel)}</span>` : ''}
        ${escandallo.length ? `<span style="color:var(--purple);font-weight:700">🧾 Receta (${escandallo.length})</span>` : ''}
        ${(p.variantes && p.variantes.length) ? `<span style="color:var(--info);font-weight:700">🔀 ${p.variantes.length} variantes${nVarConReceta ? ` (${nVarConReceta} c/receta)` : ''}</span>` : ''}
      </div>
      ${(hasCosto || hasPrecio) ? `<div class="padm-price-row">
        ${hasCosto ? `<span>Costo: <strong>${fmtMoney(p.costoUnit)}</strong></span>` : ''}
        ${hasPrecio ? `<span>Venta: <strong>${fmtMoney(p.precio)}</strong></span>` : ''}
        ${marginPct != null ? `<span class="${marginPct >= 0 ? 'margin-pos' : 'margin-neg'}">Margen: ${marginPct}%</span>` : ''}
      </div>` : ''}
    </div>
    <div class="padm-actions">
      <button onclick="showProductoModal(${p.id})" title="Editar"><i class="fas fa-pen"></i></button>
      <button class="danger" onclick="showDeleteProductoConfirm(${p.id})" title="Eliminar"><i class="fas fa-trash"></i></button>
    </div>
  </div>`;
}

    </div>
  `);

  refreshCatSelect(p ? p.catId : null);
  setTimeout(() => modal.querySelector('#pf-nombre')?.focus(), 60);
